---
- name: Resolve every controller's listen IP (needed for the peers list on all hosts)
  ansible.builtin.set_fact:
    spur_controller_listen_ip: >-
      {{ hostvars[item].spur_wg_address if spur_transport == 'wireguard'
         else (hostvars[item].ansible_host | default(hostvars[item].ansible_default_ipv4.address)) }}
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['spur_controllers'] }}"
  run_once: true

- name: Assign 1-based node_id to each controller (position in inventory)
  ansible.builtin.set_fact:
    spur_controller_node_id: "{{ groups['spur_controllers'].index(item) + 1 }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['spur_controllers'] }}"
  run_once: true

# Accounting host resolution, highest precedence first:
#   1. explicit spur_accounting_host (-e or inventory var) — user intent wins
#   2. the database_url already in the LIVE spur.conf — preserves an existing
#      cluster's DB target on re-render/upgrade even if this run's inventory
#      doesn't declare the accounting node (rolling_upgrade against an unknown
#      customer inventory must NOT silently repoint Postgres at a controller)
#   3. the [spur_accounting_node] inventory group (fresh deploy of a dedicated DB)
#   4. the first controller (co-located default)
- name: Resolve accounting IP from explicit spur_accounting_host
  vars:
    acct_host: "{{ spur_accounting_host }}"
  ansible.builtin.set_fact:
    spur_accounting_listen_ip: >-
      {{ hostvars[acct_host].spur_wg_address if spur_transport == 'wireguard'
         else (hostvars[acct_host].ansible_host
               | default(hostvars[acct_host].ansible_default_ipv4.address)) }}
  # delegate_facts (not a plain set_fact) so this is a real hostvar on every
  # controller, readable via hostvars[] from ANY host/play — including the
  # spur_agent role's spur.conf render, which runs in a later, separate play.
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['spur_controllers'] }}"
  run_once: true
  when:
    - spur_accounting_enabled | bool
    - spur_accounting_host is defined

- name: Read accounting IP from live spur.conf (no explicit spur_accounting_host)
  ansible.builtin.shell: |
    grep -oP '(?<=@)[^:/@]+(?=:[0-9]+/)' {{ spur_home }}/etc/spur.conf 2>/dev/null | head -1
  args:
    executable: /bin/bash
  register: spur_conf_acct_ip
  changed_when: false
  failed_when: false
  run_once: true
  when:
    - spur_accounting_enabled | bool
    - spur_accounting_host is not defined

- name: Preserve accounting IP from live spur.conf
  ansible.builtin.set_fact:
    spur_accounting_listen_ip: "{{ spur_conf_acct_ip.stdout | trim }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['spur_controllers'] }}"
  run_once: true
  when:
    - spur_accounting_enabled | bool
    - spur_accounting_host is not defined
    - spur_conf_acct_ip.stdout | default('') | trim | length > 0

- name: Derive accounting IP from group/controllers (no explicit var, no live spur.conf)
  vars:
    acct_host: "{{ groups['spur_accounting_node'][0] if (groups['spur_accounting_node'] | default([]) | length > 0) else groups['spur_controllers'][0] }}"
  ansible.builtin.set_fact:
    spur_accounting_listen_ip: >-
      {{ hostvars[acct_host].spur_wg_address if spur_transport == 'wireguard'
         else (hostvars[acct_host].ansible_host
               | default(hostvars[acct_host].ansible_default_ipv4.address)) }}
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['spur_controllers'] }}"
  run_once: true
  when:
    - spur_accounting_enabled | bool
    - spur_accounting_host is not defined
    - spur_conf_acct_ip.stdout | default('') | trim | length == 0

# spur.conf's [[nodes]] block needs ansible_processor_vcpus, ansible_memtotal_mb,
# and ansible_hostname for every agent. These are only available after fact-gathering.
# add_nodes.yml only gathers facts for the new nodes by the time the controller
# role runs, so any pre-existing agents may be missing facts entirely — this task
# fills that real gap and must stay enabled there
# (spur_controller_gather_missing_agent_facts, default true).
#
# deploy.yml/rolling_upgrade.yml already gather facts on the whole cluster up
# front (same ignore_unreachable tolerance), so by the time this task runs it
# only ever re-targets a host that JUST failed that same gather moments ago —
# a retry vanishingly unlikely to succeed. rolling_upgrade.yml disables this
# (spur_controller_gather_missing_agent_facts: false, set on the role in
# playbooks/rolling_upgrade.yml) because it's also the costliest place to run
# it: the controllers play is serial:1, so with C controllers and N still-down
# agents this retries every down agent, serially, C times over — pure downside
# once the ServerAlive keepalive fix bounds each attempt instead of letting it
# hang, since it's now a guaranteed-bounded wait for a guaranteed failure. The
# template's | default(0) fallback (see spur.conf.j2) makes skipping it safe:
# a still-unreachable agent gets cpus=0/memory_mb=0 in its [[nodes]] entry —
# identical to what a failed retry would have produced anyway.
- name: Gather facts for any agent missing them (needed for spur.conf [[nodes]] block)
  ansible.builtin.setup:
    gather_subset: "{{ spur_gather_subset | default(['!all', 'network', 'hardware', 'distribution']) }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['spur_agents'] }}"
  run_once: true
  when: >-
    (spur_controller_gather_missing_agent_facts | default(true) | bool) and
    hostvars[item].ansible_processor_vcpus is not defined
  ignore_unreachable: true
  ignore_errors: true

- name: Resolve short node name for each agent (used by spur.conf and --hostname)
  ansible.builtin.set_fact:
    spur_node_name: >-
      {{ hostvars[item].ansible_hostname
         | default(hostvars[item].inventory_hostname) }}
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['spur_agents'] }}"
  run_once: true
  when: hostvars[item].spur_node_name is not defined

# Client env so the CLI (squeue/sinfo/scontrol and sacct/sacctmgr/sreport/sshare —
# accounting is served on the same port as the controller API, no separate flag/env
# needed anymore) works on controllers without per-command flags. Controller-nodes
# only. Lists every controller (comma-separated) so the CLI's built-in endpoint
# rotation keeps working from this host even if this particular controller is down.
- name: Set SPUR_CONTROLLER_ADDR in /etc/environment (controllers)
  vars:
    all_controller_endpoints: >-
      {{ groups['spur_controllers']
         | map('extract', hostvars, 'spur_controller_listen_ip')
         | map('regex_replace', '^(.*)$', 'http://\1:' ~ spur_controller_port)
         | join(',') }}
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^SPUR_CONTROLLER_ADDR='
    line: "SPUR_CONTROLLER_ADDR={{ all_controller_endpoints }}"

# Accounting no longer has its own address/port — it rides on SPUR_CONTROLLER_ADDR.
# Strip any leftover SPUR_ACCOUNTING_ADDR from a pre-merge deployment of this host.
- name: Remove stale SPUR_ACCOUNTING_ADDR from /etc/environment
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^SPUR_ACCOUNTING_ADDR='
    state: absent

# Same write-if-missing opt-in as the spur_agent role's spur.conf render —
# force: no leaves an existing file alone unless spur_overwrite_conf=true.
- name: Write spur.conf
  ansible.builtin.template:
    src: spur.conf.j2
    dest: "{{ spur_home }}/etc/spur.conf"
    mode: "0644"
    force: "{{ spur_overwrite_conf | default(false) | bool }}"
  register: spur_conf
  when: not (spur_controller_skip_conf | default(false) | bool)

- name: Install spurctld systemd unit
  ansible.builtin.template:
    src: spurctld.service.j2
    dest: /etc/systemd/system/spurctld.service
    mode: "0644"
  register: spurctld_unit

# openraft ignores config peers after first init and uses the persisted
# membership, so a changed controller set can't take effect on restart.
# Fail loudly rather than break silently. Agents are not Raft members and
# can be added/removed freely without a wipe.
- name: Read persisted Raft peer addresses (HA, no-wipe)
  ansible.builtin.shell: |
    set -o pipefail
    grep -ho '"addr":"[^"]*"' {{ spur_home }}/state/raft/log/*.json 2>/dev/null \
      | sed -E 's/"addr":"([^"]*)"/\1/' | sort -u
  args:
    executable: /bin/bash
  register: raft_peers
  changed_when: false
  failed_when: false
  when:
    - spur_ha_enabled | bool
    - not (spur_wipe_state | bool)

- name: Fail if the controller (Raft) set changed without a state wipe
  ansible.builtin.fail:
    msg: >-
      Persisted Raft membership {{ raft_peers.stdout_lines | sort }} does not
      match the inventory controllers
      {{ groups['spur_controllers'] | map('extract', hostvars, 'spur_controller_listen_ip') | map('regex_replace', '$', ':' ~ spur_raft_port) | sort }}.
      Spur 0.3.0 has no online membership change, so adding/removing/reordering a
      controller needs a Raft reinit: re-run with -e spur_wipe_state=true.
      Adding/removing compute agents does not require this.
  vars:
    desired_peers: "{{ groups['spur_controllers'] | map('extract', hostvars, 'spur_controller_listen_ip') | map('regex_replace', '$', ':' ~ spur_raft_port) | sort }}"
  when:
    - spur_ha_enabled | bool
    - not (spur_wipe_state | bool)
    - raft_peers.stdout | default('') | length > 0
    - (raft_peers.stdout_lines | sort) != desired_peers

# Stop BEFORE wiping state so spurctld does not rewrite the Raft log we are about to delete.
# Only needed when we're actually wiping (and never when skip_restart is requested —
# add_nodes.yml refreshes spur.conf without touching the running controller).
- name: Stop spurctld before wiping state
  ansible.builtin.systemd:
    name: spurctld
    state: stopped
  failed_when: false
  when:
    - spur_wipe_state | bool
    - not (spur_controller_skip_restart | default(false) | bool)

- name: Wipe Raft state (when spur_wipe_state is true)
  ansible.builtin.file:
    path: "{{ spur_home }}/state"
    state: absent
  when: spur_wipe_state | bool

- name: Recreate state dir after wipe
  ansible.builtin.file:
    path: "{{ spur_home }}/state"
    state: directory
    mode: "0755"
  when: spur_wipe_state | bool

# spur_controller_skip_restart (set by add_nodes.yml): a new spurd self-registers
# at runtime, so no restart is needed to see it. When not restarted, still ensure
# spurctld is enabled + running (first-ever run needs it started; already-running
# is left untouched).
- name: Enable and (re)start spurctld
  ansible.builtin.systemd:
    name: spurctld
    daemon_reload: true
    enabled: true
    state: "{{ 'started' if (spur_controller_skip_restart | default(false) | bool) else 'restarted' }}"

- name: Wait for spurctld to listen on {{ spur_controller_port }}
  ansible.builtin.wait_for:
    port: "{{ spur_controller_port }}"
    host: "127.0.0.1"
    timeout: 30

- name: Wait for Raft leader to be elected (HA mode needs all peers up before quorum)
  # `spur nodes` returns the error `no leader elected yet` until election succeeds.
  # In HA mode this can take a few seconds while peers find each other.
  ansible.builtin.shell: |
    for i in $(seq 1 60); do
      out=$({{ spur_install_dir }}/spur nodes 2>&1)
      echo "$out" | grep -qE 'no leader|not the Raft leader|cannot reach leader|transport error|Connection refused' || { echo OK; exit 0; }
      sleep 1
    done
    echo "timeout waiting for leader: $out"
    exit 1
  args:
    executable: /bin/bash
  changed_when: false
  when: spur_ha_enabled | bool
  run_once: true
