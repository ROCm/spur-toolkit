---
# spur.conf is the single source of truth (the file passed as -i, read here via
# Ansible's `inventory_file` magic var) — controllers/agents/accounting/network/
# k8s settings all come from it verbatim. Ansible only auto-fills two things the
# operator would otherwise have to hand-compute, and ONLY when the file leaves
# them absent: [[nodes]] cpus/memory_mb (from live gathered facts) and
# [controller] peers/node_id (mechanical from [controller].hosts + the raft
# port). Everything else — accounting DB URL, k8s CIDRs, cluster_name, wg
# settings — is taken exactly as written, no fallback chains.
- name: Gather facts for any agent missing them (needed for cpus/memory_mb auto-fill)
  ansible.builtin.setup:
    gather_subset: "{{ spur_gather_subset | default(['!all', 'network', 'hardware', 'distribution']) }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['spur_agents'] }}"
  run_once: true
  when: hostvars[item].ansible_processor_vcpus is not defined
  ignore_unreachable: true
  ignore_errors: true

# Client env so the CLI works on controllers without per-command flags.
# spur_wg_address is the plugin-provided hostvar (from [[nodes]]/
# [[ansible_controllers]] ansible_wg_address) when spur_transport == wireguard,
# else ansible_host is already the listen IP straight from [controller].hosts.
- name: Set SPUR_CONTROLLER_ADDR in /etc/environment (controllers)
  vars:
    spur_controller_addr_attr: "{{ 'spur_wg_address' if spur_transport == 'wireguard' else 'ansible_host' }}"
    all_controller_endpoints: >-
      {{ groups['spur_controllers']
         | map('extract', hostvars, spur_controller_addr_attr)
         | map('regex_replace', '^(.*)$', 'http://\1:' ~ spur_controller_port)
         | join(',') }}
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^SPUR_CONTROLLER_ADDR='
    line: "SPUR_CONTROLLER_ADDR={{ all_controller_endpoints }}"

# Accounting no longer has its own address/port — it rides on SPUR_CONTROLLER_ADDR.
# Strip any leftover SPUR_ACCOUNTING_ADDR from a pre-merge deployment of this host.
- name: Remove stale SPUR_ACCOUNTING_ADDR from /etc/environment
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^SPUR_ACCOUNTING_ADDR='
    state: absent

- name: Resolve exclude_sections from the master spur.conf
  ansible.builtin.set_fact:
    exclude_sections: "{{ lookup('file', inventory_file) | spur_conf_exclude_sections }}"

# [controller] carries peers/node_id, which the HA membership guard below
# depends on being freshly computed every run — excluding it would silently
# freeze topology changes instead of failing loudly, so refuse it outright.
- name: Refuse to exclude [controller] from the spur.conf push
  ansible.builtin.fail:
    msg: >-
      [ansible].exclude_sections lists "controller" — that section's
      peers/node_id must stay in sync with the live Raft membership on every
      run. Remove it from exclude_sections; use spur_wipe_state for an
      intentional Raft reinit instead.
  when: "'controller' in exclude_sections"

- name: Read the master spur.conf and compute what to push to this host
  vars:
    spur_controller_addr_attr: "{{ 'spur_wg_address' if spur_transport == 'wireguard' else 'ansible_host' }}"
    master_conf_text: "{{ lookup('file', inventory_file) }}"
    node_fact_fallbacks: "{{ groups['spur_agents'] | spur_conf_node_facts(hostvars) }}"
    controller_ha_fallback:
      peers: >-
        {{ groups['spur_controllers']
           | map('extract', hostvars, spur_controller_addr_attr)
           | map('regex_replace', '$', ':' ~ spur_raft_port)
           | list }}
      node_id: "{{ groups['spur_controllers'].index(inventory_hostname) + 1 }}"
  ansible.builtin.set_fact:
    desired_conf: >-
      {{ master_conf_text | spur_conf_for_push(node_fact_fallbacks, controller_ha_fallback) }}
    spur_conf_exclude_sections_list: "{{ exclude_sections }}"

- name: Slurp the live spur.conf on this controller, if any
  ansible.builtin.slurp:
    path: "{{ spur_home }}/etc/spur.conf"
  register: existing_conf_b64
  failed_when: false

- name: Splice back any excluded sections from the currently-live file
  ansible.builtin.set_fact:
    final_conf: >-
      {{ desired_conf | spur_conf_splice_excluded(
           (existing_conf_b64.content | b64decode) if (existing_conf_b64.content is defined) else '',
           spur_conf_exclude_sections_list) }}

- name: Write spur.conf
  ansible.builtin.copy:
    content: "{{ final_conf }}"
    dest: "{{ spur_home }}/etc/spur.conf"
    mode: "0644"
  register: spur_conf

- name: Install spurctld systemd unit
  ansible.builtin.template:
    src: spurctld.service.j2
    dest: /etc/systemd/system/spurctld.service
    mode: "0644"
  register: spurctld_unit

# openraft ignores config peers after first init and uses the persisted
# membership, so a changed controller set can't take effect on restart.
# Fail loudly rather than break silently. Agents are not Raft members and
# can be added/removed freely without a wipe.
- name: Read persisted Raft peer addresses (HA, no-wipe)
  ansible.builtin.shell: |
    set -o pipefail
    grep -ho '"addr":"[^"]*"' {{ spur_home }}/state/raft/log/*.json 2>/dev/null \
      | sed -E 's/"addr":"([^"]*)"/\1/' | sort -u
  args:
    executable: /bin/bash
  register: raft_peers
  changed_when: false
  failed_when: false
  when:
    - spur_ha_enabled | bool
    - not (spur_wipe_state | bool)

- name: Fail if the controller (Raft) set changed without a state wipe
  vars:
    spur_controller_addr_attr: "{{ 'spur_wg_address' if spur_transport == 'wireguard' else 'ansible_host' }}"
    desired_peers: >-
      {{ groups['spur_controllers']
         | map('extract', hostvars, spur_controller_addr_attr)
         | map('regex_replace', '$', ':' ~ spur_raft_port)
         | sort }}
  ansible.builtin.fail:
    msg: >-
      Persisted Raft membership {{ raft_peers.stdout_lines | sort }} does not
      match the inventory controllers {{ desired_peers }}.
      Spur 0.3.0 has no online membership change, so adding/removing/reordering a
      controller needs a Raft reinit: re-run with -e spur_wipe_state=true.
      Adding/removing compute agents does not require this.
  when:
    - spur_ha_enabled | bool
    - not (spur_wipe_state | bool)
    - raft_peers.stdout | default('') | length > 0
    - (raft_peers.stdout_lines | sort) != desired_peers

# Stop BEFORE wiping state so spurctld does not rewrite the Raft log we are about to delete.
# Only needed when we're actually wiping (and never when skip_restart is requested —
# add_nodes.yml refreshes spur.conf without touching the running controller).
- name: Stop spurctld before wiping state
  ansible.builtin.systemd:
    name: spurctld
    state: stopped
  failed_when: false
  when:
    - spur_wipe_state | bool
    - not (spur_controller_skip_restart | default(false) | bool)

- name: Wipe Raft state (when spur_wipe_state is true)
  ansible.builtin.file:
    path: "{{ spur_home }}/state"
    state: absent
  when: spur_wipe_state | bool

- name: Recreate state dir after wipe
  ansible.builtin.file:
    path: "{{ spur_home }}/state"
    state: directory
    mode: "0755"
  when: spur_wipe_state | bool

# spur_controller_skip_restart (set by add_nodes.yml): a new spurd self-registers
# at runtime, so no restart is needed to see it. When not restarted, still ensure
# spurctld is enabled + running (first-ever run needs it started; already-running
# is left untouched).
- name: Enable and (re)start spurctld
  ansible.builtin.systemd:
    name: spurctld
    daemon_reload: true
    enabled: true
    state: "{{ 'started' if (spur_controller_skip_restart | default(false) | bool) else 'restarted' }}"

- name: Wait for spurctld to listen on {{ spur_controller_port }}
  ansible.builtin.wait_for:
    port: "{{ spur_controller_port }}"
    host: "127.0.0.1"
    timeout: 30

- name: Wait for Raft leader to be elected (HA mode needs all peers up before quorum)
  # `spur nodes` returns the error `no leader elected yet` until election succeeds.
  # In HA mode this can take a few seconds while peers find each other.
  ansible.builtin.shell: |
    for i in $(seq 1 60); do
      out=$({{ spur_install_dir }}/spur nodes 2>&1)
      echo "$out" | grep -qE 'no leader|not the Raft leader|cannot reach leader|transport error|Connection refused' || { echo OK; exit 0; }
      sleep 1
    done
    echo "timeout waiting for leader: $out"
    exit 1
  args:
    executable: /bin/bash
  changed_when: false
  when: spur_ha_enabled | bool
  run_once: true
