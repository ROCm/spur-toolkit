---
- name: Determine which Spur components this host needs
  # Every host this role runs on (controller, agent, or login) gets the `spur`
  # CLI — squeue/sinfo/etc. work locally on any node regardless of spur_transport.
  ansible.builtin.set_fact:
    spur_needs_ctld: "{{ inventory_hostname in groups['spur_controllers'] }}"
    spur_needs_agent_bin: "{{ inventory_hostname in groups['spur_agents'] }}"

# One round-trip for everything read-only up front (commands present,
# already-running daemons, port conflicts, existing install marker, PATH) plus
# the directory layout every host needs before binaries land.
- name: Preflight — commands, daemons, ports, existing install, PATH, directory layout
  ansible.builtin.shell: |
    set +e
    for c in curl tar bash; do
      command -v "$c" >/dev/null 2>&1 || { echo "missing required command: $c"; exit 1; }
    done
    for p in spurctld spurd spurrestd; do
      pid=$(pgrep -x "$p" 2>/dev/null | head -1)
      [ -n "$pid" ] && echo "$p running (PID $pid)"
    done
    # ss -p prints "users:((\"<name>\",pid=...))" as the last column when run as root.
    # Any owner that is NOT spurctld/spurd/spurrestd on our ports is a conflict.
    bad=$(ss -tlnpH "( sport = :{{ spur_controller_port }} or sport = :{{ spur_agent_port }} or sport = :{{ spur_raft_port }} )" 2>/dev/null \
          | grep -oE 'users:\(\("[^"]+"' \
          | sed -E 's|.*"([^"]+)".*|\1|' \
          | grep -v -E '^(spurctld|spurd|spurrestd)$')
    if [ -n "$bad" ]; then
      echo "non-spur process(es) on spur ports: $bad"
      exit 1
    fi
    [ -e "{{ spur_install_dir }}/spur" ] && echo MARKER_EXISTS
    if grep -q "{{ spur_install_dir }}" /etc/environment 2>/dev/null; then
      echo PATH_ALREADY_SET
    else
      sed -Ei 's#^PATH="(.*)"$#PATH="{{ spur_install_dir }}:\1"#' /etc/environment 2>/dev/null
      echo PATH_UPDATED
    fi
    mkdir -p "{{ spur_home }}" "{{ spur_home }}/state" "{{ spur_home }}/log" "{{ spur_home }}/etc" "{{ spur_install_dir }}"
    exit 0
  args:
    executable: /bin/bash
  register: pf_preflight
  changed_when: "'PATH_UPDATED' in pf_preflight.stdout"
  failed_when: pf_preflight.rc != 0

# An ignored-unreachable host (spur_ignore_unreachable_agents=true) still gets
# a registered var here — its ansible "unreachable" result dict, which has no
# stdout_lines — so gate on that flag instead of crashing on the missing attr.
- name: Preflight — note any running daemons
  ansible.builtin.debug:
    msg: "{{ pf_preflight.stdout_lines | select('match', '^(spurctld|spurd|spurrestd) running') | list | default(['no spur daemons running']) }}"
  when: not (pf_preflight.unreachable | default(false))

# One delegated result holds the fleet manifest; each source/component set is built once.
- name: Prepare local install artifacts for this batch
  spur_prepare_install:
    targets: >-
      {%- set targets = {} -%}
      {%- for name in ansible_play_hosts -%}
      {%- set h = hostvars[name] -%}
      {%- if not (h.an_registered | default(false) | bool) -%}
      {%- set _ = targets.update({name: {
          'source': h.spur_binary_src | default(spur_binary_src | default('')),
          'roles': (['controller'] if name in groups['spur_controllers'] else [])
                   + (['agent'] if name in groups['spur_agents'] else []),
          'auth': h.spur_auth_enabled | default(spur_auth_enabled | default(false)) | bool,
          'mpi': h.spur_mpi_plugin_enabled | default(spur_mpi_plugin_enabled | default(true)) | bool}}) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ targets }}
  delegate_to: localhost
  delegate_facts: true
  become: false
  run_once: true

- name: Copy the binaries tarball to the remote host
  vars:
    spur_bin_tarball_local: "{{ hostvars['localhost'].spur_install_prepared.artifacts[inventory_hostname].archive }}"
    spur_bin_hash: "{{ spur_bin_tarball_local | basename | regex_replace('\\.tar\\.gz$', '') }}"
  ansible.builtin.copy:
    src: "{{ spur_bin_tarball_local }}"
    dest: "{{ spur_install_dir }}/.bins-{{ spur_bin_hash }}.tar.gz"
    mode: "0644"
  register: spur_bin_copy
  when: spur_binary_src | default('') | length > 0

- name: Install Spur via upstream installer
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL https://raw.githubusercontent.com/ROCm/spur/main/install.sh \
      | INSTALL_DIR={{ spur_install_dir }} bash -s -- {{ spur_version }}
  args:
    executable: /bin/bash
  when:
    - not (pf_preflight.unreachable | default(false))
    - spur_binary_src | default('') | length == 0
    - ('MARKER_EXISTS' not in (pf_preflight.stdout | default(''))) or (spur_force_reinstall | default(false) | bool)
  register: install_run
  changed_when: install_run.rc == 0

# One exec handles all remaining binary/symlink housekeeping: drops the
# pre-merge spurdbd binary and any component this host role doesn't need
# (a host upgraded from an older role revision, or moved between inventory
# groups, can carry binaries a prior run copied unconditionally), verifies
# every needed binary is present, and creates all 18 Slurm-compatible
# symlinks. One round-trip instead of a stat-per-binary and a module-call-
# per-symlink over the wire.
- name: Extract changed binaries, verify components, and maintain CLI symlinks
  vars:
    # spurstepd is only *required* when the operator says this build ships it
    # (spur_require_stepd) — an older release has none, and a hard requirement
    # would break those deploys. It's reported either way by the task below.
    spur_needed_bins: >-
      {{ ['spur']
         + (['spurctld'] if spur_needs_ctld else [])
         + (['spurd'] if spur_needs_agent_bin else [])
         + (['spurstepd'] if (spur_needs_agent_bin and (spur_require_stepd | default(false) | bool)) else [])
         + (['spurauthd'] if ((spur_auth_enabled | default(false) | bool) and (spur_require_authd | default(false) | bool)) else []) }}
    # A host moved out of [spur_agents] keeps no agent-side binaries, spurstepd
    # included — it is useless without the spurd that spawns it.
    spur_unneeded_bins: >-
      {{ (['spurctld'] if not spur_needs_ctld else [])
         + (['spurd', 'spurstepd'] if not spur_needs_agent_bin else []) }}
  ansible.builtin.shell: |
    set -e
    {% if spur_binary_src | default('') | length > 0 and spur_bin_copy.changed | default(false) %}
    tar --no-same-owner -xzf {{ spur_bin_copy.dest | quote }} -C {{ spur_install_dir | quote }}
    {% for name in hostvars['localhost'].spur_install_prepared.artifacts[inventory_hostname].manifest %}
    chmod 0755 {{ (spur_install_dir ~ '/' ~ name) | quote }}
    {% endfor %}
    find {{ spur_install_dir | quote }} -maxdepth 1 -name '.bins-*.tar.gz' ! -name {{ spur_bin_copy.dest | basename | quote }} -delete
    echo BINARIES_EXTRACTED
    {% endif %}
    rm -f "{{ spur_install_dir }}/spurdbd"
    {% for b in spur_unneeded_bins %}
    rm -f "{{ spur_install_dir }}/{{ b }}"
    {% endfor %}
    for b in {{ spur_needed_bins | join(' ') }}; do
      [ -f "{{ spur_install_dir }}/$b" ] || { echo "missing binary: $b"; exit 1; }
    done
    {% if spur_needs_agent_bin %}
    # Reported (not enforced) so the warning below can name the exact problem.
    [ -f "{{ spur_install_dir }}/spurstepd" ] && echo STEPD_PRESENT || echo STEPD_MISSING
    {% endif %}
    {% if spur_auth_enabled | default(false) | bool %}
    # Reported (not enforced) too — the native-auth mint, needed on every host.
    [ -f "{{ spur_install_dir }}/spurauthd" ] && echo AUTHD_PRESENT || echo AUTHD_MISSING
    {% endif %}
    changed=0
    for s in sbatch squeue sinfo scancel sacct sacctmgr scontrol salloc srun sattach scrontab sdiag smd sprio sreport sshare sstat strigger; do
      link="{{ spur_install_dir }}/$s"
      [ -L "$link" ] && [ "$(readlink "$link")" = "{{ spur_install_dir }}/spur" ] || changed=1
      ln -sf "{{ spur_install_dir }}/spur" "$link"
    done
    [ "$changed" -eq 1 ] && echo SYMLINKS_UPDATED
    exit 0
  args:
    executable: /bin/bash
  register: spur_ver
  changed_when: "'SYMLINKS_UPDATED' in spur_ver.stdout or 'BINARIES_EXTRACTED' in spur_ver.stdout"
  failed_when: spur_ver.rc != 0

# Loud, because the failure mode it predicts is total and looks unrelated:
# spurd resolves spurstepd beside its own executable and never searches $PATH,
# so on a build that expects one, a node without it fails EVERY job launch.
- name: Warn that this agent has no spurstepd beside spurd
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ inventory_hostname }} has no spurstepd in {{ spur_install_dir }}.
      That is expected for a build that predates it, and harmless there. If this
      build DOES expect one — check that the release ships it, or that a local
      build included `-p spur-stepd` — then every job launch on this node will
      fail: spurd resolves spurstepd beside its own executable and does not
      search $PATH. Set -e spur_require_stepd=true to make this a hard failure.
  when:
    - spur_needs_agent_bin
    - not (pf_preflight.unreachable | default(false))
    - "'STEPD_MISSING' in (spur_ver.stdout | default(''))"

# Loud for the same reason as spurstepd: with auth enabled, a host with no
# spurauthd can't mint, so the spur_auth role's socket wait (or the daemon's
# first credentialed call) fails. Name it here at install time.
- name: Warn that this host has no spurauthd (native auth needs it)
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ inventory_hostname }} has no spurauthd in {{ spur_install_dir }}.
      spur_auth_enabled=true needs the credential mint on every host. Build it
      with `cargo build --release -p spurauthd` into spur_binary_src, or use a
      release/nightly that includes ROCm/spur#919. Set -e spur_require_authd=true
      to make this a hard failure instead of a warning.
  when:
    - spur_auth_enabled | default(false) | bool
    - not (pf_preflight.unreachable | default(false))
    - "'AUTHD_MISSING' in (spur_ver.stdout | default(''))"

- name: Show install result
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: spur binaries installed in {{ spur_install_dir }}
      {{ '(with spurstepd)' if ('STEPD_PRESENT' in (spur_ver.stdout | default(''))) else '' }}
