---
- name: Resolve agent's advertised address
  ansible.builtin.set_fact:
    spur_agent_listen_ip: >-
      {{ spur_wg_address if spur_transport == 'wireguard'
         else (ansible_host | default(ansible_default_ipv4.address)) }}
    spur_node_name: "{{ spur_node_name | default(ansible_hostname) }}"
    spur_controller_endpoints: >-
      {%- set endpoints = [] -%}
      {%- for name in groups['spur_controllers'] -%}
      {%- set h = hostvars[name] -%}
      {%- set address = h.spur_wg_address if spur_transport == 'wireguard'
          else (h.ansible_host | default(h.ansible_default_ipv4.address)) -%}
      {%- set _ = endpoints.append('http://' ~ address ~ ':' ~ spur_controller_port) -%}
      {%- endfor -%}
      {{ endpoints }}

# cgroup-v2 readiness: spurd enforces [cgroup] limits by creating cgroups under
# /sys/fs/cgroup/spur, which needs the unified (v2) hierarchy and the memory/
# cpuset controllers available at the root. Missing either means spurd runs jobs
# with reduced/no enforcement (or, with required=true, refuses every launch).
# Warn by default; hard-fail when spur_cgroup_require_v2 or spur_cgroup_required.
- name: Preflight — cgroup v2 hierarchy + controllers (for [cgroup] enforcement)
  ansible.builtin.shell: |
    set +e
    probs=""
    [ "$(stat -fc %T /sys/fs/cgroup 2>/dev/null)" = "cgroup2fs" ] || probs="not-cgroup2"
    if [ -r /sys/fs/cgroup/cgroup.controllers ]; then
      for c in memory cpuset; do
        grep -qw "$c" /sys/fs/cgroup/cgroup.controllers || probs="$probs no-$c-controller"
      done
    fi
    echo "${probs:-OK}"
  args:
    executable: /bin/bash
  register: spur_cgroup_v2_probe
  changed_when: false
  failed_when: false
  when:
    - spur_cgroup_manage | default(true) | bool
    - spur_cgroup_enabled | default(true) | bool

- name: Fail when cgroup v2 is unavailable and enforcement is required
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }} is not cgroup-v2 ready ({{ spur_cgroup_v2_probe.stdout | trim }}),
      but cgroup enforcement is required here (spur_cgroup_require_v2 or
      spur_cgroup_required). Boot with systemd.unified_cgroup_hierarchy=1 (default
      on Ubuntu 22.04) and enable the memory/cpuset controllers, or relax the flag.
  when:
    - spur_cgroup_manage | default(true) | bool
    - spur_cgroup_enabled | default(true) | bool
    - (spur_cgroup_v2_probe.stdout | default('OK') | trim) != 'OK'
    - (spur_cgroup_require_v2 | default(false) | bool) or (spur_cgroup_required | default(false) | bool)

- name: Warn when cgroup v2 / controllers are missing (enforcement will degrade)
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ inventory_hostname }} — {{ spur_cgroup_v2_probe.stdout | trim }}.
      spurd will run jobs with reduced or no cgroup enforcement (cpuset/memory
      limits and the device filter may not apply). Enable cgroup v2 + the
      memory/cpuset controllers, or set spur_cgroup_required=true to fail closed.
  when:
    - spur_cgroup_manage | default(true) | bool
    - spur_cgroup_enabled | default(true) | bool
    - (spur_cgroup_v2_probe.stdout | default('OK') | trim) != 'OK'
    - not ((spur_cgroup_require_v2 | default(false) | bool) or (spur_cgroup_required | default(false) | bool))

- name: Configure agent files and install the staged MPI plugin
  spur_configure_agent:
    environment_file: /etc/environment
    controller_endpoints: "{{ spur_controller_endpoints }}"
    config_file: "{{ spur_home }}/etc/spur.conf"
    config_content: "{{ lookup('ansible.builtin.template', 'spur.conf.j2') }}"
    overwrite_config: "{{ spur_overwrite_conf | default(false) | bool }}"
    state_dir: "{{ spur_agent_state_dir }}"
    unit_file: /etc/systemd/system/spurd.service
    unit_content: "{{ lookup('ansible.builtin.template', 'spurd.service.j2') }}"
    mpi_enabled: "{{ spur_mpi_plugin_enabled | default(true) | bool }}"
    mpi_dir: "{{ spur_mpi_plugin_dir }}"
    mpi_source_required: "{{ spur_binary_src | default('') | length > 0 }}"
    mpi_source: >-
      {{ (spur_install_dir ~ '/spur_mpi_pmix.so')
         if (spur_binary_src | default('') | length > 0 and
             hostvars['localhost'].spur_install_prepared.artifacts[inventory_hostname].mpi_source | length > 0)
         else ((spur_install_dir | regex_replace('/[^/]+$', '')) ~ '/lib/spur/spur_mpi_pmix.so')
         if spur_binary_src | default('') | length == 0 else '' }}

# Restart + wait-for-listen merged into one shell (agent-local) to cut a
# round-trip. Poll across the add-node bootstrap window: the reconcile can
# briefly prune the new peer until spurd registers, and spurd
# (Restart=on-failure) keeps retrying — so poll, don't fail on one miss.
- name: Enable and (re)start spurd, then wait for it to listen on {{ spur_agent_port }}
  ansible.builtin.shell: |
    set -e
    systemctl daemon-reload
    systemctl enable spurd
    systemctl restart spurd
    for i in $(seq 1 200); do
      (exec 3<>/dev/tcp/127.0.0.1/{{ spur_agent_port }}) 2>/dev/null && exit 0
      sleep 1
    done
    echo "spurd never started listening on 127.0.0.1:{{ spur_agent_port }}"
    exit 1
  args:
    executable: /bin/bash
  changed_when: true

# Pre-install k0s at deploy time so `spur k8s up` doesn't wait on the ~262 MB runtime download
# (which can trip the provisioning timeout). Local, idempotent; only on k0s-scoped nodes.
- name: Install the k0s binary on k0s-scoped agents
  ansible.builtin.command: >-
    {{ spur_install_dir }}/spur k8s install-k0s
      --version {{ spur_k8s_version | default('v1.36.2+k0s.0') }}
      --path {{ spur_k8s_binary | default('/usr/local/bin/k0s') }}
  register: spur_k0s_install
  # `spur k8s install-k0s` logs everything (incl. "Installed k0s ...") to STDERR, not stdout —
  # so match on stderr. "already present" (no --force) is also stderr and is not a change.
  changed_when: "'Installed k0s' in spur_k0s_install.stderr"
  when:
    - spur_k8s_enabled | default(false) | bool
    # In k0s scope when: scope is empty (whole inventory), OR this node is a named k0s worker
    # (spur_k8s_nodes), OR a named k0s control-plane (spur_k8s_control_plane_nodes).
    - (spur_k8s_nodes | default('') | length == 0)
      or (spur_node_name | default(inventory_hostname) in (spur_k8s_nodes | split(',') | map('trim') | list))
      or (spur_node_name | default(inventory_hostname) in (spur_k8s_control_plane_nodes | default('') | split(',') | map('trim') | select | list))
