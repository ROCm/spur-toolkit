---
- name: Resolve agent's advertised address
  ansible.builtin.set_fact:
    spur_agent_listen_ip: >-
      {{ spur_wg_address if spur_transport == 'wireguard'
         else (ansible_host | default(ansible_default_ipv4.address)) }}
    spur_node_name: "{{ spur_node_name | default(ansible_hostname) }}"

- name: Resolve controller endpoint(s) agents will talk to
  # spurd --controller accepts a comma-separated endpoint list and rotates past a
  # dead one (spur-client endpoint rotation), so every controller is listed here —
  # not just the first — for real client-side failover in HA mode. Non-leader
  # controllers forward writes to the leader via Raft either way.
  vars:
    controller_ip: >-
      {{ hostvars[item]['spur_wg_address'] if spur_transport == 'wireguard'
         else (hostvars[item]['ansible_host'] | default(hostvars[item]['ansible_default_ipv4']['address'])) }}
  ansible.builtin.set_fact:
    spur_controller_endpoints: >-
      {{ (spur_controller_endpoints | default([])) + ["http://" ~ controller_ip ~ ":" ~ spur_controller_port] }}
  loop: "{{ groups['spur_controllers'] }}"

# Every agent gets the CLI now (spur_install always installs it), so this is
# unconditional — CLI on agents must target the controller over the same
# transport spurd uses (mesh IP under wireguard), not the node's own underlay
# IP left over from a prior run.
- name: Set SPUR_CONTROLLER_ADDR in /etc/environment (every agent has the CLI)
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^SPUR_CONTROLLER_ADDR='
    line: "SPUR_CONTROLLER_ADDR={{ spur_controller_endpoints | join(',') }}"
    create: true

- name: Ensure MPI plugin directory exists
  ansible.builtin.file:
    path: "{{ spur_mpi_plugin_dir }}"
    state: directory
    mode: "0755"
  when: spur_mpi_plugin_enabled | default(true) | bool

- name: Locate MPI plugin in spur_binary_src on control node
  ansible.builtin.stat:
    path: "{{ item }}"
  register: spur_mpi_src_stats
  loop:
    - "{{ spur_binary_src }}/spur_mpi_pmix.so"
    - "{{ spur_binary_src }}/libspur_mpi_pmix.so"
    - "{{ spur_binary_src }}/lib/spur/spur_mpi_pmix.so"
    - "{{ spur_binary_src | dirname }}/lib/spur/spur_mpi_pmix.so"
  delegate_to: localhost
  become: false
  when:
    - spur_mpi_plugin_enabled | default(true) | bool
    - spur_binary_src | default('') | length > 0

- name: Pick MPI plugin source from spur_binary_src
  ansible.builtin.set_fact:
    spur_mpi_plugin_src: "{{ spur_mpi_src_stats.results | selectattr('stat.exists') | map(attribute='item') | first | default('') }}"
  when:
    - spur_mpi_plugin_enabled | default(true) | bool
    - spur_binary_src | default('') | length > 0

- name: Install MPI plugin from spur_binary_src
  ansible.builtin.copy:
    src: "{{ spur_mpi_plugin_src }}"
    dest: "{{ spur_mpi_plugin_dir }}/spur_mpi_pmix.so"
    mode: "0755"
  when:
    - spur_mpi_plugin_enabled | default(true) | bool
    - spur_mpi_plugin_src | default('') | length > 0

# Stat-then-copy merged into one shell (agent-local, no delegate_to) to cut a
# round-trip — copy has no "only if source exists" guard of its own.
- name: Install MPI plugin from install.sh layout to {{ spur_mpi_plugin_dir }} (if present)
  ansible.builtin.shell: |
    set -e
    src="{{ spur_install_dir | regex_replace('/[^/]+$', '') }}/lib/spur/spur_mpi_pmix.so"
    dest="{{ spur_mpi_plugin_dir }}/spur_mpi_pmix.so"
    if [ ! -f "$src" ]; then
      echo "RESULT=NOT_FOUND"
    elif cmp -s "$src" "$dest" 2>/dev/null; then
      echo "RESULT=UNCHANGED"
    else
      install -m 0755 "$src" "$dest"
      echo "RESULT=INSTALLED"
    fi
  args:
    executable: /bin/bash
  register: spur_mpi_install_sh_copy
  changed_when: "'RESULT=INSTALLED' in spur_mpi_install_sh_copy.stdout"
  when:
    - spur_mpi_plugin_enabled | default(true) | bool
    - spur_binary_src | default('') | length == 0

- name: Note MPI plugin not found (PMIx jobs will fail until installed)
  ansible.builtin.debug:
    msg: >-
      spur_mpi_pmix.so not found for {{ inventory_hostname }} —
      skipping MPI plugin install (set spur_mpi_plugin_enabled=false to silence).
  when:
    - spur_mpi_plugin_enabled | default(true) | bool
    - spur_mpi_plugin_src | default('') | length == 0
    - >-
      (spur_binary_src | default('') | length > 0)
      or (
        spur_binary_src | default('') | length == 0
        and 'RESULT=NOT_FOUND' in (spur_mpi_install_sh_copy.stdout | default(''))
      )

# spurd loads spur.conf best-effort at startup (missing file is fine) — of
# what it reads (cluster identity, [cluster]/k0s, [devices]/GRES), this
# role's own template only renders cluster identity + [cluster], not the
# controller's full fleet-wide file. Rendering N agents' worth of the
# [[nodes]]/[[partitions]] loop, once per agent, doesn't scale (O(N^2) across
# a large fleet) and the content would be dead weight on an agent anyway.
#
# Respect an existing file unless the operator asks to re-render it — same
# opt-in as rolling_upgrade.yml's spur_overwrite_conf for the controller.
# force: no is template's own write-if-missing primitive, so this needs no
# separate stat call (and no unreachable-result guard to hand-write for one).
- name: Write spur.conf on the agent
  ansible.builtin.template:
    src: spur.conf.j2
    dest: "{{ spur_home }}/etc/spur.conf"
    mode: "0644"
    force: "{{ spur_overwrite_conf | default(false) | bool }}"

- name: Install spurd systemd unit
  # WorkingDirectory in the unit is {{ spur_home }} so job stdout (spur-<N>.out)
  # always lands there regardless of where the daemon was launched from.
  ansible.builtin.template:
    src: spurd.service.j2
    dest: /etc/systemd/system/spurd.service
    mode: "0644"
  register: spurd_unit

# Restart + wait-for-listen merged into one shell (agent-local) to cut a
# round-trip. Poll across the add-node bootstrap window: the reconcile can
# briefly prune the new peer until spurd registers, and spurd
# (Restart=on-failure) keeps retrying — so poll, don't fail on one miss.
- name: Enable and (re)start spurd, then wait for it to listen on {{ spur_agent_port }}
  ansible.builtin.shell: |
    set -e
    systemctl daemon-reload
    systemctl enable spurd
    systemctl restart spurd
    for i in $(seq 1 200); do
      (exec 3<>/dev/tcp/127.0.0.1/{{ spur_agent_port }}) 2>/dev/null && exit 0
      sleep 1
    done
    echo "spurd never started listening on 127.0.0.1:{{ spur_agent_port }}"
    exit 1
  args:
    executable: /bin/bash
  changed_when: true

# Pre-install k0s at deploy time so `spur k8s up` doesn't wait on the ~262 MB runtime download
# (which can trip the provisioning timeout). Local, idempotent; only on k0s-scoped nodes.
- name: Install the k0s binary on k0s-scoped agents
  ansible.builtin.command: >-
    {{ spur_install_dir }}/spur k8s install-k0s
      --version {{ spur_k8s_version | default('v1.36.2+k0s.0') }}
      --path {{ spur_k8s_binary | default('/usr/local/bin/k0s') }}
  register: spur_k0s_install
  # `spur k8s install-k0s` logs everything (incl. "Installed k0s ...") to STDERR, not stdout —
  # so match on stderr. "already present" (no --force) is also stderr and is not a change.
  changed_when: "'Installed k0s' in spur_k0s_install.stderr"
  when:
    - spur_k8s_enabled | default(false) | bool
    # In k0s scope when: scope is empty (whole inventory), OR this node is a named k0s worker
    # (spur_k8s_nodes), OR a named k0s control-plane (spur_k8s_control_plane_nodes).
    - (spur_k8s_nodes | default('') | length == 0)
      or (spur_node_name | default(inventory_hostname) in (spur_k8s_nodes | split(',') | map('trim') | list))
      or (spur_node_name | default(inventory_hostname) in (spur_k8s_control_plane_nodes | default('') | split(',') | map('trim') | select | list))
