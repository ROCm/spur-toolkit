---
# WireGuard mesh setup. `spur net init` bootstraps the mesh on the FIRST
# controller (auto-assigns .1); every other node — additional controllers (HA),
# agents, and login nodes — `spur net join`s and is registered as a peer.
# Because `net join`/`add-peer` alone yield a hub-and-spoke (each joiner peers
# only the bootstrap controller), a final `spur net mesh` pass programs the
# remaining node↔node tunnels so the mesh is fully connected — required for
# HA Raft, where controllers must reach each other directly (.1<->.3<->.4),
# not only via the bootstrap node. Under [cluster].enabled the controller's own
# reconcile loop maintains this; for a pure-spurd HA cluster this role is the
# only thing that forms it.
- name: Assert ansible.utils collection is available (provides ipaddr/ipmath)
  ansible.builtin.assert:
    that:
      - "'10.0.0.0/24' | ansible.utils.ipaddr('network') == '10.0.0.0'"
    fail_msg: >-
      The ansible.utils collection is required for WireGuard transport.
      Install it on the control node:
      ansible-galaxy collection install -r requirements.yml
  run_once: true
  delegate_to: localhost

- name: Assert wireguard module is loadable
  ansible.builtin.shell: "modinfo wireguard >/dev/null 2>&1"
  changed_when: false

- name: Install wireguard-tools (Debian/Ubuntu)
  ansible.builtin.apt:
    name: wireguard-tools
    state: present
    update_cache: yes
  when: ansible_os_family == 'Debian'

- name: Install wireguard-tools (RHEL family)
  ansible.builtin.package:
    name: wireguard-tools
    state: present
  when: ansible_os_family == 'RedHat'

# The bootstrap controller (first in the group) gets .1 via `spur net init`.
# Every other mesh member — secondary controllers (HA), then non-controller
# agents, then login-only nodes — joins and gets a unique address by position:
# .2, .3, ... A per-host spur_wg_address set in inventory always wins (the HA
# testbeds pin every node explicitly, which bypasses this positional scheme).
- name: Identify the bootstrap controller (inits the mesh, .1)
  ansible.builtin.set_fact:
    spur_wg_bootstrap: "{{ groups['spur_controllers'][0] }}"

# Secondary controllers (HA): controllers other than the bootstrap. They do NOT
# init — they join the mesh like any other node so Raft peers reach each other.
- name: Build ordered secondary-controller list (HA controllers that join)
  ansible.builtin.set_fact:
    spur_wg_secondary_controllers: "{{ groups['spur_controllers'][1:] }}"

- name: Build ordered agent list (non-controller agents)
  ansible.builtin.set_fact:
    spur_wg_agents: "{{ groups['spur_agents'] | difference(groups['spur_controllers']) }}"

# Login-only hosts: in [spur_login] but NOT already a controller/agent (those
# already get a mesh address above). Login nodes join the mesh so interactive
# `srun` can stream job output directly from agents over the tunnel.
- name: Build ordered login-node list (login-only, not already controller/agent)
  ansible.builtin.set_fact:
    spur_wg_login: >-
      {{ groups.get('spur_login', [])
         | difference(groups['spur_controllers'])
         | difference(groups['spur_agents']) }}

# Everything that joins the mesh (as opposed to the bootstrap controller, which
# inits it): secondary controllers first, then agents, then login-only nodes.
# Used for the join/pubkey/peer-registration/full-mesh steps below so every
# joiner class goes through the identical flow. For a single-controller cluster
# spur_wg_secondary_controllers is empty, so this is unchanged from before.
- name: Build combined joiner list (secondary controllers + agents + login-only)
  ansible.builtin.set_fact:
    spur_wg_joiners: "{{ spur_wg_secondary_controllers + spur_wg_agents + spur_wg_login }}"

- name: Set bootstrap controller WG address to the mesh .1
  ansible.builtin.set_fact:
    spur_wg_address: "{{ spur_wg_cidr | ansible.utils.ipaddr('network') | ansible.utils.ipmath(1) }}"
  when:
    - inventory_hostname == spur_wg_bootstrap
    - spur_wg_address is not defined

# Joiners are numbered .2, .3, ... by their position in the combined joiner list
# (secondary controllers, then agents, then login). A single-controller cluster
# has no secondary controllers, so agents still start at .2 exactly as before.
- name: Assign each joiner a unique WG address (.2, .3, ... by position)
  ansible.builtin.set_fact:
    spur_wg_address: "{{ spur_wg_cidr | ansible.utils.ipaddr('network') | ansible.utils.ipmath(spur_wg_joiners.index(inventory_hostname) + 2) }}"
  when:
    - inventory_hostname in spur_wg_joiners
    - spur_wg_address is not defined

- name: Initialize WireGuard mesh on the controller
  # Initialized only when the interface is up AND its conf exists; a live interface with no conf
  # can't persist, so down the stale link and re-init to rewrite the conf.
  ansible.builtin.shell: |
    set -euo pipefail
    if ip link show {{ spur_wg_interface }} >/dev/null 2>&1 \
       && [ -f /etc/wireguard/{{ spur_wg_interface }}.conf ]; then
      echo "SPUR_WG_ALREADY_UP"
    else
      ip link show {{ spur_wg_interface }} >/dev/null 2>&1 \
        && { wg-quick down {{ spur_wg_interface }} 2>/dev/null || ip link del {{ spur_wg_interface }} 2>/dev/null || true; }
      {{ spur_install_dir }}/spur net init \
        --cidr {{ spur_wg_cidr }} \
        --port {{ spur_wg_port }} \
        --interface {{ spur_wg_interface }} 1>&2
    fi
  args:
    executable: /bin/bash
  register: wg_ctl_init
  changed_when: "'SPUR_WG_ALREADY_UP' not in wg_ctl_init.stdout"
  when: inventory_hostname == spur_wg_bootstrap

- name: Read bootstrap controller WG public key
  ansible.builtin.command: "wg show {{ spur_wg_interface }} public-key"
  register: wg_ctl_pubkey
  changed_when: false
  when: inventory_hostname == spur_wg_bootstrap

- name: Broadcast bootstrap controller pubkey + endpoint to all hosts
  ansible.builtin.set_fact:
    spur_wg_controller_pubkey: "{{ hostvars[spur_wg_bootstrap]['wg_ctl_pubkey'].stdout | trim }}"
    spur_wg_controller_endpoint: "{{ hostvars[spur_wg_bootstrap]['ansible_host'] | default(spur_wg_bootstrap) }}:{{ spur_wg_port }}"

- name: Assert each joiner (agent or login node) has a WG address before join
  ansible.builtin.assert:
    that:
      - spur_wg_address is defined
    fail_msg: "{{ inventory_hostname }} has no spur_wg_address; set it in inventory or check spur_wg_cidr."
  when: inventory_hostname in spur_wg_joiners

- name: Join WireGuard mesh on agents and login nodes
  # --prefix-len must match spur_wg_cidr or the address/AllowedIPs are wrong. As with init,
  # re-join when the interface is up but its conf is missing so the on-disk conf always exists.
  ansible.builtin.shell: |
    set -euo pipefail
    if ip link show {{ spur_wg_interface }} >/dev/null 2>&1 \
       && [ -f /etc/wireguard/{{ spur_wg_interface }}.conf ]; then
      echo "SPUR_WG_ALREADY_UP"
    else
      ip link show {{ spur_wg_interface }} >/dev/null 2>&1 \
        && { wg-quick down {{ spur_wg_interface }} 2>/dev/null || ip link del {{ spur_wg_interface }} 2>/dev/null || true; }
      {{ spur_install_dir }}/spur net join \
        --endpoint {{ spur_wg_controller_endpoint }} \
        --server-key {{ spur_wg_controller_pubkey }} \
        --address {{ spur_wg_address }} \
        --prefix-len {{ spur_wg_cidr | ansible.utils.ipaddr('prefix') }} \
        --interface {{ spur_wg_interface }} 1>&2
    fi
  args:
    executable: /bin/bash
  register: wg_agent_join
  changed_when: "'SPUR_WG_ALREADY_UP' not in wg_agent_join.stdout"
  when: inventory_hostname in spur_wg_joiners

- name: Read joiner WG public key
  ansible.builtin.command: "wg show {{ spur_wg_interface }} public-key"
  register: wg_agent_pubkey
  changed_when: false
  when: inventory_hostname in spur_wg_joiners

- name: Capture joiner pubkey
  ansible.builtin.set_fact:
    spur_wg_pubkey: "{{ wg_agent_pubkey.stdout | trim }}"
  when: inventory_hostname in spur_wg_joiners

# Only joiners in THIS play have a pubkey — add_nodes.yml runs just the new node, so existing
# nodes have no spur_wg_pubkey in hostvars. Register only those that joined this run.
- name: Select joiners that joined this run
  ansible.builtin.set_fact:
    spur_wg_registerable: "{{ spur_wg_joiners | select('in', groups['all']) | map('extract', hostvars) | selectattr('spur_wg_pubkey', 'defined') | map(attribute='inventory_hostname') | list }}"
  when: inventory_hostname in groups['spur_controllers']

- name: Register joiners as peers on EVERY controller
  # Runs on every controller present in this play, not just the bootstrap: in a
  # multi-controller mesh each controller must peer each joiner directly (Raft
  # controller<->controller, and a re-added node whose key changed must be
  # refreshed on ALL controllers, not only the bootstrap — otherwise the other
  # controllers keep the stale key and drop its traffic). For a single-controller
  # cluster this loops once on that one controller, unchanged from before.
  # --endpoint is the joiner's underlay address (NIC IP + wg port), not its mesh IP.
  ansible.builtin.command: >-
    {{ spur_install_dir }}/spur net add-peer
      --key {{ hostvars[item]['spur_wg_pubkey'] }}
      --allowed-ip {{ hostvars[item]['spur_wg_address'] }}/32
      --endpoint {{ hostvars[item]['ansible_host'] | default(item) }}:{{ spur_wg_port }}
      --interface {{ spur_wg_interface }}
  loop: "{{ spur_wg_registerable | default([]) }}"
  when:
    - inventory_hostname in groups['spur_controllers']
    - item != inventory_hostname
  changed_when: true

# ---------------------------------------------------------------------------
# Full-mesh pass (HA only: more than one controller).
#
# `net join` + `add-peer` above build a hub-and-spoke — every joiner peers only
# the bootstrap controller. That is fine when [cluster].enabled runs the
# controller's reconcile loop (it converges the full mesh), but a pure-spurd HA
# cluster has no such loop, and Raft REQUIRES the controllers to reach each other
# directly (.1<->.3<->.4) to hold elections when the bootstrap is down. So on
# every mesh node we run `spur net mesh`, which programs the remaining node<->node
# tunnels from a shared membership document. Additive and idempotent; it does not
# disturb the bootstrap peer each joiner already has.
#
# Gated on >1 controller so single-controller clusters are byte-for-byte
# unchanged (they keep relying on the reconcile loop / hub-and-spoke as before).
#
# The membership doc is built only from members whose pubkey is known in THIS
# play (spur_wg_selfkey defined). In a full deploy that is every node, giving a
# complete mesh. In the incremental add_nodes.yml play — which runs only on the
# bootstrap controller + the new node — it is just those, so `net mesh` still
# wires the new node to the bootstrap (the other controllers keep their existing
# full-mesh entries and re-handshake the new node from their side).
- name: Read this node's own WG public key (all mesh members)
  ansible.builtin.command: "wg show {{ spur_wg_interface }} public-key"
  register: wg_selfkey
  changed_when: false
  when: groups['spur_controllers'] | length > 1

- name: Publish own pubkey as a hostvar
  ansible.builtin.set_fact:
    spur_wg_selfkey: "{{ wg_selfkey.stdout | trim }}"
  when: groups['spur_controllers'] | length > 1

- name: Build the set of mesh members whose pubkey is known this play
  # selectattr on spur_wg_selfkey so a node that did NOT run in this play (e.g.
  # the non-bootstrap controllers during add_nodes.yml) is excluded rather than
  # rendering an undefined-attribute error.
  ansible.builtin.set_fact:
    spur_wg_mesh_members: >-
      {{ (groups['spur_controllers'] + groups['spur_agents'] + groups.get('spur_login', []))
         | unique
         | map('extract', hostvars)
         | selectattr('spur_wg_selfkey', 'defined')
         | map(attribute='inventory_hostname') | list }}
  when: groups['spur_controllers'] | length > 1

- name: Assemble the full-mesh membership document on every node
  # Render the JSON directly with a {% for %} block (Jinja list comprehensions
  # inside a dict literal aren't accepted here, and a from_json round-trip hits
  # Ansible's list/str coercion) — copy writes the string verbatim.
  ansible.builtin.copy:
    dest: "/etc/wireguard/{{ spur_wg_interface }}-mesh.json"
    mode: "0600"
    content: |
      {"nodes": [
      {% for h in spur_wg_mesh_members %}
        {"hostname": "{{ h }}", "public_key": "{{ hostvars[h].spur_wg_selfkey }}", "mesh_ip": "{{ hostvars[h].spur_wg_address }}", "endpoint": "{{ hostvars[h].ansible_host | default(h) }}:{{ spur_wg_port }}"}{% if not loop.last %},{% endif %}
      {% endfor %}
      ]}
  when:
    - groups['spur_controllers'] | length > 1
    - spur_wg_mesh_members | default([]) | length > 1

- name: Apply full mesh on every node (forms node<->node tunnels, incl. controller<->controller)
  ansible.builtin.command: >-
    {{ spur_install_dir }}/spur net mesh
      --config /etc/wireguard/{{ spur_wg_interface }}-mesh.json
      --self {{ spur_wg_address }}
      --interface {{ spur_wg_interface }}
  register: wg_mesh_apply
  changed_when: true
  when:
    - groups['spur_controllers'] | length > 1
    - spur_wg_mesh_members | default([]) | length > 1
    - inventory_hostname in spur_wg_mesh_members

# net init/join bring the interface up but never enable the systemd unit, so it's gone on reboot.
# Enabling wg-quick@<iface> recreates it from the conf; spurctld then re-pushes peer membership.
- name: Enable wg-quick@{{ spur_wg_interface }} so the mesh survives reboot
  ansible.builtin.systemd:
    name: "wg-quick@{{ spur_wg_interface }}"
    enabled: true
  when: spur_wg_persist | default(true) | bool

- name: Verify mesh — every host pings controller WG IP
  ansible.builtin.command: "ping -c2 -W2 {{ hostvars[groups['spur_controllers'][0]]['spur_wg_address'] }}"
  register: wg_ping
  changed_when: false
  failed_when: false

- name: Warn if the WG mesh ping did not succeed
  ansible.builtin.debug:
    msg: >-
      WARNING: could not ping the controller over WireGuard
      ({{ hostvars[groups['spur_controllers'][0]]['spur_wg_address'] }}).
      The tunnel is configured (interface + peers are up) but traffic did not
      pass — expected when all hosts already share an L2/L3 network, or a real
      routing/firewall issue otherwise. Verify with `wg show {{ spur_wg_interface }}`.
  when: wg_ping.rc | default(1) != 0
