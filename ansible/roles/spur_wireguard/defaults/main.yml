---
# WireGuard transport supports single- and multi-controller (HA) clusters. The
# bootstrap controller runs `spur net init` (.1); every other node joins, and for
# HA a `spur net mesh` pass peers all nodes so Raft works over the mesh. The role
# assigns each joiner a unique address (.2, .3, ...) by position, or honors a
# per-host spur_wg_address set in inventory. Requires the ansible.utils collection
# on the control node (ansible-galaxy collection install -r requirements.yml).
