---
# Native-plugin authentication + RBAC provisioning. Runs on controllers, agents,
# and login nodes when spur_auth_enabled. It:
#   1. distributes JWKS key material per role to {{ spur_auth_conf_dir }} (0600),
#   2. installs and starts spurauthd (the per-host credential mint),
#   3. drops a CLI-facing /etc/spur/spur.conf (+ /etc/environment vars) so root
#      automation and login users present native credentials.
# The control-node spur_auth_keys_dir is the source of truth for keys, generated
# once on the first controller (hybrid: pre-populate it to bring your own).
# Idempotent — reused by deploy.yml, add_nodes.yml, and rolling_upgrade.yml's
# auth carry-forward.

- name: Classify this host's auth roles
  ansible.builtin.set_fact:
    spur_auth_is_controller: "{{ inventory_hostname in groups['spur_controllers'] }}"
    spur_auth_is_agent: "{{ inventory_hostname in groups['spur_agents'] }}"
    spur_auth_is_login: "{{ inventory_hostname in groups.get('spur_login', []) }}"

# --- Preflight (non-fatal): the two prerequisites most likely to make auth fail
# in confusing ways. Warn, don't block. ---
- name: Preflight — is the clock synchronized? (creds live {{ spur_authd_lifetime_secs | default(30) }}s, ~5s skew tolerated)
  ansible.builtin.shell: |
    set +e
    [ "$(timedatectl show -p NTPSynchronized --value 2>/dev/null)" = "yes" ] && { echo OK; exit 0; }
    for svc in chrony chronyd systemd-timesyncd ntp ntpd; do
      systemctl is-active --quiet "$svc" 2>/dev/null && { echo OK; exit 0; }
    done
    echo UNSYNCED
  args:
    executable: /bin/bash
  register: spur_auth_clock
  changed_when: false
  failed_when: false

- name: Warn if no time synchronization is detected
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ inventory_hostname }} shows no time sync (timedatectl
      NTPSynchronized=no and no chrony/ntp/timesyncd active). Native credentials
      last {{ spur_authd_lifetime_secs | default(30) }}s and tolerate only ~5s of
      clock skew — enable NTP/chrony before switching to spur_auth_mode=required.
  when: "'UNSYNCED' in (spur_auth_clock.stdout | default(''))"

- name: Preflight — do the configured RBAC principals resolve via NSS?
  ansible.builtin.shell: |
    set +e
    missing=""
    for u in {{ spur_cluster_admins | default([]) | map('quote') | join(' ') }}; do
      getent passwd "$u" >/dev/null 2>&1 || missing="$missing user:$u"
    done
    for g in {{ ((spur_admin_groups | default([])) + (spur_operator_groups | default([]))) | map('quote') | join(' ') }}; do
      getent group "$g" >/dev/null 2>&1 || missing="$missing group:$g"
    done
    [ -n "$missing" ] && echo "UNRESOLVED:$missing"
    exit 0
  args:
    executable: /bin/bash
  register: spur_auth_nss
  changed_when: false
  failed_when: false
  when: >-
    (spur_cluster_admins | default([]) | length > 0)
    or (spur_admin_groups | default([]) | length > 0)
    or (spur_operator_groups | default([]) | length > 0)

- name: Warn about RBAC principals that don't resolve on this host
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ inventory_hostname }} cannot resolve
      {{ spur_auth_nss.stdout | trim | regex_replace('^UNRESOLVED:', '') }}.
      RBAC binds by the caller's resolved username/groups, so an unresolvable
      principal silently grants no role. Users must resolve on login/compute
      nodes; groups on the controller and compute nodes.
  when:
    - spur_auth_nss is defined
    - "'UNRESOLVED' in (spur_auth_nss.stdout | default(''))"

- name: Ensure the auth config/key directory exists
  ansible.builtin.file:
    path: "{{ spur_auth_conf_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# spurauthd is mandatory once auth is enabled — fail with a clear message here
# rather than letting the socket wait below time out cryptically.
- name: Verify the spurauthd binary is installed
  ansible.builtin.stat:
    path: "{{ spur_install_dir }}/spurauthd"
  register: spur_authd_bin

- name: Fail early if spurauthd is missing
  ansible.builtin.fail:
    msg: >-
      spur_auth_enabled=true but {{ spur_install_dir }}/spurauthd is missing on
      {{ inventory_hostname }}. Build it (`cargo build --release -p spurauthd`
      into spur_binary_src) or use a release/nightly that includes ROCm/spur#919,
      then re-run.
  when: not (spur_authd_bin.stat.exists | default(false))

# --- Key material (hybrid). The control-node spur_auth_keys_dir is the source of
# truth. Generate the sets once on the first controller only if any are missing
# there, fetch them back, then distribute per role. Bring-your-own = pre-populate
# the dir; generation is then skipped entirely. ---
- name: Ensure the control-node keys dir exists
  ansible.builtin.file:
    path: "{{ spur_auth_keys_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false
  run_once: true

- name: Check which key files already exist on the control node
  ansible.builtin.stat:
    path: "{{ spur_auth_keys_dir }}/{{ item }}"
  loop: "{{ spur_auth_key_files }}"
  register: spur_auth_local_keys
  delegate_to: localhost
  become: false
  run_once: true

- name: Decide whether key material must be generated
  ansible.builtin.set_fact:
    spur_auth_keys_missing: "{{ spur_auth_local_keys.results | rejectattr('stat.exists') | list | length > 0 }}"
  run_once: true

- name: Generate JWKS on the first controller (only if any are missing)
  # auth-keys writes 0600 files; its own log goes to stderr, so stdout is just
  # the temp dir path we echo (captured for the fetch below).
  ansible.builtin.shell: |
    set -euo pipefail
    tmp="$(mktemp -d)"
    S="{{ spur_install_dir }}/spur"
    "$S" auth-keys hmac    --kid auth-1 --out     "$tmp/auth.jwks"                                                   1>&2
    "$S" auth-keys ed25519 --kid ctrl-1 --signing "$tmp/controller-signing.jwks" --verify "$tmp/controller-verification.jwks" 1>&2
    "$S" auth-keys ed25519 --kid cred-1 --signing "$tmp/cred-signing.jwks"       --verify "$tmp/cred-verification.jwks"       1>&2
    "$S" auth-keys ed25519 --kid node-1 --signing "$tmp/node-signing.jwks"       --verify "$tmp/node-verification.jwks"       1>&2
    echo "$tmp"
  args:
    executable: /bin/bash
  register: spur_auth_gen
  changed_when: true
  delegate_to: "{{ groups['spur_controllers'][0] }}"
  run_once: true
  when: spur_auth_keys_missing

- name: Fetch the generated keys back to the control node (becomes the source of truth)
  ansible.builtin.fetch:
    src: "{{ spur_auth_gen.stdout | trim }}/{{ item }}"
    dest: "{{ spur_auth_keys_dir }}/{{ item }}"
    flat: true
  loop: "{{ spur_auth_key_files }}"
  delegate_to: "{{ groups['spur_controllers'][0] }}"
  run_once: true
  when: spur_auth_keys_missing

- name: Remove the temporary key dir on the controller
  ansible.builtin.file:
    path: "{{ spur_auth_gen.stdout | trim }}"
    state: absent
  delegate_to: "{{ groups['spur_controllers'][0] }}"
  run_once: true
  when: spur_auth_keys_missing

- name: Compute the key files this host needs (per role; union for a dual-role host)
  ansible.builtin.set_fact:
    spur_auth_host_keys: >-
      {{ ['auth.jwks']
         + (['controller-signing.jwks', 'cred-signing.jwks', 'node-signing.jwks'] if spur_auth_is_controller else [])
         + (['controller-verification.jwks', 'cred-verification.jwks'] if spur_auth_is_agent else []) }}

- name: Distribute this host's key files (mode 0600, root-owned)
  # copy enforces mode on every run, so a file left 0644 by a manual step is
  # re-tightened here (nothing checks the mode when the daemon loads it).
  ansible.builtin.copy:
    src: "{{ spur_auth_keys_dir }}/{{ item }}"
    dest: "{{ spur_auth_conf_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ spur_auth_host_keys }}"

# --- spurauthd: the per-host credential mint. Controllers run it so root's CLI
# can mint; agents so spurd (and srun inside jobs) can; login nodes for their
# users. ---
- name: Install the spurauthd systemd unit
  ansible.builtin.template:
    src: spurauthd.service.j2
    dest: /etc/systemd/system/spurauthd.service
    mode: "0644"
  register: spur_authd_unit

- name: Enable and (re)start spurauthd, then wait for the mint socket
  ansible.builtin.shell: |
    set -e
    systemctl daemon-reload
    systemctl enable spurauthd
    systemctl restart spurauthd
    for i in $(seq 1 30); do
      [ -S "/run/spur/{{ spur_cluster_name }}/auth.sock" ] && exit 0
      sleep 1
    done
    echo "spurauthd did not create /run/spur/{{ spur_cluster_name }}/auth.sock within 30s"
    exit 1
  args:
    executable: /bin/bash
  changed_when: true

# --- CLI-facing config + env so root automation and login users present
# credentials. The daemons get [auth] from their own -f spur.conf instead. ---
- name: Write the CLI-facing /etc/spur/spur.conf (native plugin)
  ansible.builtin.template:
    src: cli-spur.conf.j2
    dest: "{{ spur_auth_conf_dir }}/spur.conf"
    owner: root
    group: root
    mode: "0644"

- name: Export SPUR_AUTH_PLUGIN in /etc/environment (interactive shells)
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^SPUR_AUTH_PLUGIN='
    line: "SPUR_AUTH_PLUGIN=spur"
    create: true

- name: Export SPUR_CLUSTER_NAME in /etc/environment (interactive shells)
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: '^SPUR_CLUSTER_NAME='
    line: "SPUR_CLUSTER_NAME={{ spur_cluster_name }}"
    create: true
