[defaults]
inventory = inventory/hosts.ini
roles_path = roles
# On by default for safety. For first-time provisioning of fresh hosts whose
# keys aren't yet in known_hosts, override per-run with
# ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook ...
host_key_checking = True
forks = 20
retry_files_enabled = False
deprecation_warnings = False
interpreter_python = auto_silent
# How long to wait establishing a new SSH connection (Ansible appends its own
# -o ConnectTimeout={{ this }} AFTER ssh_connection's ssh_args below, so it's
# the one that actually wins — OpenSSH takes the LAST occurrence of a repeated
# -o option. An explicit ConnectTimeout inside ssh_args is therefore always a
# silent no-op; don't add one there, set it here instead. 60s because some
# fleet nodes genuinely take that long to complete a fresh SSH login (slow
# PAM/LDAP/disk, not unreachability) — the previous effective value (10s, this
# setting's own hardcoded default, since nothing overrode it before) was
# false-failing on those. Override per-run with -e ansible_ssh_timeout=N if a
# specific fleet needs something else (faster failure on a reliable LAN, or
# more slack on a slower one).
timeout = 60

[ssh_connection]
pipelining = True
# No BatchMode=yes here: it disables SSH's password prompt outright, which
# breaks password-based auth (ansible_password + sshpass) even though the
# playbook is documented to support it. Key-based auth is unaffected either way.
#
# ControlPersist=60s keeps a multiplexed master socket open after a task's
# connection is done, reused by later tasks. If an agent goes unreachable via
# a silent packet drop (firewall DROP, dead switch port, real network
# partition) rather than a clean refuse/reset, tasks that delegate to it or
# reuse its control socket (e.g. spur_controller's "gather facts for any agent
# missing them", which deliberately retries hosts already known to be down)
# can hang indefinitely — [defaults] timeout above only bounds a brand-new
# connection, not one already established. ignore_unreachable/ignore_errors
# only affect how the result is handled, not how long the stalled connection
# blocks.
#
# ServerAlive keepalives (needed to bound that) are set as ansible_ssh_extra_args
# in inventory/group_vars/all.yml (spur_ssh_server_alive_interval/count_max)
# instead of here, since this file can't read -e overrides and that tuning is
# fleet-dependent — see the comment there for why the default is looser than
# a fresh connect is expected to need.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
