[defaults]
inventory = inventory/hosts.ini
roles_path = roles
# On by default for safety. For first-time provisioning of fresh hosts whose
# keys aren't yet in known_hosts, override per-run with
# ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook ...
host_key_checking = True
forks = 20
retry_files_enabled = False
deprecation_warnings = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
# No BatchMode=yes here: it disables SSH's password prompt outright, which
# breaks password-based auth (ansible_password + sshpass) even though the
# playbook is documented to support it. Key-based auth is unaffected either way.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ConnectTimeout=15
