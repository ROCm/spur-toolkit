[defaults]
inventory = inventory/hosts.ini
roles_path = roles
# On by default for safety. For first-time provisioning of fresh hosts whose
# keys aren't yet in known_hosts, override per-run with
# ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook ...
host_key_checking = True
forks = 20
retry_files_enabled = False
deprecation_warnings = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
# No BatchMode=yes here: it disables SSH's password prompt outright, which
# breaks password-based auth (ansible_password + sshpass) even though the
# playbook is documented to support it. Key-based auth is unaffected either way.
#
# ConnectTimeout only bounds a brand-new TCP handshake — it does nothing for
# a connection that's already established, including a ControlPersist=60s
# multiplexed master socket left open from an earlier task. If an agent goes
# unreachable via a silent packet drop (firewall DROP, dead switch port, real
# network partition) rather than a clean refuse/reset, tasks that delegate to
# it or reuse its control socket (e.g. spur_controller's "gather facts for any
# agent missing them", which deliberately retries hosts already known to be
# down) can hang indefinitely — ignore_unreachable/ignore_errors only affect
# how the result is handled, not how long the stalled connection blocks.
# ServerAlive keepalives force OpenSSH to detect a dead peer (fresh or reused)
# within ~15s, matching ConnectTimeout.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3
