---
# Spur deployment — works for single-node, multi-node-direct, multi-node-wireguard.
#
# Run:
#   cd ansible
#   ansible-playbook playbooks/deploy.yml -i inventory/hosts.ini
#
# Subset to specific hosts:
#   ansible-playbook playbooks/deploy.yml -i inventory/hosts.ini --limit gpu-1
#
# Tear down (keeps installed binaries):
#   ansible-playbook playbooks/teardown.yml -i inventory/hosts.ini

- name: Preflight + install Spur on all hosts
  # Accounting is embedded in spurctld now — a dedicated (non-controller/non-agent)
  # accounting host runs only Postgres and needs no spur binaries, so it is not
  # included here (spur_accounting role handles it independently). Login nodes DO
  # need the CLI binaries, so they're included (the group is empty by default,
  # making login nodes opt-in).
  hosts: "spur_controllers:spur_agents:spur_login"
  become: true
  gather_facts: yes
  # A down agent is skipped when spur_ignore_unreachable_agents=true; a down
  # controller is still caught by the strict "Start controller" play below.
  ignore_unreachable: "{{ spur_ignore_unreachable_agents | default(false) | bool }}"
  any_errors_fatal: "{{ not (spur_ignore_unreachable_agents | default(false) | bool) }}"
  roles:
    - role: spur_install

- name: Configure WireGuard mesh (when spur_transport == wireguard)
  # Login nodes join the mesh too, so interactive `srun` can stream job output
  # directly from agents over the tunnel.
  # Gate at the PLAY level via hosts: — when transport isn't wireguard the pattern
  # matches no hosts (:!all removes everything) and the whole play is skipped as a
  # single "no hosts matched" line. A role-level `when:` instead attaches to every
  # task in the role and prints a "skipping" line per-task per-host (21 tasks x
  # every node), which is slow and noisy on a large direct-transport cluster.
  hosts: "spur_controllers:spur_agents:spur_login{{ '' if (spur_transport | default('direct')) == 'wireguard' else ':!all' }}"
  become: true
  gather_facts: no
  any_errors_fatal: true
  roles:
    - role: spur_wireguard

- name: Deploy accounting stack (PostgreSQL) on the accounting host
  # Runs BEFORE the controllers so Postgres is reachable when spurctld starts and
  # first tries to connect its embedded accounting service. Accounting is a single
  # database for the whole cluster; Postgres runs on spur_accounting_host (default:
  # first controller, but may be any managed host incl. a dedicated node). Every
  # controller connects to it directly over the network. Set
  # spur_accounting_enabled=false to skip the stack entirely.
  hosts: "{{ spur_accounting_host | default(groups['spur_accounting_node'][0] if (groups['spur_accounting_node'] | default([]) | length > 0) else groups['spur_controllers'][0]) }}"
  become: true
  gather_facts: yes
  any_errors_fatal: true
  roles:
    # No role-level `when` here: spur_accounting's pre-merge spurdbd cleanup tasks
    # are intentionally unconditional (see the role's tasks/main.yml), and a
    # role-level `when` would AND itself onto every task in the role, including
    # those — gating happens per-task inside the role instead.
    - role: spur_accounting

- name: Start controller
  hosts: spur_controllers
  become: true
  gather_facts: no
  any_errors_fatal: true
  roles:
    - role: spur_controller

- name: Start agents
  hosts: spur_agents
  become: true
  gather_facts: no
  # Agents only: optionally skip unreachable ones (see spur_ignore_unreachable_agents).
  any_errors_fatal: "{{ not (spur_ignore_unreachable_agents | default(false) | bool) }}"
  ignore_unreachable: "{{ spur_ignore_unreachable_agents | default(false) | bool }}"
  serial: 0      # parallel
  roles:
    - role: spur_agent

# Login (submission) nodes: opt-in via the [spur_login] inventory group (empty ->
# this play matches zero hosts and no-ops). No daemon runs here — just the CLI
# (installed above) + the client env pointing at the controllers. Runs after the
# controllers so SPUR_CONTROLLER_ADDR points at a live control plane.
- name: Configure login (submission) nodes
  hosts: spur_login
  become: true
  gather_facts: no
  any_errors_fatal: true
  roles:
    - role: spur_login

- name: Verify with test jobs
  hosts: spur_controllers[0]
  become: true
  gather_facts: no
  roles:
    - role: spur_verify
