---
# Spur deployment — works for single-node, multi-node-direct, multi-node-wireguard.
#
# Run:
#   cd ansible
#   ansible-playbook playbooks/deploy.yml -i inventory/hosts.ini
#
# Subset to specific hosts:
#   ansible-playbook playbooks/deploy.yml -i inventory/hosts.ini --limit gpu-1
#
# Tear down (keeps installed binaries):
#   ansible-playbook playbooks/teardown.yml -i inventory/hosts.ini
#
# Submit a real test job at the end to verify scheduling works (default false
# — off for routine deploys, on in CI):
#   ansible-playbook playbooks/deploy.yml -i inventory/hosts.ini -e spur_verify_enabled=true
#
# Re-running against an already-running cluster restarts spurd on every agent —
# full convergence is the whole point of deploy.yml, so this is disruptive by
# design (see "In-flight jobs are disrupted" above). An already-registered
# agent is drained first; if it's still busy, its job is killed and the
# restart proceeds anyway, by default. Pass -e spur_skip_busy_agents=true to
# opt OUT of that and leave busy nodes untouched instead, continuing with the
# rest of the fleet:
#   ansible-playbook playbooks/deploy.yml -i inventory/hosts.ini -e spur_skip_busy_agents=true
#
# Controllers and agents both get spur.conf (spurd reads it best-effort for
# [cluster]/k0s and [devices]/GRES settings). A missing spur.conf is always
# written; an existing one is left alone unless you pass -e spur_overwrite_conf=true.
#
# First run against a pre-existing direct-transport agent that predates the
# spur-CLI-everywhere change: it won't have `spur` yet, so this run re-fetches
# the release (network dependency) to install it, once.

- name: Preflight + install Spur on all hosts
  # Accounting is embedded in spurctld now — a dedicated (non-controller/non-agent)
  # accounting host runs only Postgres and needs no spur binaries, so it is not
  # included here (spur_accounting role handles it independently). Login nodes DO
  # need the CLI binaries, so they're included (the group is empty by default,
  # making login nodes opt-in).
  #
  # Split strict/lenient by `hosts:` (not a templated any_errors_fatal) because
  # ansible-core does not honor a Jinja-templated any_errors_fatal alongside
  # ignore_unreachable — it stays fatal regardless of the resolved value. Each
  # variant below uses a static literal instead; only one ever matches hosts.
  hosts: "spur_controllers:spur_agents:spur_login{{ '' if not (spur_ignore_unreachable_agents | default(false) | bool) else ':!all' }}"
  become: true
  gather_facts: yes
  gather_subset: "{{ spur_gather_subset | default(['!all', 'network', 'hardware', 'distribution']) }}"
  any_errors_fatal: true
  roles:
    - role: spur_install

- name: Preflight + install Spur on all hosts (tolerate unreachable agents)
  # A down agent is skipped when spur_ignore_unreachable_agents=true; a down
  # controller is still caught by the strict "Start controller" play below.
  hosts: "spur_controllers:spur_agents:spur_login{{ '' if (spur_ignore_unreachable_agents | default(false) | bool) else ':!all' }}"
  become: true
  gather_facts: yes
  gather_subset: "{{ spur_gather_subset | default(['!all', 'network', 'hardware', 'distribution']) }}"
  ignore_unreachable: true
  any_errors_fatal: false
  roles:
    - role: spur_install

# spur_wireguard and spur_auth are gated at the PLAY level (hosts: pattern),
# NOT merged into the install play's role list via role-level `when:`. A
# role-level `when:` (tried in an earlier version of this change, measured and
# reverted — see PR #53 discussion) attaches to every task in the role and
# still gets evaluated — "skipping: [host]" printed — for every host, every
# task, even when the feature is off: spur_wireguard is 29 tasks, spur_auth is
# 22, so the common case (both off) was paying for 51 extra per-host task
# evaluations that don't make a network call but are NOT free — they're local
# control-process bookkeeping (Jinja condition + result object + callback
# line), and that cost scales with raw host count, not with `forks`. Measured
# at 25 simulated hosts: ~10s of wall-clock (~6% of total deploy.yml runtime)
# for zero benefit when both features are off, which is the overwhelmingly
# common case — and the regression gets worse, not better, as fleet size
# grows, since it doesn't benefit from fork-level parallelism the way real
# SSH round trips do.
#
# A `hosts:` pattern that matches no hosts skips the ENTIRE play as a single
# "no hosts matched" bookkeeping op — no per-host, per-task evaluation at all.
# That's why these are separate plays again. When a feature IS on, you still
# get the "one fleet pass instead of two" win this merge was reaching for,
# because the play actually runs.
- name: Configure WireGuard mesh (when spur_transport == wireguard)
  # Login nodes join the mesh too, so interactive `srun` can stream job output
  # directly from agents over the tunnel.
  hosts: "spur_controllers:spur_agents:spur_login{{ '' if ((spur_transport | default('direct')) == 'wireguard' and not (spur_ignore_unreachable_agents | default(false) | bool)) else ':!all' }}"
  become: true
  gather_facts: no
  any_errors_fatal: true
  roles:
    - role: spur_wireguard

- name: Configure WireGuard mesh (tolerate unreachable agents)
  hosts: "spur_controllers:spur_agents:spur_login{{ '' if ((spur_transport | default('direct')) == 'wireguard' and (spur_ignore_unreachable_agents | default(false) | bool)) else ':!all' }}"
  become: true
  gather_facts: no
  ignore_unreachable: true
  any_errors_fatal: false
  roles:
    - role: spur_wireguard

- name: Provision native authentication (keys + spurauthd) on every host
  # Distributes JWKS keys per role, installs+starts the spurauthd mint, and drops
  # the CLI-facing /etc/spur/spur.conf — all BEFORE any daemon (re)starts on
  # plugin="spur" in the plays below. Same host union as the install plays.
  # Gated on spur_auth_enabled: off (default) -> the pattern matches no hosts and
  # the whole play is skipped. Runs after the WireGuard play so key distribution
  # (control node -> hosts over ordinary SSH) is unaffected by the mesh.
  hosts: "spur_controllers:spur_agents:spur_login{{ '' if ((spur_auth_enabled | default(false) | bool) and not (spur_ignore_unreachable_agents | default(false) | bool)) else ':!all' }}"
  become: true
  gather_facts: no
  any_errors_fatal: true
  roles:
    - role: spur_auth

- name: Provision native authentication (keys + spurauthd) on every host (tolerate unreachable agents)
  # A down agent is skipped when spur_ignore_unreachable_agents=true; a down
  # controller is still caught by the strict "Start controller" play below.
  hosts: "spur_controllers:spur_agents:spur_login{{ '' if ((spur_auth_enabled | default(false) | bool) and (spur_ignore_unreachable_agents | default(false) | bool)) else ':!all' }}"
  become: true
  gather_facts: no
  ignore_unreachable: true
  any_errors_fatal: false
  roles:
    - role: spur_auth

- name: Deploy accounting, start controllers, configure login nodes
  # Merged into one play: a play runs its role list as a sequence of tasks
  # across ALL matching hosts (role N finishes on every host before role N+1
  # starts), so per-role `when:` gating on this union of hosts preserves the
  # original ordering (accounting up before controllers connect to it; login
  # reads each controller's spur_controller_listen_ip, set via delegate_facts
  # inside the controller role, which has already run by then).
  hosts: >-
    {{ (groups['spur_controllers'] + groups.get('spur_login', []) +
        [spur_accounting_host | default(groups['spur_accounting_node'][0]
          if (groups['spur_accounting_node'] | default([]) | length > 0)
          else groups['spur_controllers'][0])]) | unique | join(':') }}
  become: true
  # The install play above already gathered facts for every controller and
  # login host it reached; a standalone accounting host was never in its
  # scope, and a controller/login host that was unreachable there (lenient
  # variant) may still lack facts too — both covered by the pre_task below.
  gather_facts: no
  any_errors_fatal: true
  pre_tasks:
    - name: Gather facts if missing (standalone accounting host, or a host unreachable during install)
      ansible.builtin.setup:
        gather_subset: "{{ spur_gather_subset | default(['!all', 'network', 'hardware', 'distribution']) }}"
      when: ansible_default_ipv4 is not defined

    # Native auth plugin switch (jwt->spur) or a mode flip must not leave a
    # switched leader forwarding to / deciding for an unswitched peer, so on an
    # HA cluster every controller must cross together. deploy.yml already
    # restarts controllers in parallel; this explicit stop-all barrier (pre_tasks
    # finish on ALL hosts before any role starts) guarantees none is briefly
    # serving the old plugin while another serves the new one. No-op on a fresh
    # install (nothing running yet). Controllers only; login/accounting hosts in
    # this play's union are skipped by the when.
    - name: Stop spurctld on all controllers together before an auth plugin switch
      ansible.builtin.systemd:
        name: spurctld
        state: stopped
      failed_when: false
      when:
        - spur_auth_enabled | default(false) | bool
        - inventory_hostname in groups['spur_controllers']
  roles:
    # No role-level `when` on spur_accounting itself here: its pre-merge
    # spurdbd cleanup tasks are intentionally unconditional (see the role's
    # tasks/main.yml) — gating happens per-task inside the role instead. The
    # `when` below only decides WHICH host runs the role at all.
    - role: spur_accounting
      when: >-
        inventory_hostname == (spur_accounting_host | default(groups['spur_accounting_node'][0]
          if (groups['spur_accounting_node'] | default([]) | length > 0)
          else groups['spur_controllers'][0]))
    - role: spur_controller
      when: inventory_hostname in groups['spur_controllers']
    # Login (submission) nodes: opt-in via the [spur_login] inventory group
    # (empty -> matches nothing here and no-ops). No daemon runs here — just
    # the CLI (installed above) + the client env pointing at the controllers.
    - role: spur_login
      when: inventory_hostname in groups.get('spur_login', [])
  post_tasks:
    - name: Collect controller verification facts
      ansible.builtin.include_tasks: tasks/collect_verification_facts.yml
      vars:
        spur_verify_daemon_name: spurctld
        spur_verify_daemon_port: "{{ spur_controller_port }}"
        spur_verify_role_label: controller
      when: inventory_hostname in groups['spur_controllers']

- name: Start agents
  # Same strict/lenient split as the install play above, and for the same
  # reason: a templated any_errors_fatal does not combine correctly with
  # ignore_unreachable in ansible-core.
  hosts: "spur_agents{{ '' if not (spur_ignore_unreachable_agents | default(false) | bool) else ':!all' }}"
  become: true
  gather_facts: no
  any_errors_fatal: true
  serial: 0      # parallel
  vars: &deploy_agents_vars
    dckj_action: deploy
    dckj_skip_busy: "{{ spur_skip_busy_agents | default(false) | bool }}"
    # Full convergence is deploy.yml's whole contract (see header comment) — a
    # busy node is drained and, if still busy, force-killed by default. Skip is
    # the opt-OUT here, not force the opt-in, unlike rolling_upgrade/teardown.
    dckj_force_busy: "{{ not (spur_skip_busy_agents | default(false) | bool) }}"
    # Unused here: force is deploy.yml's default, so the shared file's refusal
    # branch (the only place this is read) can never trigger.
    dckj_force_flag: ""
  pre_tasks: &deploy_agents_pre_tasks
    - name: Resolve this node's registered name
      ansible.builtin.set_fact:
        spur_node_name: "{{ spur_node_name | default(ansible_hostname | default(inventory_hostname)) }}"

    # One query for the whole fleet instead of one delegate_to call per agent —
    # `spur show node` with NO name argument lists every registered node, so a
    # single run_once here is enough for every host to check itself against
    # the cached list below (a name argument, even a bogus one, filters
    # server-side to just that name — do not add one here).
    - name: Query full node registration list once for the whole fleet
      ansible.builtin.command: "{{ spur_install_dir }}/spur show node"
      delegate_to: "{{ groups['spur_controllers'][0] }}"
      run_once: true
      register: deploy_all_nodes
      changed_when: false
      failed_when: false

    # A brand-new agent (first-ever deploy) was never registered, so there is no
    # running job to protect and draining it would just error against an
    # unknown node name — only guard agents that already exist in the cluster.
    - name: Is this node already registered with the controller?
      ansible.builtin.set_fact:
        deploy_agent_registered: "{{ ('NodeName=' + spur_node_name) in (deploy_all_nodes.stdout_lines | default([])) }}"

    - name: Drain + guard already-registered agents against job loss
      ansible.builtin.include_tasks: tasks/drain_and_guard_agent.yml
      when: deploy_agent_registered
  roles:
    - role: spur_agent
      when: >-
        not deploy_agent_registered or
        not (spur_node_busy | default(false)) or
        dckj_force_busy
  post_tasks: &deploy_agents_post_tasks
    - name: Re-register + undrain the node now that it's back
      ansible.builtin.include_tasks: tasks/resume_and_undrain_agent.yml
      when: deploy_agent_registered

    - name: Collect agent verification facts
      ansible.builtin.include_tasks: tasks/collect_verification_facts.yml
      vars:
        spur_verify_daemon_name: spurd
        spur_verify_daemon_port: "{{ spur_agent_port }}"
        spur_verify_role_label: agent
        spur_verify_check_registration: true

- name: Start agents (tolerate unreachable agents)
  hosts: "spur_agents{{ '' if (spur_ignore_unreachable_agents | default(false) | bool) else ':!all' }}"
  become: true
  gather_facts: no
  ignore_unreachable: true
  any_errors_fatal: false
  serial: 0      # parallel
  vars: *deploy_agents_vars
  pre_tasks: *deploy_agents_pre_tasks
  roles:
    - role: spur_agent
      when: >-
        not deploy_agent_registered or
        not (spur_node_busy | default(false)) or
        dckj_force_busy
  post_tasks: *deploy_agents_post_tasks

- name: Verify with test jobs
  # Opt-in (see spur_verify_enabled) — submits a real job, so it's off by
  # default for routine deploys and enabled explicitly in CI.
  hosts: "spur_controllers[0]{{ '' if (spur_verify_enabled | default(false) | bool) else ':!all' }}"
  become: true
  gather_facts: no
  roles:
    - role: spur_verify

- name: Print verification summary
  hosts: spur_controllers[0]
  become: false
  gather_facts: no
  tasks:
    - ansible.builtin.include_tasks: tasks/print_verification_summary.yml
