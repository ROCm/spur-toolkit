---
# Bring up the SPUR-managed k0s cluster on a deployed Spur cluster.
#
# Prerequisites (run deploy.yml first):
#   - spurctld/spurd are running and every target node is registered.
#   - spur.conf carries the [cluster] section — set spur_k8s_enabled=true in
#     group_vars (or -e) BEFORE deploy.yml so the controllers were rendered with it.
#   - For pod traffic on the mesh: spur_transport=wireguard and spur_k8s_cni=calico.
#
# This calls `spur k8s up` on the first controller (the controller assigns roles,
# mesh IPs, and per-node pod CIDRs, installs k0s on each scoped node, and reconciles
# the full WireGuard mesh). It then polls `spur k8s status` until the cluster is
# ready or a timeout elapses. It does NOT restart spurctld/spurd.
#
# Run:
#   ansible-playbook playbooks/k8s_up.yml -i inventory/hosts.ini
#   # single control plane:
#   ansible-playbook playbooks/k8s_up.yml -i inventory/hosts.ini \
#     -e spur_k8s_control_plane_nodes=k8-master -e spur_k8s_nodes=k8-master,gpu-1
#   # HA (3-node) control plane:
#   ansible-playbook playbooks/k8s_up.yml -i inventory/hosts.ini \
#     -e spur_k8s_control_plane_nodes=cp1,cp2,cp3 -e 'spur_k8s_nodes=cp[1-3],gpu[11-13]'

- name: Bring up the k0s cluster
  hosts: "{{ groups['spur_controllers'][0] }}"
  become: true
  gather_facts: no
  any_errors_fatal: true
  vars:
    ctrl_addr: "http://{{ hostvars[groups['spur_controllers'][0]]['spur_controller_listen_ip'] | default('127.0.0.1') }}:{{ spur_controller_port }}"
    k8s_ready_retries: 60
    k8s_ready_delay: 15
  tasks:
    - name: Require the [cluster] section to have been deployed
      ansible.builtin.assert:
        that:
          - spur_k8s_enabled | default(false) | bool
        fail_msg: >-
          spur_k8s_enabled is false. Set it true in group_vars (or -e), re-run
          deploy.yml so spur.conf gets the [cluster] section, then re-run this.
        quiet: true

    # spur_k8s_control_plane_nodes: CSV of k0s CP node names (1 = single, 3/5 = HA; first = etcd
    # bootstrap). --control-plane-nodes takes one or many. Empty defaults to the first SPUR controller.
    - name: "Resolve the k0s control-plane node set (default: first controller's node name)"
      ansible.builtin.set_fact:
        k8s_cp_nodes: "{{ spur_k8s_control_plane_nodes if (spur_k8s_control_plane_nodes | default('') | length > 0) else (hostvars[groups['spur_controllers'][0]]['spur_node_name'] | default(groups['spur_controllers'][0])) }}"

    - name: spur k8s up
      # Idempotent-ish: if the cluster is already up the controller reports it and returns 0.
      # --nodes scopes the cluster; empty means whole inventory.
      ansible.builtin.command: >-
        {{ spur_install_dir }}/spur k8s up
          --controller {{ ctrl_addr }}
          --control-plane-nodes {{ k8s_cp_nodes }}
          {% if spur_k8s_nodes | default('') | length > 0 %}--nodes {{ spur_k8s_nodes }}{% endif %}
      register: k8s_up_out
      changed_when: "'up requested' in k8s_up_out.stdout"

    - name: Show the up response
      ansible.builtin.debug:
        var: k8s_up_out.stdout_lines

    - name: Wait for the cluster to reach ready
      ansible.builtin.shell: |
        {{ spur_install_dir }}/spur k8s status --controller {{ ctrl_addr }} 2>/dev/null \
          | awk '/^phase:/ {print $2}'
      args:
        executable: /bin/bash
      register: k8s_phase
      until: k8s_phase.stdout | trim == 'ready'
      retries: "{{ k8s_ready_retries }}"
      delay: "{{ k8s_ready_delay }}"
      changed_when: false
      failed_when: k8s_phase.stdout | trim == 'degraded'

    - name: Final cluster status
      ansible.builtin.command: "{{ spur_install_dir }}/spur k8s status --controller {{ ctrl_addr }}"
      register: k8s_final
      changed_when: false

    - name: Result
      ansible.builtin.debug:
        var: k8s_final.stdout_lines
