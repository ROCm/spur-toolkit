---
# Decommission one or more compute nodes from a running Spur cluster.
#
# Runtime + light host cleanup — no controller restart, no state wipe (agents are
# not Raft members, so removing one never needs a Raft reinit). Per node:
#   1. drain it (stop new scheduling; running jobs finish on their own)
#   2. wait until it reports DRAINED
#   3. stop + disable spurd on the node itself (if reachable in inventory)
#   4. spur node remove --force (authoritative, WAL-durable removal)
# then remind the operator to drop it from [spur_agents] in inventory.
#
# spur.conf IS the inventory (see inventory_plugins/spur_conf.py) — the
# node(s) being removed must still be listed in it when you run this (ansible
# needs to reach them for drain/cleanup); this playbook prunes their [[nodes]]
# entries out of the master file itself, in place, once live removal succeeds.
#
# The master-file write-back has no cross-invocation lock — don't run two
# `remove_nodes.yml` (or `add_nodes.yml`) invocations against the same
# spur.conf concurrently, or the later write can clobber the earlier one.
# No manual file edit needed afterward, unlike add_nodes.yml's precondition.
#
# Run:
#   ansible-playbook playbooks/remove_nodes.yml -i spur.conf -e nodes_to_remove=gpu-3,gpu-4
#
# Names are the node names as they appear in `spur nodes` (each agent's
# spur.conf [[nodes]].names). Draining/removal are done from the first
# controller; the spurd stop is attempted on the matching inventory host when
# one exists (an already-dead host is fine — it's skipped).
#
# A node with a job still running does not finish draining. Same job-safety
# model as deploy.yml/rolling_upgrade.yml/teardown.yml: by default the run
# aborts before removing anything. Re-run with -e spur_skip_busy_agents=true
# to remove only the nodes that drained cleanly (leaving busy ones in the
# cluster, un-removed), or -e spur_force_remove_busy_nodes=true to kill the
# running job on a busy node and remove it anyway:
#   ansible-playbook playbooks/remove_nodes.yml -i spur.conf -e nodes_to_remove=gpu-3,gpu-4 -e spur_force_remove_busy_nodes=true

- name: Guard rails + node decommission
  hosts: "{{ groups['spur_controllers'][0] }}"
  become: true
  gather_facts: no
  any_errors_fatal: true
  vars:
    remove_list: "{{ nodes_to_remove | default('') | split(',') | map('trim') | select | unique | list }}"
  tasks:
    - name: Require nodes_to_remove
      ansible.builtin.assert:
        that:
          - remove_list | length > 0
        fail_msg: >-
          Pass the node(s) to remove, e.g.
          -e nodes_to_remove=gpu-3,gpu-4
        quiet: true

    - name: Check the cluster is healthy before starting
      ansible.builtin.command: "{{ spur_install_dir }}/spur nodes"
      register: rn_health
      changed_when: false
      failed_when: rn_health.rc != 0

    # No name arg returns every node's NodeName= line in one call (a name arg
    # filters server-side) — catches a typo before anything is touched.
    - name: List registered nodes
      ansible.builtin.command: "{{ spur_install_dir }}/spur show node"
      register: rn_all_nodes
      changed_when: false

    # A name can legitimately be gone from `spur show node` but still sit in
    # spur.conf's [[nodes]] — e.g. a prior run's live removal succeeded but
    # the master-file write-back at the end didn't. Re-running must finish
    # pruning it, not hard-fail; only a name unknown to BOTH is a real typo.
    - name: Split nodes_to_remove into currently-registered vs already-gone
      vars:
        rn_registered_names: "{{ rn_all_nodes.stdout_lines | select('match', '^NodeName=') | map('regex_replace', '^NodeName=', '') | list }}"
      ansible.builtin.set_fact:
        rn_registered_list: "{{ remove_list | intersect(rn_registered_names) }}"
        rn_already_gone_list: "{{ remove_list | difference(rn_registered_names) }}"

    - name: Fail if nodes_to_remove names a node unknown to both the cluster and spur.conf
      ansible.builtin.fail:
        msg: "nodes_to_remove included {{ item }}, which isn't in `spur show node` or spur.conf's [[nodes]]."
      loop: "{{ rn_already_gone_list }}"
      when: item not in groups['spur_agents']

    - name: Note nodes already removed live — will only be pruned from spur.conf
      ansible.builtin.debug:
        msg: "{{ item }} is already gone from the cluster; skipping drain, will still be pruned from spur.conf."
      loop: "{{ rn_already_gone_list }}"

    # Pruned here, immediately, rather than waiting for the final write-back at
    # the end of the play — a busy-node refusal below (any_errors_fatal: true)
    # would otherwise abort the whole run before that later write-back for an
    # UNRELATED node in the same invocation ever executes. Idempotent: a name
    # already absent from the file is simply a no-op for spur_conf_remove_node.
    - name: Prune already-gone node(s) from the master file right away
      ansible.builtin.copy:
        content: "{{ lookup('file', inventory_file) | spur_conf_remove_node(rn_already_gone_list) }}"
        dest: "{{ inventory_file }}"
      delegate_to: localhost
      become: false
      when: rn_already_gone_list | length > 0

    - name: Drain each node (stop new scheduling; running jobs finish first)
      ansible.builtin.command: >-
        {{ spur_install_dir }}/spur node drain {{ item }}
        --reason "ansible decommission"
      loop: "{{ rn_registered_list }}"
      changed_when: true

    # Also accept DOWN: a genuinely unreachable node may independently cross
    # its heartbeat timeout and flip to DOWN, an equally valid "stopped
    # scheduling here" outcome — same acceptance as drain_and_guard_agent.yml.
    - name: Wait for each node to fully drain
      ansible.builtin.shell: |
        for i in $(seq 1 {{ spur_drain_wait_secs | default(120) }}); do
          st=$({{ spur_install_dir }}/spur show node {{ item }} 2>/dev/null \
               | awk -v n="{{ item }}" '/^NodeName=/{p=($0=="NodeName="n)} p' \
               | grep -oE 'State=[A-Z]+' | head -1 | cut -d= -f2)
          case "$st" in
            DRAINED|DOWN) exit 0 ;;
          esac
          sleep 1
        done
        echo "timed out waiting for {{ item }} to drain (last state: $st)"
        exit 1
      args:
        executable: /bin/bash
      loop: "{{ rn_registered_list }}"
      register: rn_drain_wait
      changed_when: false
      # Non-fatal here — a still-busy node is an expected case handled below
      # via rn_busy_nodes, not an error.
      failed_when: false

    - name: Determine which nodes are busy (reachable but still draining)
      ansible.builtin.set_fact:
        rn_busy_nodes: "{{ rn_drain_wait.results | selectattr('rc', 'ne', 0) | map(attribute='item') | list }}"

    - name: Refuse to remove busy nodes unless skip or force is set
      ansible.builtin.fail:
        msg: >-
          These nodes still have a running job and did not drain within
          {{ spur_drain_wait_secs | default(120) }}s: {{ rn_busy_nodes | join(', ') }}.
          Node removal never force-kills running work by default. Re-run with
          -e spur_skip_busy_agents=true to remove only the nodes that drained
          cleanly and leave these in the cluster, or with
          -e spur_force_remove_busy_nodes=true to remove them immediately and
          accept that their running jobs will be killed.
      when: >-
        rn_busy_nodes | length > 0
        and not (spur_skip_busy_agents | default(false) | bool)
        and not (spur_force_remove_busy_nodes | default(false) | bool)

    - name: Note busy nodes are being left in the cluster
      ansible.builtin.debug:
        msg: >-
          Leaving these busy nodes in the cluster, un-removed
          (spur_skip_busy_agents=true): {{ rn_busy_nodes | join(', ') }}
      when: >-
        rn_busy_nodes | length > 0
        and (spur_skip_busy_agents | default(false) | bool)
        and not (spur_force_remove_busy_nodes | default(false) | bool)

    - name: Warn that running jobs on busy nodes WILL be killed
      ansible.builtin.debug:
        msg: >-
          WARNING: spur_force_remove_busy_nodes=true — killing job processes
          on: {{ rn_busy_nodes | join(', ') }}
      when: >-
        rn_busy_nodes | length > 0
        and (spur_force_remove_busy_nodes | default(false) | bool)

    # Everything proceeds when forced; otherwise busy nodes are dropped from
    # the list (they were already refused above unless spur_skip_busy_agents
    # was set) so play 3 only removes the nodes that actually drained.
    # Already-gone nodes need no live action (removal/peer-drop are already
    # idempotent no-ops for them) but must still reach the write-back below.
    - name: Compute the final list of nodes to actually remove
      ansible.builtin.set_fact:
        rn_actual_remove_list: >-
          {{ (rn_registered_list if (spur_force_remove_busy_nodes | default(false) | bool)
              else (rn_registered_list | difference(rn_busy_nodes)))
             + rn_already_gone_list }}

- name: Stop the agent on each removed node (best effort, if in inventory)
  # Map each requested name back to the inventory host whose spur_node_name /
  # ansible_hostname matches, and stop spurd there. A node that isn't in the
  # current inventory (or is unreachable) is simply skipped — step 4 below still
  # removes it from the controller's view.
  hosts: spur_agents
  become: true
  gather_facts: yes
  gather_subset: "{{ spur_gather_subset | default(['!all', 'network', 'hardware', 'distribution']) }}"
  # An unrelated agent being down must not abort the removal (the play already
  # intends to skip unreachable nodes). Opt in with spur_ignore_unreachable_agents.
  # An unreachable host has no gathered facts, so the when: guards below fall back
  # to inventory_hostname (ansible_hostname | default(...)) to avoid an undefined-var error.
  ignore_unreachable: "{{ spur_ignore_unreachable_agents | default(false) | bool }}"
  vars:
    # rn_actual_remove_list was set via plain set_fact on the controller in
    # play 1 (a DIFFERENT host) — a bare reference here would look at THIS
    # host's own (unset) vars, not the controller's, so it must go through
    # hostvars[] explicitly.
    rn_actual_remove_list: "{{ hostvars[groups['spur_controllers'][0]].rn_actual_remove_list | default([]) }}"
  tasks:
    # Only nodes actually being removed — a node left in the cluster via
    # spur_skip_busy_agents must NOT have spurd touched at all, or it would
    # gracefully deregister on SIGTERM despite being "left in the cluster".
    - name: Kill workloads still running on a node being force-removed
      ansible.builtin.include_tasks: tasks/kill_workload_processes.yml
      when: >-
        (spur_force_remove_busy_nodes | default(false) | bool)
        and (rn_actual_remove_list | intersect([ansible_hostname | default(inventory_hostname), inventory_hostname]) | length > 0)

    - name: Stop + disable spurd on nodes being removed
      ansible.builtin.systemd:
        name: spurd
        state: stopped
        enabled: false
      when: rn_actual_remove_list | intersect([ansible_hostname | default(inventory_hostname), inventory_hostname]) | length > 0
      failed_when: false

    # Mesh cleanup (wireguard only). Capture this node's pubkey so the controller can drop it as a
    # peer, then tear down its interface so it doesn't linger as a ghost peer or rejoin on reboot.
    - name: Read removed node's WG pubkey (for controller peer removal)
      ansible.builtin.command: "wg show {{ spur_wg_interface }} public-key"
      register: rn_wg_pubkey
      changed_when: false
      failed_when: false
      when:
        - spur_transport | default('direct') == 'wireguard'
        - rn_actual_remove_list | intersect([ansible_hostname | default(inventory_hostname), inventory_hostname]) | length > 0

    - name: Tear down the mesh interface on the removed node
      ansible.builtin.shell: |
        systemctl disable wg-quick@{{ spur_wg_interface }} 2>/dev/null || true
        wg-quick down {{ spur_wg_interface }} 2>/dev/null || ip link del {{ spur_wg_interface }} 2>/dev/null || true
        rm -f /etc/wireguard/{{ spur_wg_interface }}.conf
      args:
        executable: /bin/bash
      changed_when: true
      when:
        - spur_transport | default('direct') == 'wireguard'
        - rn_actual_remove_list | intersect([ansible_hostname | default(inventory_hostname), inventory_hostname]) | length > 0

# Drop the removed node's WG peer from every SURVIVING member (wireguard only), not just controllers:
# net mesh peered it with every node and wg-quick save persisted that, so it lingers as a ghost peer
# elsewhere otherwise. Survivors only — a node being removed already had its interface torn down above.
- name: Remove each node's WG peer from every surviving mesh member
  hosts: spur_controllers:spur_agents:spur_login
  become: true
  gather_facts: yes
  gather_subset: "{{ spur_gather_subset | default(['!all', 'network', 'hardware', 'distribution']) }}"
  # A down member just isn't refreshed for this removal (reconcile/next deploy fixes it).
  ignore_unreachable: "{{ spur_ignore_unreachable_agents | default(false) | bool }}"
  vars:
    rn_actual_remove_list: "{{ hostvars[groups['spur_controllers'][0]].rn_actual_remove_list | default([]) }}"
  tasks:
    - name: spur net remove-peer on this member
      ansible.builtin.command: >-
        {{ spur_install_dir }}/spur net remove-peer
          --key {{ hostvars[item].rn_wg_pubkey.stdout | trim }}
          --interface {{ spur_wg_interface }}
      loop: "{{ rn_actual_remove_list }}"
      register: rn_remove_peer
      changed_when: rn_remove_peer.rc == 0
      # net remove-peer is idempotent (removing an absent peer exits 0), so the only tolerated
      # failure is the pre-#719 case where the subcommand doesn't exist yet ("unrecognized
      # subcommand" / clap usage error). Any OTHER non-zero rc (bad key, permission, transient
      # RPC) is a real failure and must surface, rather than a blanket failed_when: false.
      failed_when:
        - rn_remove_peer.rc != 0
        - "'unrecognized subcommand' not in (rn_remove_peer.stderr | default(''))"
        - "'unexpected argument' not in (rn_remove_peer.stderr | default(''))"
      when:
        - spur_transport | default('direct') == 'wireguard'
        # Skip members that are themselves being removed (interface already gone).
        - rn_actual_remove_list | intersect([ansible_hostname | default(inventory_hostname), inventory_hostname]) | length == 0
        - hostvars[item].rn_wg_pubkey is defined
        - (hostvars[item].rn_wg_pubkey.stdout | default('') | trim) | length > 0

- name: Remove each node from the cluster + remind about inventory
  hosts: "{{ groups['spur_controllers'][0] }}"
  become: true
  gather_facts: no
  tasks:
    # Belt-and-suspenders: spurd deregisters gracefully on SIGTERM, so a node
    # whose agent we just stopped is usually already gone from the controller.
    # This `remove` is what actually removes a node whose host was unreachable
    # (never got the SIGTERM). Treat "node not found" as success — it means the
    # node is already absent, which is the goal.
    - name: spur node remove --force (authoritative, WAL-durable)
      ansible.builtin.command: >-
        {{ spur_install_dir }}/spur node remove {{ item }}
        --force --reason "ansible decommission"
      loop: "{{ rn_actual_remove_list }}"
      register: rn_remove
      changed_when: "'not found' not in (rn_remove.stderr | default(''))"
      failed_when:
        - rn_remove.rc != 0
        - "'not found' not in (rn_remove.stderr | default(''))"

    - name: Confirm nodes are gone
      ansible.builtin.command: "{{ spur_install_dir }}/spur nodes"
      register: rn_after
      changed_when: false

    - name: Result + inventory reminder
      ansible.builtin.debug:
        msg: >-
          {{
            (["Removed from the running cluster: " ~ (rn_actual_remove_list | join(', '))]
             if (rn_actual_remove_list | length > 0) else [])
            + (["Left in the cluster, un-removed (still busy): " ~ (rn_busy_nodes | difference(rn_actual_remove_list) | join(', '))]
               if (rn_busy_nodes | default([]) | difference(rn_actual_remove_list) | length > 0) else [])
            + rn_after.stdout_lines
          }}

# Unlike add_nodes.yml (which requires the operator to hand-add a [[nodes]]
# entry first), removal writes the master spur.conf itself: the node had to
# stay listed in it until the live removal above succeeded (ansible needed to
# reach it for draining/cleanup), so pruning it now — after, not before — is
# the only ordering that works. Runs on the control node, not a managed host.
- name: Write the removed node(s) out of the master spur.conf
  hosts: "{{ groups['spur_controllers'][0] }}"
  become: false
  gather_facts: no
  vars:
    rn_actual_remove_list: "{{ hostvars[groups['spur_controllers'][0]].rn_actual_remove_list | default([]) }}"
  tasks:
    # delegate_to: localhost, not a play-level `connection: local` — a host's
    # own ansible_connection (e.g. docker, set via spur.conf's [ansible]
    # table) takes precedence over a play-level connection keyword, so
    # `connection: local` alone would silently run this INSIDE the target
    # container instead of on the control node.
    - name: Prune removed node(s) from the master file and write it back
      ansible.builtin.copy:
        content: "{{ lookup('file', inventory_file) | spur_conf_remove_node(rn_actual_remove_list) }}"
        dest: "{{ inventory_file }}"
      delegate_to: localhost
      become: false
      when: rn_actual_remove_list | length > 0

# Surviving controllers' pushed spur.conf must drop the removed node too —
# no restart needed, spurd deregistering (or the RPC removal above) already
# told the running controller; this just keeps the on-disk file in sync for
# a future restart, same no-restart pattern as add_nodes.yml.
- name: Refresh surviving controllers' spur.conf (no restart)
  hosts: spur_controllers
  become: true
  gather_facts: no
  any_errors_fatal: true
  vars:
    rn_actual_remove_list: "{{ hostvars[groups['spur_controllers'][0]].rn_actual_remove_list | default([]) }}"
  roles:
    - role: spur_controller
      vars:
        spur_controller_skip_restart: true
      when: rn_actual_remove_list | length > 0
