---
# Rolling upgrade of an ALREADY-RUNNING Spur cluster — one host at a time (agents
# drained first), so the cluster keeps scheduling and running jobs throughout.
# Reuses the exact same spur_install/spur_controller/spur_agent/spur_verify roles
# deploy.yml uses, just batched with `serial` and gated with drain/undrain, so
# install/config/health-check logic has a single source of truth.
#
# Use deploy.yml instead when: doing a fresh install, changing topology (adding/
# removing hosts, migrating off a pre-merge spurdbd deployment), or when a brief
# full-cluster restart is acceptable.
#
# Run:
#   ansible-playbook playbooks/rolling_upgrade.yml -i inventory/hosts.ini -e spur_binary_src=/tmp/spur-bin-new
#
# Batch agent upgrades (default one at a time):
#   ansible-playbook playbooks/rolling_upgrade.yml -i inventory/hosts.ini -e spur_binary_src=/tmp/spur-bin-new -e spur_rolling_batch_size=2
#
# Skip agents unreachable over SSH (default false = strict, abort the upgrade):
#   ansible-playbook playbooks/rolling_upgrade.yml -i inventory/hosts.ini -e spur_binary_src=/tmp/spur-bin-new -e spur_ignore_unreachable_agents=true
#
# Skip agents that are reachable but still busy — a running job blocked drain
# from completing within spur_drain_wait_secs (default 120s). Default false =
# strict, abort the upgrade rather than silently leave a node on the old
# binary. A skipped busy node is resumed on its current binary, not left
# drained:
#   ansible-playbook playbooks/rolling_upgrade.yml -i inventory/hosts.ini -e spur_binary_src=/tmp/spur-bin-new -e spur_skip_busy_agents=true
#
# Re-render spur.conf from the Ansible template (default: preserve existing config).
# Only needed when inventory vars have changed (e.g. new cluster name, ports, nodes):
#   ansible-playbook playbooks/rolling_upgrade.yml -i inventory/hosts.ini -e spur_binary_src=/tmp/spur-bin-new -e spur_overwrite_conf=true
#
# Force-upgrade ALL nodes even if jobs are still running — running jobs WILL be
# killed (marked NODE_FAIL by the controller the moment spurd restarts). Only
# use when job disruption is acceptable (e.g. a maintenance window where you
# know no production work is running, or when jobs are short/re-runnable).
# Unlike refuse/skip, this doesn't wait out spur_drain_wait_secs — it commits
# to killing the job either way, so it checks busy status once, immediately:
#   ansible-playbook playbooks/rolling_upgrade.yml -i inventory/hosts.ini -e spur_binary_src=/tmp/spur-bin-new -e spur_force_upgrade_busy_agents=true
#
# Upgrade a busy node's spurd WITHOUT killing its running job, trusting that
# job's spurstepd supervisor (a detached, double-forked process outside
# spurd's lifecycle) to carry it across the restart unharmed. Refused if the
# node has no spurstepd yet, or combined with spur_skip_busy_agents /
# spur_force_upgrade_busy_agents. Same as force above, this checks busy status
# once immediately rather than waiting — the outcome doesn't depend on it:
#   ansible-playbook playbooks/rolling_upgrade.yml -i inventory/hosts.ini -e spur_binary_src=/tmp/spur-bin-new -e spur_trust_stepd_busy_agents=true
#
# Unlike teardown.yml/remove_nodes.yml, this playbook never calls
# tasks/reap_stepd_supervisors.yml on a force-killed job's spurstepd — it
# doesn't need to. kill_workload_processes.yml deliberately never touches
# spurstepd (see its header): the supervisor notices the kill almost
# immediately and tears down the job's cgroup as part of handling it, well
# before spur_agent even gets to restarting spurd below. Its on-disk
# completion record is deliberately kept until the controller acknowledges
# the report, though — so whether the supervisor's own report races a spurd
# restart, or the supervisor itself died before reporting at all, spurd's
# startup recovery finds that record and retries, and the controller never
# sees the job stuck RUNNING either way. This playbook has no wipe flag
# (unlike teardown.yml -e wipe=true), so anything else under
# spur_agent_state_dir is left untouched.
#
# Submit a real test job at the end to verify scheduling still works (default
# false — off for routine upgrades, on in CI):
#   ansible-playbook playbooks/rolling_upgrade.yml -i inventory/hosts.ini -e spur_binary_src=/tmp/spur-bin-new -e spur_verify_enabled=true
#
# Upgrade controllers in a specific order instead of inventory order (still one
# at a time — this only changes which one goes first/last, not the batching).
# Must name every controller in [spur_controllers] exactly once:
#   ansible-playbook playbooks/rolling_upgrade.yml -i inventory/hosts.ini -e spur_binary_src=/tmp/spur-bin-new -e spur_controller_upgrade_order=ctl-2,ctl-0,ctl-1
#
# spurstepd rides the same install path as spur/spurctld/spurd here — the
# spur_install role called by the agent play below copies it conditionally
# (present in the source: install; absent: warn), no special-casing needed.

- name: Guard rails — refuse to start against a wipe-flagged or unhealthy cluster
  hosts: spur_controllers[0]
  become: true
  gather_facts: no
  any_errors_fatal: true
  tasks:
    - name: Fail if spur_wipe_state is set (a rolling upgrade must never wipe Raft state)
      ansible.builtin.fail:
        msg: >-
          spur_wipe_state=true is not allowed with rolling_upgrade.yml — it would
          destroy the running cluster's job queue/node registrations mid-upgrade.
          Use deploy.yml for an intentional Raft reinit.
      when: spur_wipe_state | bool

    # spur_wg_address is only ever populated by the spur_wireguard role's own
    # set_fact (deploy.yml invokes it explicitly); this playbook doesn't run that
    # role, so spur_controller/spur_agent's `hostvars[item].spur_wg_address` lookup
    # would hit an undefined variable partway through a host and abort mid-upgrade.
    # Fail fast here instead, before any host is touched.
    - name: Fail if spur_transport is wireguard (not yet supported by rolling_upgrade.yml)
      ansible.builtin.fail:
        msg: >-
          rolling_upgrade.yml does not yet support spur_transport=wireguard (it
          doesn't re-derive spur_wg_address the way deploy.yml does). Use deploy.yml
          for a wireguard cluster — it accepts the same spur_binary_src and is
          non-destructive by default (spur_wipe_state=false), just without
          rolling/drained batching.
      when: spur_transport == 'wireguard'

    - name: Fail if spur_controller_upgrade_order doesn't name every controller exactly once
      ansible.builtin.fail:
        msg: >-
          spur_controller_upgrade_order must name every controller in
          [spur_controllers] exactly once (got: {{ spur_controller_upgrade_order }}).
          Inventory has: {{ groups['spur_controllers'] | sort | join(',') }}.
      vars:
        requested_order: "{{ spur_controller_upgrade_order | split(',') | map('trim') | list }}"
      when:
        - spur_controller_upgrade_order | default('') | length > 0
        - (requested_order | sort) != (groups['spur_controllers'] | sort)

    - name: Check the cluster is healthy before starting
      ansible.builtin.command: "{{ spur_install_dir }}/spur nodes"
      register: spur_pre_upgrade_health
      changed_when: false
      failed_when: spur_pre_upgrade_health.rc != 0

    # Auth carry-forward guard. rolling_upgrade only *upgrades* a cluster already
    # on plugin="spur". First-time enablement (jwt->spur) on HA needs every
    # controller restarted together — a switched leader rejects a request
    # forwarded by an unswitched peer, so a serial rolling switch would break the
    # cluster. Read the live plugin from the first controller's daemon spur.conf.
    - name: Read the live [auth] plugin from spur.conf (auth-switch guard)
      ansible.builtin.shell: |
        awk '/^[ \t]*\[/{a=($0 ~ /^[ \t]*\[auth\][ \t]*$/)} a && /^[ \t]*plugin[ \t]*=/{gsub(/[" \t]/,"");sub(/plugin=/,"");print;exit}' {{ spur_home }}/etc/spur.conf 2>/dev/null || true
      args:
        executable: /bin/bash
      register: ru_live_auth_plugin
      changed_when: false
      failed_when: false

    - name: Refuse a first-time jwt->spur switch through rolling_upgrade on an HA cluster
      ansible.builtin.fail:
        msg: >-
          spur_auth_enabled=true but this cluster is not yet on plugin="spur"
          (live plugin: '{{ (ru_live_auth_plugin.stdout | trim) or "jwt" }}') and has
          {{ groups['spur_controllers'] | length }} controllers. Switching the native
          auth plugin on an HA cluster requires restarting all controllers together,
          which rolling_upgrade.yml cannot do one-at-a-time (serial: 1). Enable auth
          with deploy.yml (-e spur_auth_enabled=true -e spur_overwrite_conf=true)
          during a maintenance window; rolling_upgrade.yml then carries it forward on
          later binary bumps.
      when:
        - spur_auth_enabled | default(false) | bool
        - (ru_live_auth_plugin.stdout | trim) != 'spur'
        - (groups['spur_controllers'] | length) > 1

    - name: Refuse single-controller first-time auth enablement without spur_overwrite_conf
      ansible.builtin.fail:
        msg: >-
          spur_auth_enabled=true on a first-time enable but spur_overwrite_conf is
          not set: the daemon spur.conf [auth] block only renders when you ALSO pass
          -e spur_overwrite_conf=true, otherwise spurctld/spurd stay on the old
          plugin while the CLI switches to native creds (which the old plugin then
          rejects — including root's own CLI calls later in this run). Re-run with
          -e spur_overwrite_conf=true, or use deploy.yml for first-time enablement.
      when:
        - spur_auth_enabled | default(false) | bool
        - (ru_live_auth_plugin.stdout | trim) != 'spur'
        - (groups['spur_controllers'] | length) == 1
        - not (spur_overwrite_conf | default(false) | bool)

    # cgroup enforcement change on upgrade. If the live spur.conf has no [cgroup]
    # section and we're not re-rendering it, the upgraded spurd starts enforcing
    # cgroup-v2 DEFAULTS — memory caps on --mem-per-cpu jobs, and a default-deny
    # device filter that can block /dev/infiniband/* (MPI/NCCL/RCCL, incl. NON-GPU
    # jobs) and needs extra_device_paths on GRES GPU nodes. [cgroup] is read only
    # at spurd startup, so a tuned block must be in place BEFORE spurd restarts.
    - name: Does the live spur.conf already have a [cgroup] section?
      ansible.builtin.shell: |
        grep -q '^\[cgroup\]' {{ spur_home }}/etc/spur.conf 2>/dev/null && echo present || echo absent
      args:
        executable: /bin/bash
      register: ru_live_cgroup
      changed_when: false
      failed_when: false

    - name: Warn that this upgrade will start enforcing cgroups with defaults
      ansible.builtin.debug:
        msg: >-
          Heads up: spur.conf here has no [cgroup] section and you are not
          re-rendering it (spur_overwrite_conf=false), so the upgraded spurd will
          enforce cgroup-v2 DEFAULTS — memory.max on --mem-per-cpu jobs (OOM on
          overrun) and a default-deny device filter that can block host nodes like
          /dev/infiniband/* (MPI/NCCL/RCCL, incl. NON-GPU jobs) and, on GRES GPU
          nodes, /dev/nvidiactl etc. To place a tuned block first (it's read only at
          spurd startup), re-run with -e spur_overwrite_conf=true and set
          spur_cgroup_* (e.g. spur_cgroup_extra_device_paths). See ansible/README.md.
      when:
        - (ru_live_cgroup.stdout | default('absent') | trim) == 'absent'
        - not (spur_overwrite_conf | default(false) | bool)

    - name: Fail if more than one busy-node handling flag is set (ambiguous intent)
      ansible.builtin.fail:
        msg: >-
          spur_skip_busy_agents, spur_force_upgrade_busy_agents, and
          spur_trust_stepd_busy_agents are mutually exclusive — pick one
          busy-node strategy per run.
      when: >-
        [spur_skip_busy_agents | default(false) | bool,
         spur_force_upgrade_busy_agents | default(false) | bool,
         spur_trust_stepd_busy_agents | default(false) | bool] | select | list | length > 1

# spur_controller re-renders spur.conf on every controller it touches, which
# needs ansible_hostname for every agent (the [[nodes]] block) — gather facts
# for the whole cluster up front rather than only as each play's hosts are
# reached, the same as deploy.yml's first play does.
- name: Gather facts across the whole cluster
  hosts: spur_controllers:spur_agents
  become: true
  gather_facts: yes
  gather_subset: "{{ spur_gather_subset | default(['!all', 'network', 'hardware', 'distribution']) }}"
  # ignore_unreachable: a temporarily down agent must not abort the whole upgrade.
  # The spur_controller role's setup task will re-attempt fact-gathering for any
  # agent still missing facts when spur.conf is re-rendered.
  ignore_unreachable: true
  tasks: []

- name: Rolling upgrade — controllers, one at a time (preserves Raft quorum)
  # Custom order (validated above) if given, else natural inventory order.
  hosts: >-
    {{ (spur_controller_upgrade_order | default('') | split(',') | map('trim') | select | list)
       or groups['spur_controllers'] }}
  become: true
  gather_facts: yes
  gather_subset: "{{ spur_gather_subset | default(['!all', 'network', 'hardware', 'distribution']) }}"
  serial: 1
  max_fail_percentage: 0
  roles:
    - role: spur_install
      vars:
        spur_force_reinstall: true
    # Carry auth forward: reinstall + restart spurauthd (the mint) with the new
    # binary and re-assert keys/CLI conf BEFORE spurctld restarts, so this
    # controller's own root CLI health checks below can still mint. Idempotent;
    # keys already exist so nothing is regenerated. Preserves the daemon [auth]
    # block (spur_controller handles that, preserve-by-default).
    - role: spur_auth
      when: spur_auth_enabled | default(false) | bool
    - role: spur_controller
      vars:
        # rolling_upgrade preserves the existing spur.conf by default — the cluster
        # is live and its config is known-good. Pass -e spur_overwrite_conf=true to
        # re-render it from the Ansible template (e.g. after changing inventory vars).
        spur_controller_skip_conf: "{{ not (spur_overwrite_conf | default(false) | bool) }}"
        # This playbook already gathered facts for the whole cluster (controllers
        # AND agents) with the same ignore_unreachable tolerance in the play just
        # above — spur_controller's own per-agent re-gather only ever re-targets a
        # host that already failed that gather moments ago, a retry vanishingly
        # unlikely to succeed. Worse, this play is serial:1, so with C controllers
        # and N still-unreachable agents that retry runs N times over, C times
        # over. Skip it here; see spur_controller/tasks/main.yml for why that's
        # safe (the spur.conf template's | default(0) fallback already covers a
        # missing agent's facts identically either way).
        spur_controller_gather_missing_agent_facts: false

- name: Rolling upgrade — agents, drained and upgraded in batches
  hosts: spur_agents
  become: true
  gather_facts: yes
  gather_subset: "{{ spur_gather_subset | default(['!all', 'network', 'hardware', 'distribution']) }}"
  serial: "{{ spur_rolling_batch_size | default(1) }}"
  # Skip unreachable agents when spur_ignore_unreachable_agents=true, else strict.
  ignore_unreachable: "{{ spur_ignore_unreachable_agents | default(false) | bool }}"
  max_fail_percentage: "{{ 100 if (spur_ignore_unreachable_agents | default(false) | bool) else 0 }}"
  vars:
    dckj_action: upgrade
    dckj_skip_busy: "{{ spur_skip_busy_agents | default(false) | bool }}"
    dckj_force_busy: "{{ spur_force_upgrade_busy_agents | default(false) | bool }}"
    dckj_force_flag: spur_force_upgrade_busy_agents
    dckj_trust_stepd: "{{ spur_trust_stepd_busy_agents | default(false) | bool }}"
  pre_tasks:
    - name: Drain + guard this node against job loss before touching its binaries
      ansible.builtin.include_tasks: tasks/drain_and_guard_agent.yml

    - name: Does this agent already run a spurstepd build?
      ansible.builtin.stat:
        path: "{{ spur_install_dir }}/spurstepd"
      register: ru_agent_stepd_before

    - name: Does the new build ship spurstepd?
      ansible.builtin.stat:
        path: "{{ spur_binary_src }}/spurstepd"
      delegate_to: localhost
      become: false
      register: ru_src_stepd
      when: spur_binary_src | default('') | length > 0

    # Informational only, nothing here blocks — spurstepd installs unconditionally below.
    - name: Note this agent is getting spurstepd for the first time in this run
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} has no spurstepd yet and this run's source
          has one — the controllers ahead of it in this rolling upgrade are
          already on the new build. Proceeding; if you'd rather avoid any
          window of risk here, drain the cluster and use deploy.yml instead.
      when:
        - not (ru_agent_stepd_before.stat.exists | default(false))
        - ru_src_stepd.stat.exists | default(false)

  roles:
    # Skipped for a busy node (spur_node_busy=true, opted in via
    # spur_skip_busy_agents) — overwriting a running agent's binaries out from
    # under its own job is unsafe regardless of how the drain wait turned out.
    # When spur_force_upgrade_busy_agents=true the operator has explicitly
    # accepted that running jobs will be killed, so we proceed regardless.
    # spur_node_busy_trusted proceeds too, without killing anything — set only
    # when spur_trust_stepd_busy_agents=true and the job is already stepd-supervised.
    # Still attempted for an unreachable node; every task inside will itself
    # fail (ignored, not counted, via the play's ignore_unreachable) since
    # there's no connection to reach it.
    - role: spur_install
      vars:
        spur_force_reinstall: true
      when: >-
        not (spur_node_busy | default(false)) or
        (spur_force_upgrade_busy_agents | default(false) | bool) or
        (spur_node_busy_trusted | default(false))
    # Carry auth forward on the agent: new spurauthd + keys/CLI conf before spurd
    # restarts (spurd Wants=spurauthd and mints its register call). Same busy-node
    # gate as the roles around it, plus spur_auth_enabled.
    - role: spur_auth
      when: >-
        (spur_auth_enabled | default(false) | bool)
        and (not (spur_node_busy | default(false))
             or (spur_force_upgrade_busy_agents | default(false) | bool)
             or (spur_node_busy_trusted | default(false)))
    - role: spur_agent
      when: >-
        not (spur_node_busy | default(false)) or
        (spur_force_upgrade_busy_agents | default(false) | bool) or
        (spur_node_busy_trusted | default(false))

  post_tasks:
    - name: Re-register + undrain the node now that it's back
      ansible.builtin.include_tasks: tasks/resume_and_undrain_agent.yml

- name: Verify the upgraded cluster still schedules work
  # Opt-in (see spur_verify_enabled) — submits a real job, so it's off by
  # default for routine upgrades and enabled explicitly in CI.
  hosts: "spur_controllers[0]{{ '' if (spur_verify_enabled | default(false) | bool) else ':!all' }}"
  become: true
  gather_facts: no
  roles:
    - role: spur_verify
