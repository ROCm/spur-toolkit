---
# Read-only health check for a running Spur cluster. Safe to run anytime — it
# only inspects state, never changes it. Probes return all findings in one
# remote call per host; each play asserts its own hosts at the end (ansible-playbook exits non-zero if any assert fails, so the overall
# run still fails when anything is unhealthy — no separate summary pass needed).
#
# Run:
#   ansible-playbook playbooks/healthcheck.yml -i inventory/hosts.ini
#
# Skip agents unreachable over SSH (default false = strict, abort the check):
#   ansible-playbook playbooks/healthcheck.yml -i inventory/hosts.ini -e spur_ignore_unreachable_agents=true

- name: Controller health
  hosts: spur_controllers
  become: true
  gather_facts: no
  tasks:
    - name: Collect controller health in one remote call
      spur_health:
        role: controller
        port: "{{ spur_controller_port }}"
        install_dir: "{{ spur_install_dir }}"
        home: "{{ spur_home }}"
        auth: "{{ spur_auth_enabled | default(false) | bool }}"
        cluster: "{{ spur_cluster_name }}"
        key_dir: "{{ spur_auth_key_dir }}"
        accounting: "{{ spur_accounting_enabled | default(true) | bool }}"
      register: hc_result

    - name: Report controller health
      ansible.builtin.assert:
        that: hc_result.problems | length == 0
        success_msg: "{{ inventory_hostname }}: OK"
        fail_msg: "{{ inventory_hostname }}: {{ hc_result.problems | join('; ') }}"

- name: Agent health
  hosts: spur_agents
  become: true
  gather_facts: no
  ignore_unreachable: "{{ spur_ignore_unreachable_agents | default(false) | bool }}"
  tasks:
    - name: Collect agent health in one remote call
      spur_health:
        role: agent
        install_dir: "{{ spur_install_dir }}"
        home: "{{ spur_home }}"
        port: "{{ spur_agent_port }}"
        auth: "{{ spur_auth_enabled | default(false) | bool }}"
        cluster: "{{ spur_cluster_name }}"
        key_dir: "{{ spur_auth_key_dir }}"
        cgroup: "{{ (spur_cgroup_manage | default(true) | bool) and (spur_cgroup_enabled | default(true) | bool) }}"
        require_stepd: "{{ spur_require_stepd | default(false) | bool }}"
      register: hc_result

    - name: Report agent health
      ansible.builtin.assert:
        that: hc_result.problems | length == 0
        success_msg: "{{ inventory_hostname }}: OK"
        fail_msg: "{{ inventory_hostname }}: {{ hc_result.problems | join('; ') }}"
      when: not (hc_result.unreachable | default(false))

    - name: Note unreachable agent was skipped
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: SKIPPED (unreachable, spur_ignore_unreachable_agents=true)"
      when: hc_result.unreachable | default(false)

- name: Accounting host (PostgreSQL) health
  hosts: >-
    {%- set acct = spur_accounting_host | default(groups['spur_accounting_node'][0]
        if (groups['spur_accounting_node'] | default([]) | length > 0)
        else groups['spur_controllers'][0]) -%}
    {{ acct if (hostvars[acct].spur_accounting_enabled | default(true) | bool) else 'all:!all' }}
  become: true
  gather_facts: no
  tasks:
    - name: Collect PostgreSQL health
      spur_health:
        role: accounting
        install_dir: "{{ spur_install_dir }}"
        home: "{{ spur_home }}"
      register: hc_result

    - name: Report accounting health
      ansible.builtin.assert:
        that: hc_result.problems | length == 0
        success_msg: "{{ inventory_hostname }}: OK"
        fail_msg: "{{ inventory_hostname }}: {{ hc_result.problems | join('; ') }}"
