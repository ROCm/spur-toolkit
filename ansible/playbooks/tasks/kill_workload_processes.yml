---
# Canonical implementation of "kill everything a spur job left running on this
# host" — shared by every playbook that can force through a busy node
# (drain_and_guard_agent.yml, and remove_nodes.yml's force-remove path).
# Include-time `when:` controls whether this actually runs; the script itself
# is a no-op if the spur cgroup is already empty (job finished on its own).
#
# Four layers, in order:
#
# 1. Container runtimes — a container nested INSIDE the job's own cgroup tree
#    (rootless Podman/nerdctl/Docker in cgroupfs mode, which nest the
#    container's cgroup under whatever cgroup invoked them) is invisible to a
#    plain cgroup.procs kill of its own PID alone: stopping it via the
#    runtime's own CLI first cleanly tears down the network namespace, volume
#    mounts, and GPU device contexts before the kernel sees SIGKILL. Covers
#    Docker/containerd/Podman naming conventions plus a best-effort runc/crun
#    attempt. This does NOT cover a container a system daemon (e.g. system
#    dockerd) placed entirely outside /sys/fs/cgroup/spur — this sweep is
#    rooted there and never sees those PIDs; spur's own native
#    --container-image jobs aren't affected either way, since that container
#    is always a direct child of the job cgroup and layer 2 reaches it fine.
#
# 2. SIGTERM to surviving bare PIDs — catches any non-containerised processes
#    still in spur cgroups (MPI ranks, Python scripts, bare GPU processes, etc.)
#    and gives them 5s to flush/checkpoint.
#
# 3. SIGKILL to anything still alive after the grace period.
#
# 4. Best-effort cgroup directory cleanup — once every PID above is gone,
#    rmdir the now-empty job/step leaf cgroups bottom-up so they don't sit
#    around forever (found some 3+ days old in the wild). Never touches a
#    directory whose cgroup.procs still has a PID in it.
#
# The sweep is rooted at /sys/fs/cgroup/spur, so it still reaches a job's
# processes now that each step gets its own leaf cgroup under the job's.
#
# It deliberately does NOT touch the job's supervisor (spurstepd), which sits
# outside the job cgroup. A supervisor whose workload just died observes the
# exit and reports it, so the controller sees a finished job rather than a
# stranded one — killing the supervisor first throws that away. Where the host
# itself is going away and the supervisors have to go too,
# tasks/reap_stepd_supervisors.yml does that explicitly, afterwards.
#
# Known limitation this doesn't fully close: a plain, un-salloc'd `srun` step
# supervises its allocation with an "extern" step that doesn't reliably notice
# its own workload died here, so the controller can be left showing the job
# RUNNING with the node's resources still allocated even though the cgroup
# above is empty. The explicit "Force-cancel jobs this kill just emptied" task
# below (run against the controller, not this agent) is what actually clears
# that — see its own comment for why an agent-side kill alone isn't enough.
- name: Kill job processes and containers in spur cgroups
  ansible.builtin.shell: |
    set -uo pipefail

    # A shared cgroup mount reports 0 for PIDs outside this PID namespace.
    # Never signal 0 (our process group), PID 1, or negative process-group IDs.
    spur_pids() {
      find /sys/fs/cgroup/spur -name cgroup.procs 2>/dev/null \
        | xargs cat 2>/dev/null | awk '$1 ~ /^[0-9]+$/ && $1 > 1' | sort -u
    }

    # Job IDs (job_<id>_<n> leaf dirs) that owned at least one PID at the
    # start of this sweep — reported back so the caller can reconcile these
    # jobs against the controller even if their supervisor never does.
    affected_job_ids() {
      # The top-level job directory has no PIDs of its own on this layout —
      # live PIDs sit one level down, in a step_N/step_extern leaf — so this
      # has to check recursively under each job dir, same as spur_pids().
      find /sys/fs/cgroup/spur -mindepth 1 -maxdepth 1 -type d -name 'job_*' 2>/dev/null \
        | while read -r d; do
            p=$(find "$d" -name cgroup.procs 2>/dev/null | xargs cat 2>/dev/null | awk '$1 ~ /^[0-9]+$/ && $1 > 1' | sort -u)
            [ -n "$p" ] && basename "$d" | sed -E 's/^job_([0-9]+)_.*/\1/'
          done \
        | sort -un
    }

    pids=$(spur_pids)
    [ -z "$pids" ] && { echo "no spur job processes found, nothing to kill"; exit 0; }
    echo "spur job PIDs before kill: $pids"
    echo "AFFECTED_JOB_IDS: $(affected_job_ids | tr '\n' ' ')"

    container_ids=""
    for pid in $pids; do
      [ -f /proc/$pid/cgroup ] || continue
      ids=$(grep -oE '(docker|cri-containerd|libpod)-([a-f0-9]{64})\.scope' \
              /proc/$pid/cgroup 2>/dev/null \
            | grep -oE '[a-f0-9]{64}' || true)
      container_ids="${container_ids} ${ids}"
    done
    container_ids=$(echo "$container_ids" | tr ' ' '\n' | sort -u | grep -v '^$' || true)

    if [ -n "$container_ids" ]; then
      echo "found containers to kill: $container_ids"
      for cid in $container_ids; do
        short="${cid:0:12}"
        if command -v docker &>/dev/null; then
          docker kill "$short" 2>/dev/null && echo "docker kill $short: ok" || true
        fi
        if command -v nerdctl &>/dev/null; then
          nerdctl kill "$short" 2>/dev/null && echo "nerdctl kill $short: ok" || true
        fi
        if command -v podman &>/dev/null; then
          podman kill "$short" 2>/dev/null && echo "podman kill $short: ok" || true
        fi
        if command -v crictl &>/dev/null; then
          crictl stop "$short" 2>/dev/null && echo "crictl stop $short: ok" || true
        fi
        # Best-effort: a raw runc/crun container whose ID happens to match
        # (cgroupfs driver, default --root). Silently no-ops otherwise.
        if command -v runc &>/dev/null; then
          runc kill "$short" KILL 2>/dev/null && echo "runc kill $short: ok" || true
        fi
        if command -v crun &>/dev/null; then
          crun kill "$short" KILL 2>/dev/null && echo "crun kill $short: ok" || true
        fi
      done
      sleep 2
    fi

    pids=$(spur_pids)
    if [ -n "$pids" ]; then
      echo "sending SIGTERM to bare PIDs: $pids"
      echo "$pids" | xargs kill -TERM 2>/dev/null || true
      sleep 5
    fi

    pids=$(spur_pids)
    if [ -n "$pids" ]; then
      echo "sending SIGKILL to surviving PIDs: $pids"
      echo "$pids" | xargs kill -KILL 2>/dev/null || true
    fi

    # Cleanup: rmdir now-empty leaf cgroups, deepest first. Never removes a
    # directory whose cgroup.procs still has a PID (rmdir fails harmlessly on
    # a non-empty cgroup anyway, but the procs check avoids the noisy attempt).
    find /sys/fs/cgroup/spur -mindepth 1 -type d 2>/dev/null \
      | awk '{ print gsub(/\//,"/"), $0 }' | sort -rn | cut -d' ' -f2- \
      | while read -r d; do
          [ -s "$d/cgroup.procs" ] && continue
          rmdir "$d" 2>/dev/null && echo "removed empty cgroup: $d" || true
        done

    echo "kill sequence complete"
  args:
    executable: /bin/bash
  # Transport-level flake seen in CI: the exec session itself can be torn down
  # (empty stdout/stderr, rc=143) before the script produces any output. Retry
  # rather than fail the whole run over what looks like a connection hiccup.
  register: dckj_kill_result
  retries: 2
  delay: 3
  until: dckj_kill_result is success

- name: Reconcile only jobs affected by this cleanup
  ansible.builtin.include_tasks: reconcile_killed_jobs.yml
  when: (dckj_kill_result.stdout | default('')) is search('(?m)^AFFECTED_JOB_IDS:[ \t]*[0-9]')
