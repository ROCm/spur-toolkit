# Included from pre_tasks (never from inside the spur_agent role) — a
# role-level `when:` (e.g. skipping a busy node) applies to every task the
# role contains, including a run_once one, and can skip THIS computation
# fleet-wide if it lands on the one host run_once would have picked. pre_tasks
# run unconditionally for every host in the play, before that role-level skip
# is ever evaluated, so this always executes regardless of which agents are
# busy/unreachable this run.
- name: Compute exclude_sections and the shared push content for non-controller agents once
  run_once: true
  delegate_to: "{{ groups['spur_controllers'][0] }}"
  delegate_facts: true
  vars:
    master_conf_text: "{{ lookup('file', inventory_file) }}"
    node_fact_fallbacks: "{{ groups['spur_agents'] | spur_conf_node_facts(hostvars) }}"
  ansible.builtin.set_fact:
    agent_exclude_sections: "{{ master_conf_text | spur_conf_exclude_sections }}"
    agent_shared_conf: "{{ master_conf_text | spur_conf_for_push(node_fact_fallbacks, None, ['accounting']) }}"
