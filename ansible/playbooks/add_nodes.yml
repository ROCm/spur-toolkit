---
# Add compute agent(s) to a RUNNING Spur cluster with minimal disruption.
#
# Unlike a full deploy.yml run (which restarts every spurctld and every spurd),
# this only starts spurd on the NEW nodes — existing daemons and running jobs are
# left untouched. It works because a spurd registers itself at runtime: a new
# agent appears in `spur nodes` the moment its spurd registers, with no controller
# restart or config re-render needed. spur.conf on the controllers is left alone
# by default (same as deploy.yml/rolling_upgrade.yml) — pass
# -e spur_overwrite_conf=true to also refresh it with the new node, still
# without bouncing the running controller.
#
# The node(s) MUST already be in the [spur_agents] inventory group (single source
# of truth, same as deploy.yml). This playbook just brings the named new ones
# online now, disruption-free. To ADD A CONTROLLER, use deploy.yml — that's a Raft
# membership change and needs the guarded wipe/restart path.
#
# Run:
#   ansible-playbook playbooks/add_nodes.yml -i inventory/hosts.ini -e new_nodes=gpu-3,gpu-4
#
# Also refresh spur.conf on the controllers with the new node (still no restart):
#   ansible-playbook playbooks/add_nodes.yml -i inventory/hosts.ini -e new_nodes=gpu-3,gpu-4 -e spur_overwrite_conf=true

# --- Guard rails (on the first controller) ---
- name: Validate request
  hosts: "{{ groups['spur_controllers'][0] }}"
  become: true
  gather_facts: no
  any_errors_fatal: true
  vars:
    add_list: "{{ new_nodes | default('') | split(',') | map('trim') | select | list }}"
  tasks:
    - name: Require new_nodes
      ansible.builtin.assert:
        that:
          - add_list | length > 0
        fail_msg: "Pass the node(s) to add, e.g. -e new_nodes=gpu-3,gpu-4"
        quiet: true

    - name: Every new node must be in the [spur_agents] inventory group
      ansible.builtin.assert:
        that:
          - item in groups['spur_agents']
        fail_msg: >-
          '{{ item }}' is not in [spur_agents]. Add it to the inventory first —
          that group is the source of truth for cluster membership.
        quiet: true
      loop: "{{ add_list }}"

    - name: Refuse controllers (adding a controller is a deploy.yml / Raft operation)
      ansible.builtin.assert:
        that:
          - item not in groups['spur_controllers']
        fail_msg: >-
          '{{ item }}' is a controller. add_nodes.yml only adds compute agents;
          use deploy.yml to add/change controllers (Raft membership change).
        quiet: true
      loop: "{{ add_list }}"

    - name: Cluster must be healthy before adding
      ansible.builtin.command: "{{ spur_install_dir }}/spur nodes"
      register: an_health
      changed_when: false
      failed_when: an_health.rc != 0

# --- Gather facts on ALL cluster hosts (read-only, non-disruptive) ---
# The spur.conf [[nodes]] loop reads ansible_processor_vcpus / memtotal / hostname
# for EVERY agent, so facts for all of them must be present when we template the
# config below — this is exactly what `--limit` breaks. Gathering facts touches no
# daemon.
# Include spur_login: the mesh-join play runs the spur_wireguard role on login
# nodes too, which reads ansible_os_family/ansible_hostname — so gather their facts.
- name: Gather facts across the cluster
  hosts: spur_controllers:spur_agents:spur_login
  become: true
  gather_facts: yes
  gather_subset: "{{ spur_gather_subset | default(['!all', 'network', 'hardware', 'distribution']) }}"
  ignore_unreachable: "{{ spur_ignore_unreachable_agents | default(false) | bool }}"
  tasks: []

# Join the new node to the mesh BEFORE spurd starts (spurd reaches the controller over the mesh).
# ALL existing mesh members (controllers + agents + login) AND the new node run the role together:
# the new node net-joins the bootstrap, and every existing member both registers the new node as a
# peer and re-publishes its own pubkey so it appears in the full-mesh membership doc. Running only
# controllers + new node would (a) leave a re-added node whose key changed with a stale key on the
# non-bootstrap members, and (b) exclude pre-existing WORKERS from the membership doc, so the new
# node would peer the controllers but not the other workers (full mesh only on a fresh deploy.yml).
# Existing members whose conf already exists just restore it (A1 guard) — no re-key. The new node
# MUST have spur_wg_address in inventory. Single-controller clusters collapse to controller + node.
- name: Join new node(s) to the WireGuard mesh
  hosts: >-
    {{ 'spur_controllers:spur_agents:spur_login' ~ (''
       if (hostvars[groups['spur_controllers'][0]].spur_transport | default('direct') == 'wireguard')
       else ':!all') }}
  become: true
  gather_facts: no
  # Not any_errors_fatal: an unrelated unreachable existing member shouldn't abort
  # the add. Default (false) stays strict; the new node itself always fails loudly.
  ignore_unreachable: "{{ spur_ignore_unreachable_agents | default(false) | bool }}"
  roles:
    # ansible_os_family is defined skips a member that failed fact-gathering
    # (unreachable under ignore_unreachable) — the role reads facts and would
    # otherwise throw undefined-var. Reachable members + the new node all have it.
    - role: spur_wireguard
      when:
        - spur_transport | default('direct') == 'wireguard'
        - ansible_os_family is defined

# --- Install + start spurd on the NEW nodes only ---
# Skip any that are already registered (idempotent re-runs must not restart a
# healthy new agent). spur_install + spur_agent only ever touch the node they run
# on, so existing agents are never affected.
- name: Bring new agents online
  hosts: "{{ new_nodes | default('') | split(',') | map('trim') | select | join(':') }}"
  become: true
  gather_facts: no
  any_errors_fatal: true
  pre_tasks:
    - name: Resolve this node's registered name
      # set_fact (not a self-referential play var) so spur_node_name honors an
      # inventory override but otherwise falls back to the gathered short hostname.
      ansible.builtin.set_fact:
        spur_node_name: "{{ spur_node_name | default(ansible_hostname) }}"

    - name: Query existing registrations once for all new nodes
      spur_node_snapshot:
        binary: "{{ hostvars[groups['spur_controllers'][0]].spur_install_dir }}/spur"
      delegate_to: "{{ groups['spur_controllers'][0] }}"
      delegate_facts: true
      run_once: true  # noqa run-once[task]

    - name: Is this node already registered with the controller?
      ansible.builtin.set_fact:
        an_registered: "{{ spur_node_name in hostvars[groups['spur_controllers'][0]].spur_node_snapshot.nodes }}"

    - name: Note already-registered nodes (will be skipped)
      ansible.builtin.debug:
        msg: "{{ spur_node_name }} is already registered — skipping install/start (idempotent)."
      when: an_registered
  tasks:
    - name: Install unregistered agents
      ansible.builtin.include_role:
        name: spur_install
      when: not an_registered
    # A new agent joining an auth-enabled cluster needs its keys + spurauthd
    # before spurd starts (spurd mints its register call). Keys come from the
    # control-node spur_auth_keys_dir (already the source of truth), so nothing
    # is regenerated. Gated on spur_auth_enabled and the same not-already-
    # registered guard as the roles around it.
    - name: Provision authentication on unregistered agents
      ansible.builtin.include_role:
        name: spur_auth
      when:
        - spur_auth_enabled | default(false) | bool
        - not an_registered
    - name: Start unregistered agents
      ansible.builtin.include_role:
        name: spur_agent
      when: not an_registered

# --- Refresh spur.conf on the controllers WITHOUT restarting them ---
# Same preserve-by-default behavior as deploy.yml/rolling_upgrade.yml: an
# existing spur.conf is left alone unless -e spur_overwrite_conf=true is
# passed to THIS run (deploy.yml/rolling_upgrade.yml need the same flag on
# their own runs too — none of them refresh it for free). The new node is
# already live-registered regardless, since spurd self-registers at runtime
# independent of the config file.
- name: Refresh controller config (no restart)
  hosts: spur_controllers
  become: true
  gather_facts: no
  any_errors_fatal: true
  roles:
    - role: spur_controller
      vars:
        spur_controller_skip_restart: true

# --- Verify the new nodes registered ---
- name: Verify new nodes are registered
  hosts: "{{ groups['spur_controllers'][0] }}"
  become: true
  gather_facts: no
  vars:
    add_list: "{{ new_nodes | default('') | split(',') | map('trim') | select | list }}"
  tasks:
    - name: Wait for all new nodes to appear using one fleet query per attempt
      spur_node_snapshot:
        binary: "{{ spur_install_dir }}/spur"
        expected: "{{ add_list | map('extract', hostvars, 'spur_node_name') | list }}"
        timeout: 30
      register: an_wait
      failed_when: an_wait.pending is not defined or an_wait.pending | length > 0

    - name: Show cluster nodes
      ansible.builtin.command: "{{ spur_install_dir }}/spur nodes"
      register: an_final
      changed_when: false

    - name: Result
      ansible.builtin.debug:
        msg:
          - "Added (no existing daemon restarted): {{ add_list | join(', ') }}"
          - "{{ an_final.stdout_lines }}"
