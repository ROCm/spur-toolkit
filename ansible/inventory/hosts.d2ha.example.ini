; ============================================================================
; HA Spur cluster over a WireGuard mesh — 3 controllers + N agents, no k0s.
;
; This is the multi-controller counterpart to hosts.ha.example.ini: the same
; 3-controller Raft quorum, but with spur_transport=wireguard so the whole
; control plane (and Raft) rides an encrypted mesh instead of the LAN.
;
; The spur_wireguard role bootstraps the mesh on the FIRST controller (net init,
; auto .1), joins every other node, and then runs a full-mesh pass (spur net
; mesh) so the controllers peer each other directly — required for Raft
; elections when the bootstrap controller is down. (Under [cluster].enabled the
; controller reconcile loop would do this; a pure-spurd cluster relies on the
; role's full-mesh pass.)
;
; Mesh addressing: the bootstrap controller gets .1; every other node is
; numbered .2, .3, ... by position, OR pin each node explicitly with
; spur_wg_address (recommended for a fixed, readable layout as below).
;
; node_id for Raft = position in [spur_controllers] (1-based). Keep the order
; stable across redeploys.
;
;   Deploy:  ansible-playbook playbooks/deploy.yml       -i inventory/hosts.d2ha.ini -e @inventory/d2ha.vars.yml
;   Remove:  ansible-playbook playbooks/remove_nodes.yml -i inventory/hosts.d2ha.ini -e @inventory/d2ha.vars.yml -e nodes_to_remove=worker-1
;   Re-add:  ansible-playbook playbooks/add_nodes.yml    -i inventory/hosts.d2ha.ini -e @inventory/d2ha.vars.yml -e new_nodes=worker-1
;
; Copy this to hosts.d2ha.ini and fill in real hosts/credentials — the real
; inventory is gitignored (inventory/*.ini), only *.example.ini is tracked.
; Pair it with a run-vars file (see d2ha.vars.yml) passed via -e @... because
; group_vars/all.yml outranks inventory [all:vars] and would revert
; spur_transport to direct.
; ============================================================================

[spur_controllers]
ctl-0 ansible_host=10.0.0.10 ansible_user=root spur_wg_address=10.44.0.1
ctl-1 ansible_host=10.0.0.11 ansible_user=root spur_wg_address=10.44.0.3
ctl-2 ansible_host=10.0.0.12 ansible_user=root spur_wg_address=10.44.0.4

[spur_agents]
; Every controller also runs spurd so it registers as a node and stays in the
; mesh membership (a mesh member that never registers is pruned from every
; peer — see docs/findings/controller-not-in-mesh-membership.md in ROCm/spur).
ctl-0    ansible_host=10.0.0.10 ansible_user=root spur_wg_address=10.44.0.1
ctl-1    ansible_host=10.0.0.11 ansible_user=root spur_wg_address=10.44.0.3
ctl-2    ansible_host=10.0.0.12 ansible_user=root spur_wg_address=10.44.0.4
; Dedicated worker(s):
worker-1 ansible_host=10.0.0.21 ansible_user=root spur_wg_address=10.44.0.2

[all:vars]
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
