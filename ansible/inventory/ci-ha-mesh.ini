; ============================================================================
; CI inventory — 3-controller HA Spur cluster over a WireGuard mesh (no k0s,
; no accounting). Exercises the multi-controller mesh path; the lean
; single-controller ci.ini covers the direct-transport path.
;
;   ctl-0/1/2         : Raft controllers, each ALSO an agent (so it registers as
;                       a node and stays in the mesh membership — a mesh member
;                       that never registers is pruned from every peer). ctl-0 is
;                       the bootstrap (net init -> .1); the others net-join.
;   worker-0/worker-1 : two dedicated compute agents (net join the mesh). Two,
;                       not one, so the remove_nodes test can remove worker-1 and
;                       assert its WG peer is dropped from the OTHER worker
;                       (worker-0), not just the controllers — the ghost-peer-on-
;                       agents case.
;   login-0           : a login-only node (in spur_login, not a controller/agent).
;                       Exercises the add_nodes mesh-join fact-gathering on login
;                       nodes and the login-node mesh-join path in general.
;
; Nodes are Docker containers on a shared user-defined network, reached with the
; community.docker `docker` connection (no in-container SSHD), exactly like
; ci.ini. --privileged + the wireguard kernel module (loadable on ubuntu-latest
; runners) let a real encrypted mesh form inside the containers.
;
; spur_wg_address is pinned per host, exactly as the production HA example
; (hosts.d2ha.example.ini) does: bootstrap ctl-0=.1, then .2/.3 controllers,
; .4/.5 workers, .6 login. The role's positional auto-assignment (no pins) is
; NOT stable across redeploys — group_agents ordering can differ run to run, so
; a plain agent could be handed a different .N on a second deploy while its
; baked spurd config still points at the first, breaking registration. Pinning
; is the documented layout for a real cluster and keeps CI deterministic.
;
; IMPORTANT: ansible_host is intentionally NOT set (same rationale as ci.ini) —
; the docker connection targets each container by name (= inventory_hostname),
; while the WG peer --endpoint falls back to ansible_default_ipv4.address, the
; real Docker-network IP the other containers can reach.
; ============================================================================

[spur_controllers]
ctl-0 spur_wg_address=10.44.0.1
ctl-1 spur_wg_address=10.44.0.2
ctl-2 spur_wg_address=10.44.0.3

[spur_agents]
ctl-0 spur_wg_address=10.44.0.1
ctl-1 spur_wg_address=10.44.0.2
ctl-2 spur_wg_address=10.44.0.3
worker-0 spur_wg_address=10.44.0.4
worker-1 spur_wg_address=10.44.0.5

[spur_accounting_node]

[spur_login]
login-0 spur_wg_address=10.44.0.6

[all:vars]
ansible_connection=docker
ansible_user=root
# NOTE: spur_transport / spur_accounting_enabled / spur_k8s_enabled are NOT set
# here on purpose. group_vars/all.yml outranks inventory [all:vars], so setting
# spur_transport=wireguard here would be silently reverted to `direct` (the
# WireGuard play would then match no hosts and the mesh would never form). Those
# vars are passed as extra-vars via `-e @inventory/ci-ha-mesh.vars.yml` in the
# workflow, which is the highest precedence. The wg CIDR/port/interface/persist
# already match group_vars defaults, so they need no override.
