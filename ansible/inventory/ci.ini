; ============================================================================
; CI inventory — lean cluster of systemd-enabled Docker containers, sized for
; fast rolling-upgrade resilience testing rather than full HA/accounting/login
; coverage (see deploy.yml's own separate CI path for that).
;   ctl-0        : single controller
;   gpu-1/2/3    : compute agents — gpu-1 normal, gpu-2 simulated unreachable,
;                  gpu-3 simulated busy (a job kept running through the upgrade)
;
; Nodes are Docker containers on a shared user-defined network; Ansible reaches
; them with the community.docker `docker` connection (no in-container SSHD).
;
; IMPORTANT: ansible_host is intentionally NOT set. The docker connection then
; uses the inventory_hostname (= the container name) to target each container,
; while every address-resolution path in the roles (pg_hba, Raft peers,
; SPUR_CONTROLLER_ADDR) falls back to ansible_default_ipv4.address — the real
; Docker network IP. Setting ansible_host to the container NAME would instead put
; a hostname into pg_hba.conf, which requires an IP/CIDR and would break Postgres.
; ============================================================================
[spur_controllers]
ctl-0

[spur_agents]
gpu-1
gpu-2
gpu-3

; Left empty on purpose: deploy.yml/rolling_upgrade.yml both fall back cleanly
; (accounting host defaults to the first controller; the login play matches
; zero hosts and no-ops) — not exercised in this lean CI pass.
[spur_accounting_node]

[spur_login]

[all:vars]
ansible_connection=docker
ansible_user=root
spur_transport=direct
