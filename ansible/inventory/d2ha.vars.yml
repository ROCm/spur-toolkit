---
# Run-vars for a pure-spurd HA cluster over a WireGuard mesh (hosts.d2ha.ini).
# Pass with -e @inventory/d2ha.vars.yml so these win over group_vars/all.yml
# (inventory [all:vars] is shadowed by group_vars and would revert
# spur_transport to direct — a silent no-mesh trap).
spur_transport: wireguard
spur_wg_cidr: 10.44.0.0/16
spur_wg_port: 51820
spur_wg_persist: true

# Optional: point at a local dir of pre-built spur/spurctld/spurd binaries.
# Leave unset to have install.sh download a release. Do NOT commit a
# machine-specific path here.
# spur_binary_src: /path/to/spur/target/release

# Pure spurd HA — no k0s, no Postgres.
spur_k8s_enabled: false
spur_accounting_enabled: false
