; ============================================================================
; CI inventory — 3 controllers + 1 worker over the direct transport, for
; rolling_upgrade.yml's spur_in_place_upgrade path.
;   ctl-0/1/2 : Raft quorum, upgraded one at a time, leader LAST
;   worker-0  : the only compute agent — holds the running jobs that must
;               survive the swap, and must never be drained during it
;
; Separate from ci.ini (1 controller) because leader-last ordering cannot be
; observed with a single controller, and separate from ci-ha-mesh.ini (3
; controllers) because that one runs spur_transport=wireguard, which
; rolling_upgrade.yml refuses outright.
;
; One worker, not three: the assertions here are about the agent NOT being
; drained and its jobs surviving, which one node demonstrates completely.
; Multi-node job coverage belongs with the agent-fanout jobs, not here.
;
; As in ci.ini, ansible_host is intentionally NOT set — the docker connection
; targets each container by inventory_hostname, while address resolution in the
; roles falls back to ansible_default_ipv4.address.
; ============================================================================
[spur_controllers]
ctl-0
ctl-1
ctl-2

[spur_agents]
worker-0

; Left empty on purpose, same as ci.ini: the accounting host defaults to the
; first controller and the login play matches zero hosts.
[spur_accounting_node]

[spur_login]

[all:vars]
ansible_connection=docker
ansible_user=root
spur_transport=direct
