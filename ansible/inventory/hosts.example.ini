# Day-0 ONLY — input to playbooks/bootstrap_conf.yml, which turns this into a
# starter spur.conf. Every other playbook reads its inventory from spur.conf
# itself (see inventory_plugins/spur_conf.py); this classic ini format has no
# other use in this repo.
#
# Copy this file, fill in real hostnames/IPs, then:
#   ansible-playbook -i inventory/hosts.ini playbooks/bootstrap_conf.yml -e spur_conf_out=./spur.conf

[spur_controllers]
ctl-0 ansible_host=10.0.0.10 ansible_user=root

[spur_agents]
gpu-1 ansible_host=10.0.0.20 ansible_user=root
gpu-2 ansible_host=10.0.0.21 ansible_user=root
