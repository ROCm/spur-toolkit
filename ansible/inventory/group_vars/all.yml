---
# Cluster identity
spur_cluster_name: spur-cluster

# Install
spur_version: latest                # latest | nightly | vX.Y.Z
spur_install_dir: /root/.local/bin
spur_home: /root/spur

# MPI PMIx plugin (spur_mpi_pmix.so) — installed on agents only (spur_agent role).
# Matches spurd's default [mpi].plugin_dir. Runtime --mpi=pmix jobs also need
# libpmix and Open MPI on the agent host (not installed by these playbooks).
spur_mpi_plugin_dir: /usr/lib/spur
spur_mpi_plugin_enabled: true

# Transport: direct (LAN, no encryption) | wireguard (encrypted mesh)
spur_transport: direct

# WireGuard mesh settings (only used when spur_transport == wireguard)
spur_wg_cidr: 10.44.0.0/16
spur_wg_port: 51820
spur_wg_interface: spur0

# Ports
spur_controller_port: 6817
spur_agent_port: 6818
spur_raft_port: 6821

# Accounting (PostgreSQL, embedded in spurctld). OPTIONAL — set
# spur_accounting_enabled: false to skip. Single database for the whole cluster;
# Postgres runs on spur_accounting_host (default: the first controller), which may
# be any managed host — a controller, an agent, or a dedicated node. There is no
# separate accounting daemon anymore (spurdbd was folded into spurctld upstream) —
# every controller's spurctld connects to this Postgres directly and serves
# accounting on its own gRPC port (6817), so Postgres must accept remote TCP
# connections from every controller, not just localhost.
spur_accounting_enabled: true
# spur_accounting_host: which managed host runs Postgres. NOT set here so that an
# explicit -e or inventory [all:vars] value keeps full precedence. Consumers
# resolve it with this fallback chain (see deploy.yml / teardown.yml /
# healthcheck.yml / spur_controller):
#   spur_accounting_host                         (explicit -e or inventory var)
#   | default(groups['spur_accounting_node'][0]) (dedicated DB node — just put the
#                                                 host in [spur_accounting_node])
#   | default(groups['spur_controllers'][0])     (co-located default)
# So pinning a dedicated accounting node needs ONLY the [spur_accounting_node]
# group — no separate var, and no -e whose timing at a play's hosts: line is
# unreliable.
spur_accounting_db_name: spur
spur_accounting_db_user: spur
spur_accounting_db_password: spur
spur_accounting_db_port: 5432

# Set true (per-run, via -e) to force spur_install to re-pull/re-copy binaries onto
# a host that already has them — used by rolling_upgrade.yml. deploy.yml leaves
# this false so a fresh-install re-run doesn't needlessly reinstall.
spur_force_reinstall: false

# Tolerate unreachable AGENTS and proceed with the rest (per-run, via -e).
# Default false = strict (an unreachable host aborts the run). When true, the
# AGENT plays in deploy.yml / rolling_upgrade.yml skip hosts that can't be
# reached and continue with the others — useful for a large fleet where a few
# compute nodes may be down for maintenance.
# IMPORTANT: this only ever loosens the agent plays. Controllers are Raft members
# (skipping one silently breaks quorum) and the accounting host runs the shared
# DB, so those plays stay strict regardless of this flag.
spur_ignore_unreachable_agents: false

# Submit a real test job at the end of deploy.yml / rolling_upgrade.yml to
# verify the cluster actually schedules work (spur_verify role). Default false
# so routine deploys/upgrades don't add job noise to a live cluster; CI enables
# it explicitly (-e spur_verify_enabled=true) as a smoke test.
spur_verify_enabled: false

# Facts subset gathered by every gather_facts:yes play and by spur_controller's
# on-demand per-agent gather. The roles only ever consume ansible_hostname,
# ansible_processor_vcpus, ansible_memtotal_mb, ansible_default_ipv4.address,
# and ansible_os_family — the default full gather also enumerates every mount,
# PCI device, and interface, which is slow on HPC compute nodes with many NFS
# mounts. Override with -e spur_gather_subset=all to fall back to full gathering.
spur_gather_subset:
  - '!all'
  - network
  - hardware
  - distribution

# Logging
spur_log_level: info

# Wipe Raft state on (re)deploy. Default false so re-runs/upgrades are non-destructive; set true for a fresh install.
spur_wipe_state: false

# HA mode is enabled automatically when groups['spur_controllers'] has more than one host.
# In HA mode:
#   - every controller is given a node_id (its 1-based position in groups['spur_controllers'])
#   - spur.conf gets `peers = ["ctl1:6821", "ctl2:6821", ...]` (same order on every host)
#   - agents and the CLI are given every controller's address (comma-separated);
#     spurd/spur-cli rotate to the next endpoint if one is unreachable, so a single
#     surviving controller is enough — no VIP/DNS round-robin needed for basic
#     failover (server-side leader forwarding handles writes from any controller).
spur_ha_enabled: "{{ (groups.get('spur_controllers', []) | length) > 1 }}"

# Whether the controller node also runs spurd (lets controller be a compute target).
# Auto: true if a host is in BOTH controller and agent groups.
spur_controller_runs_agent: "{{ inventory_hostname in groups.get('spur_agents', []) and inventory_hostname in groups.get('spur_controllers', []) }}"

# Job-safety: drain/skip/force behavior shared by deploy.yml, teardown.yml,
# rolling_upgrade.yml, and remove_nodes.yml (see playbooks/tasks/drain_and_guard_agent.yml).
# Leave a still-busy node untouched instead of the playbook's own default
# (refuse for teardown/rolling_upgrade/remove_nodes, force for deploy.yml).
spur_skip_busy_agents: false
# How long to wait for a node to reach DRAINED/DOWN before treating it as busy.
spur_drain_wait_secs: 120
# Per-playbook force flags: kill a busy node's running job and proceed anyway.
spur_force_teardown_busy_agents: false
spur_force_upgrade_busy_agents: false
spur_force_remove_busy_nodes: false

# Re-render spur.conf from the Ansible template instead of preserving an
# existing one (rolling_upgrade.yml controllers, and agents everywhere).
spur_overwrite_conf: false

# Agents upgraded per batch in rolling_upgrade.yml (serial). Controllers
# always upgrade one at a time regardless.
spur_rolling_batch_size: 1

# Comma-separated controller names — upgrade them in this order in
# rolling_upgrade.yml instead of [spur_controllers]'s inventory order. Must
# name every controller exactly once; left empty, inventory order is used.
spur_controller_upgrade_order: ""
