---
# Cluster identity
spur_cluster_name: spur-cluster

# Install
spur_version: latest                # latest | nightly | vX.Y.Z
spur_install_dir: /root/.local/bin
spur_home: /root/spur

# spurstepd — the per-(job, step) supervisor spurd spawns. It MUST sit in the
# same directory as spurd: the agent resolves it beside its own executable and
# does not search $PATH, so a missing spurstepd fails every job launch on that
# node. Builds that predate it ship no such binary, so spur_install installs it
# whenever the install source provides one and warns prominently when it
# doesn't. Set spur_require_stepd=true on a cluster whose build DOES ship it to
# turn that warning into a hard failure (in spur_install, and in
# healthcheck.yml's agent probe).
spur_require_stepd: false

# Where each agent keeps its own persisted runtime state — the supervisor
# sessions that let a job survive an spurd restart (they live in a runtime/
# subdirectory of this path). Deliberately NOT spur_home/state, which is the
# controller's Raft directory: on a host that is both controller and agent the
# two must not share a directory. Passed to spurd as SPUR_STEPD_STATE_DIR
# rather than --state-dir, because a build that predates spurstepd ignores an
# unknown environment variable but refuses to start on an unknown flag.
spur_agent_state_dir: "{{ spur_home }}/agent-state"

# MPI PMIx plugin (spur_mpi_pmix.so) — installed on agents only (spur_agent role).
# Matches spurd's default [mpi].plugin_dir. Runtime --mpi=pmix jobs also need
# libpmix and Open MPI on the agent host (not installed by these playbooks).
spur_mpi_plugin_dir: /usr/lib/spur
spur_mpi_plugin_enabled: true

# Transport: direct (LAN, no encryption) | wireguard (encrypted mesh)
spur_transport: direct

# WireGuard mesh settings (only used when spur_transport == wireguard)
spur_wg_cidr: 10.44.0.0/16
spur_wg_port: 51820
spur_wg_interface: spur0
# Persist the mesh across reboots: enable wg-quick@<iface> so the interface is
# re-created on boot from /etc/wireguard/<iface>.conf. The controller's reconcile
# then re-pushes peer membership; without this the node drops off the mesh on reboot.
spur_wg_persist: true

# SPUR-managed k0s cluster (spur k8s up). Disabled by default so a plain deploy
# only stands up the scheduler + mesh. Set spur_k8s_enabled=true to write the
# [cluster] section and drive k0s bring-up via playbooks/k8s_up.yml.
spur_k8s_enabled: false
spur_k8s_pod_cidr: 10.42.0.0/16
spur_k8s_service_cidr: 10.43.0.0/16
# CNI: "calico" runs bird native-routing so pods ride the WireGuard mesh (required
# when spur_transport=wireguard and you want pod traffic on the mesh). "kuberouter"
# is the k0s default (no custom config). Calico advertises the API on the mesh IP.
spur_k8s_cni: calico
spur_k8s_cni_mtu: 1450
# k0s control plane: CSV of control-plane node names (as registered with spurctld). One name = a
# single control plane; 3 or 5 = HA (etcd quorum). The first entry is the etcd bootstrap. Empty =
# the playbook picks the first [spur_controllers] host. For a mesh where the spurctld controller
# is NOT a k8s node, set this to the intended k8s control-plane agent(s). This is the k0s control
# plane and is independent of how many SPUR controllers (spurctld) run.
spur_k8s_control_plane_nodes: ""
# Nodes to scope the k0s cluster to (hostlist/CSV of registered node names). Empty
# = whole inventory. Set to the subset that should run k0s (e.g. control-plane +
# GPU workers) when the mesh has more nodes than the k8s cluster.
spur_k8s_nodes: ""
spur_k8s_version: "v1.36.2+k0s.0"

# Ports
spur_controller_port: 6817
spur_agent_port: 6818
spur_raft_port: 6821

# Accounting (PostgreSQL, embedded in spurctld). OPTIONAL — set
# spur_accounting_enabled: false to skip. Single database for the whole cluster;
# Postgres runs on spur_accounting_host (default: the first controller), which may
# be any managed host — a controller, an agent, or a dedicated node. There is no
# separate accounting daemon anymore (spurdbd was folded into spurctld upstream) —
# every controller's spurctld connects to this Postgres directly and serves
# accounting on its own gRPC port (6817), so Postgres must accept remote TCP
# connections from every controller, not just localhost.
spur_accounting_enabled: true
# spur_accounting_host: which managed host runs Postgres. NOT set here so that an
# explicit -e or inventory [all:vars] value keeps full precedence. Consumers
# resolve it with this fallback chain (see deploy.yml / teardown.yml /
# healthcheck.yml / spur_controller):
#   spur_accounting_host                         (explicit -e or inventory var)
#   | default(groups['spur_accounting_node'][0]) (dedicated DB node — just put the
#                                                 host in [spur_accounting_node])
#   | default(groups['spur_controllers'][0])     (co-located default)
# So pinning a dedicated accounting node needs ONLY the [spur_accounting_node]
# group — no separate var, and no -e whose timing at a play's hosts: line is
# unreliable.
spur_accounting_db_name: spur
spur_accounting_db_user: spur
spur_accounting_db_password: spur
spur_accounting_db_port: 5432

# Set true (per-run, via -e) to force spur_install to re-pull/re-copy binaries onto
# a host that already has them — used by rolling_upgrade.yml. deploy.yml leaves
# this false so a fresh-install re-run doesn't needlessly reinstall.
spur_force_reinstall: false

# Tolerate unreachable AGENTS and proceed with the rest (per-run, via -e).
# Default false = strict (an unreachable host aborts the run). When true, the
# AGENT plays in deploy.yml / rolling_upgrade.yml skip hosts that can't be
# reached and continue with the others — useful for a large fleet where a few
# compute nodes may be down for maintenance.
# IMPORTANT: this only ever loosens the agent plays. Controllers are Raft members
# (skipping one silently breaks quorum) and the accounting host runs the shared
# DB, so those plays stay strict regardless of this flag.
spur_ignore_unreachable_agents: false

# Submit a real test job at the end of deploy.yml / rolling_upgrade.yml to
# verify the cluster actually schedules work (spur_verify role). Default false
# so routine deploys/upgrades don't add job noise to a live cluster; CI enables
# it explicitly (-e spur_verify_enabled=true) as a smoke test.
spur_verify_enabled: false

# Facts subset gathered by every gather_facts:yes play and by spur_controller's
# on-demand per-agent gather. The roles only ever consume ansible_hostname,
# ansible_processor_vcpus, ansible_memtotal_mb, ansible_default_ipv4.address,
# and ansible_os_family — the default full gather also enumerates every mount,
# PCI device, and interface, which is slow on HPC compute nodes with many NFS
# mounts. Override with -e spur_gather_subset=all to fall back to full gathering.
spur_gather_subset:
  - '!all'
  - network
  - hardware
  - distribution

# SSH keepalive tuning (see ansible.cfg's ssh_args for ConnectTimeout/
# ControlPersist, which are static and not overridable per-run). These bound
# how long a task can block on a connection that's gone silent — e.g. an
# agent that dropped off the network mid-play, or a stale ControlPersist
# master socket — instead of hanging indefinitely. Deliberately looser than
# ConnectTimeout: an established session can legitimately go quiet for a
# while (a busy remote host under this playbook's own forks=20 concurrency, a
# long-running install/copy task with no channel chatter), so this needs
# enough slack to not misclassify a slow-but-reachable node as dead. Override
# with -e if your fleet needs tighter failure detection (fast, reliable LAN)
# or more slack (loaded nodes, high-latency/lossy network):
#   -e spur_ssh_server_alive_interval=5 -e spur_ssh_server_alive_count_max=3
ansible_ssh_extra_args: >-
  -o ServerAliveInterval={{ spur_ssh_server_alive_interval | default(15) }}
  -o ServerAliveCountMax={{ spur_ssh_server_alive_count_max | default(3) }}
spur_ssh_server_alive_interval: 15
spur_ssh_server_alive_count_max: 3

# Logging
spur_log_level: info

# spurctld systemd unit's TimeoutStopSec — bounds how long systemd waits for a
# stuck/slow shutdown (e.g. a live srun step, see SPUR-304) before SIGKILL'ing
# it, instead of falling back to systemd's own ~90s default. Applies to every
# stop/restart/rolling-upgrade of spurctld. Override with -e for a cluster that
# needs more slack.
spur_controller_stop_timeout_secs: 15

# Wipe Raft state on (re)deploy. Default false so re-runs/upgrades are non-destructive; set true for a fresh install.
spur_wipe_state: false

# HA mode is enabled automatically when groups['spur_controllers'] has more than one host.
# In HA mode:
#   - every controller is given a node_id (its 1-based position in groups['spur_controllers'])
#   - spur.conf gets `peers = ["ctl1:6821", "ctl2:6821", ...]` (same order on every host)
#   - agents and the CLI are given every controller's address (comma-separated);
#     spurd/spur-cli rotate to the next endpoint if one is unreachable, so a single
#     surviving controller is enough — no VIP/DNS round-robin needed for basic
#     failover (server-side leader forwarding handles writes from any controller).
spur_ha_enabled: "{{ (groups.get('spur_controllers', []) | length) > 1 }}"

# Whether the controller node also runs spurd (lets controller be a compute target).
# Auto: true if a host is in BOTH controller and agent groups.
spur_controller_runs_agent: "{{ inventory_hostname in groups.get('spur_agents', []) and inventory_hostname in groups.get('spur_controllers', []) }}"

# Job-safety: drain/skip/force variables. deploy.yml/rolling_upgrade.yml/teardown.yml
# (opt-in only) share the drain task at playbooks/tasks/drain_and_guard_agent.yml;
# remove_nodes.yml reads these same variables in its own separate inline logic.
# Leave a still-busy node untouched instead of the playbook's own default
# (refuse for rolling_upgrade/remove_nodes, force for deploy.yml).
spur_skip_busy_agents: false
# How long to wait for a node to reach DRAINED/DOWN before treating it as busy.
spur_drain_wait_secs: 120
# Per-playbook force flags: kill a busy node's running job and proceed anyway.
spur_force_teardown_busy_agents: false
spur_force_upgrade_busy_agents: false
spur_force_remove_busy_nodes: false

# Re-render spur.conf from the Ansible template instead of preserving an
# existing one (rolling_upgrade.yml controllers, and agents everywhere).
spur_overwrite_conf: false

# Agents upgraded per batch in rolling_upgrade.yml (serial). Controllers
# always upgrade one at a time regardless.
spur_rolling_batch_size: 1

# Comma-separated controller names — upgrade them in this order in
# rolling_upgrade.yml instead of [spur_controllers]'s inventory order. Must
# name every controller exactly once; left empty, inventory order is used.
spur_controller_upgrade_order: ""

# --- Authentication & RBAC (native "spur" plugin). OPT-IN, off by default. ---
# When false, nothing below is rendered or installed and behavior is identical
# to a pre-auth deployment. Enabling flips every host to plugin = "spur":
# spurauthd (the credential mint) runs on controllers, agents, and login nodes;
# an [auth] block is rendered into spur.conf; and JWKS keys are distributed per
# role. See ansible/README.md ("Authentication & RBAC") for the full flow.
spur_auth_enabled: false

# Enforcement mode. "permissive" verifies a credential when one is presented and
# rejects a bad one, but still accepts a caller that sends none (logging it) —
# the safe first step, since RBAC already applies to authenticated callers.
# "required" rejects every uncredentialed request. Roll out permissive first,
# watch the logs, then re-run with spur_auth_mode=required.
spur_auth_mode: permissive          # permissive | required

# Node admission control. Left "open" deliberately: "token" brings a hard weekly
# spurd-restart requirement (node tokens expire 7 days after each registration
# and nothing renews them) and is out of scope for this toolkit for now.
spur_auth_admission_mode: open      # open | token

# Control-node directory that holds the generated JWKS key sets — the source of
# truth reused across every run (deploy, rolling upgrade, add_nodes). Auto-
# generated on the first controller and fetched here on first enable; pre-
# populate it yourself to bring your own keys. GIT-IGNORED (see ansible/.gitignore)
# because these files ARE the cluster's auth secrets.
spur_auth_keys_dir: "{{ playbook_dir }}/../keys"

# Where the CLI-facing spur.conf lives on managed hosts (the path the `spur` CLI
# reads by default). Keep at /etc/spur so the CLI needs no $SPUR_CONF.
spur_auth_conf_dir: /etc/spur

# On-host directory for the JWKS KEY files (*.jwks). Defaults to spur_auth_conf_dir
# (/etc/spur) — local, per-node. Point it at a shared path (e.g. an NFS mount every
# node mounts at the SAME path) to centralize keys: the daemons are told to read
# from here via SPUR_*_JWKS env in their systemd units (spurctld: auth + controller/
# cred/node signing; spurd: auth + controller/cred verification; spurauthd: auth via
# --jwks). The CLI's spur.conf stays at spur_auth_conf_dir (local).
#
# SECURITY: a shared/broadly-readable key location exposes the controller SIGNING
# keys (controller-signing / cred-signing / node-signing) to every node that can
# read it — anyone with read access can forge controller/admin/job credentials
# (normally these live only on controllers). Restrict the export (root-only perms,
# no_root_squash; ideally a controllers-only export for the signing set) and only
# use a shared location on a trusted single-tenant cluster. The NFS must also be
# mounted (rw where the playbook writes) BEFORE running — the toolkit does not
# manage the mount, only the key files under this path.
spur_auth_key_dir: "{{ spur_auth_conf_dir }}"

# RBAC role bindings (all site-specific, empty by default). Usernames must
# resolve via NSS on login/compute nodes; groups on the controller + compute.
spur_cluster_admins: []             # usernames -> Administrator
spur_admin_groups: []               # NSS groups -> Administrator
spur_operator_groups: []            # NSS groups -> Operator

# Keep root an Administrator once auth is on. Every playbook drives the cluster
# as root via the CLI (drain/resume/remove/add/verify), so without this those
# calls would be denied the moment a controller switches to plugin = "spur".
# Per the enablement doc this is not a real security boundary anyway (root on
# any mint host can read auth.jwks and forge an admin identity), so it is safe
# to default on and necessary for the automation to keep working.
spur_allow_uid_zero_administrator: true

# Allow jobs to EXECUTE as uid 0 (distinct from the RBAC role above). Default
# false; the verify role submits as spur_verify_submit_user instead.
spur_allow_root_jobs: false

# Credential lifetime spurauthd mints (seconds). Matches the binary default.
spur_authd_lifetime_secs: 30

# Like spur_require_stepd: when true, a missing spurauthd binary is a hard
# failure in spur_install (and a reported problem in healthcheck.yml) instead of
# a warning. Default false because a pinned release predating ROCm/spur#919
# ships none.
spur_require_authd: false

# --- cgroup v2 job resource enforcement (spurd, native-host jobs). ---
# spurd ALREADY enforces these by default (every field below defaults on in the
# binary); the toolkit renders an explicit, tunable [cgroup] block so the posture
# is visible and adjustable. Read at spurd startup only — a change needs a spurd
# restart (scontrol reconfigure won't apply it). See ansible/README.md (cgroups).
# Needs the cgroup-v2 unified hierarchy (default on Ubuntu 22.04) and spurd as
# root (it is); the device filter needs CAP_BPF+CAP_NET_ADMIN (root has them).
spur_cgroup_manage: true              # render a [cgroup] block at all (false -> omit; spurd uses its built-in defaults)
spur_cgroup_enabled: true             # [cgroup].enabled master switch (false -> spurd creates no cgroup, applies no limits)
spur_cgroup_required: false           # fail closed: refuse a job when a constraint can't be applied (needs root + v2)
spur_cgroup_constrain_cores: true     # pin to allocated cores via cpuset.cpus
spur_cgroup_cpu_quota: false          # also cap CPU time via cpu.max CFS quota (off: cpuset already bounds whole cores)
spur_cgroup_constrain_ram_space: true # cap memory via memory.max + memory.high
spur_cgroup_allowed_ram_percent: 100  # hard ceiling as % of the allocation (MUST be >= 1; upstream rejects 0)
spur_cgroup_constrain_swap: false     # bound swap via memory.swap.max
spur_cgroup_allowed_swap_percent: 0   # swap allowance as % of the memory budget (0 = none)
spur_cgroup_min_ram_mb: 30            # floor for the memory ceilings (MiB)
spur_cgroup_oom_kill_job: true        # on OOM kill the whole job (memory.oom.group), not one process
spur_cgroup_constrain_devices: true   # default-deny cgroup-v2 BPF device filter
# Extra device nodes EVERY job on a node may open, on top of its allocation and
# the built-in implicit set — the escape hatch for GRES-configured GPU nodes
# (e.g. /dev/nvidiactl, /dev/nvidia-uvm) or site devices the defaults miss.
spur_cgroup_extra_device_paths: []
# Agent preflight posture: warn (default) or hard-fail when a compute node isn't
# cgroup-v2 ready. Auto-escalates to fail when spur_cgroup_required=true.
spur_cgroup_require_v2: false
