; ============================================================================
; 20-node HA Spur cluster over a WireGuard mesh, running a SPUR-managed k0s
; (k8s) cluster with an HA control plane. Plus 1 login node (21 hosts total).
;
; Node roll-up (20 + 1 login):
;   3   SPUR controllers (spurctld / Raft quorum)   -> ctl-0,1,2
;   3   k0s control-plane nodes (HA etcd quorum)    -> k8s-cp-0,1,2
;   5   k0s worker nodes                            -> k8s-w-0..4
;   9   plain compute agents (no k8s)               -> gpu-0..8
;   1   login-only node                             -> login-0
;
; IMPORTANT — how the k8s roles map to inventory:
;   There is NO [k8s_controllers] / [k8s_workers] inventory group. The k0s
;   control-plane vs worker split is a RUNTIME parameter passed to `spur k8s up`
;   via spur_k8s_control_plane_nodes / spur_k8s_nodes (see k8sha.vars.yml).
;   Every k8s node must FIRST be a registered SPUR agent, so k8s-cp-* and k8s-w-*
;   all live in [spur_agents]. The k0s control plane is independent of the SPUR
;   (spurctld) controllers — they are different quorums on different nodes here.
;
; Quorum math (tolerate floor((N-1)/2) failures):
;   3 SPUR controllers  -> tolerate 1 spurctld failure
;   3 k0s control-plane -> tolerate 1 etcd failure
;
; Mesh addressing: pinned per host with spur_wg_address (recommended — the role's
; positional auto-assign is NOT stable once you add/remove nodes). Bootstrap
; controller ctl-0 = .1 (spur net init); every other node net-joins. A block of
; the /16 is reserved per role so the layout stays readable as the cluster grows:
;   ctl-*   -> 10.44.0.1-3    k8s-cp-* -> 10.44.0.11-13
;   k8s-w-* -> 10.44.0.21-25  gpu-*    -> 10.44.0.31-39   login-0 -> 10.44.0.41
;
; node_id for Raft = position in [spur_controllers] (1-based). Keep that order
; stable across redeploys.
;
;   Deploy:  ansible-playbook playbooks/deploy.yml  -i inventory/hosts.k8sha.ini -e @inventory/k8sha.vars.yml
;   k8s up:  ansible-playbook playbooks/k8s_up.yml  -i inventory/hosts.k8sha.ini -e @inventory/k8sha.vars.yml
;
; Copy this to hosts.k8sha.ini and fill in real hosts/credentials — the real
; inventory is gitignored (inventory/*.ini); only *.example.ini is tracked. The
; run-vars MUST be passed via -e @inventory/k8sha.vars.yml because
; group_vars/all.yml outranks inventory [all:vars] and would revert
; spur_transport to direct (a silent no-mesh trap).
; ============================================================================

[spur_controllers]
ctl-0 ansible_host=10.0.0.10 ansible_user=root spur_wg_address=10.44.0.1
ctl-1 ansible_host=10.0.0.11 ansible_user=root spur_wg_address=10.44.0.2
ctl-2 ansible_host=10.0.0.12 ansible_user=root spur_wg_address=10.44.0.3

[spur_agents]
; Every controller also runs spurd so it registers as a node and stays in the
; mesh membership (a mesh member that never registers is pruned from every peer
; — see docs/findings/controller-not-in-mesh-membership.md in ROCm/spur).
ctl-0     ansible_host=10.0.0.10 ansible_user=root spur_wg_address=10.44.0.1
ctl-1     ansible_host=10.0.0.11 ansible_user=root spur_wg_address=10.44.0.2
ctl-2     ansible_host=10.0.0.12 ansible_user=root spur_wg_address=10.44.0.3
; k0s HA control-plane nodes (also plain SPUR agents):
k8s-cp-0  ansible_host=10.0.0.20 ansible_user=root spur_wg_address=10.44.0.11
k8s-cp-1  ansible_host=10.0.0.21 ansible_user=root spur_wg_address=10.44.0.12
k8s-cp-2  ansible_host=10.0.0.22 ansible_user=root spur_wg_address=10.44.0.13
; k0s worker nodes:
k8s-w-0   ansible_host=10.0.0.30 ansible_user=root spur_wg_address=10.44.0.21
k8s-w-1   ansible_host=10.0.0.31 ansible_user=root spur_wg_address=10.44.0.22
k8s-w-2   ansible_host=10.0.0.32 ansible_user=root spur_wg_address=10.44.0.23
k8s-w-3   ansible_host=10.0.0.33 ansible_user=root spur_wg_address=10.44.0.24
k8s-w-4   ansible_host=10.0.0.34 ansible_user=root spur_wg_address=10.44.0.25
; Plain compute agents (in the mesh + SPUR scheduler, NOT part of the k0s cluster):
gpu-0     ansible_host=10.0.0.40 ansible_user=root spur_wg_address=10.44.0.31
gpu-1     ansible_host=10.0.0.41 ansible_user=root spur_wg_address=10.44.0.32
gpu-2     ansible_host=10.0.0.42 ansible_user=root spur_wg_address=10.44.0.33
gpu-3     ansible_host=10.0.0.43 ansible_user=root spur_wg_address=10.44.0.34
gpu-4     ansible_host=10.0.0.44 ansible_user=root spur_wg_address=10.44.0.35
gpu-5     ansible_host=10.0.0.45 ansible_user=root spur_wg_address=10.44.0.36
gpu-6     ansible_host=10.0.0.46 ansible_user=root spur_wg_address=10.44.0.37
gpu-7     ansible_host=10.0.0.47 ansible_user=root spur_wg_address=10.44.0.38
gpu-8     ansible_host=10.0.0.48 ansible_user=root spur_wg_address=10.44.0.39

[spur_login]
; Login-only node (in the mesh so interactive srun streams job output over the
; tunnel); not a controller/agent, not a k8s node.
login-0   ansible_host=10.0.0.50 ansible_user=root spur_wg_address=10.44.0.41

[all:vars]
; StrictHostKeyChecking=no disables SSH host-key verification — convenient for
; throwaway lab VMs whose keys churn, but it removes MITM protection. Do NOT use
; this in production; pre-seed known_hosts and drop this line there.
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
