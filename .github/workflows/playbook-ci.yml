# ============================================================================
# Playbook integration tests — three parallel jobs, each with its own cluster.
#
# integration-resilience:
#   deploy + rolling upgrade covering all three agent states + force upgrade
#   with OS-level kill verification (bare process AND Docker container)
#
# integration-conf:
#   deploy + spur.conf preservation (default: preserve, opt-in: overwrite)
#
# techsupport:
#   deploy, then exercise techsupport/spur-techsupport.sh end-to-end over real
#   SSH (the only job that installs sshd in the containers) — default run,
#   skip-flags, and the fail/--partial paths.
#
# Full HA/accounting/login-node coverage lives in deploy.yml's own path.
# Day-2 playbooks (add_nodes/remove_nodes/manage_accounts/healthcheck/teardown)
# are TODO — they build on the same running cluster.
# ============================================================================
name: playbook-ci

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'ansible/**'
      - 'techsupport/**'
      - '.github/workflows/playbook-ci.yml'
  pull_request:
    paths:
      - 'ansible/**'
      - 'techsupport/**'
      - '.github/workflows/playbook-ci.yml'

concurrency:
  group: playbook-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ansible + lint
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible-core ansible-lint
          ansible-galaxy collection install community.docker
      - name: Syntax check all playbooks
        working-directory: ansible
        run: |
          # Some playbooks template their `hosts:` from a runtime -e var (e.g.
          # add_nodes.yml/remove_nodes.yml need new_nodes/... ) and --syntax-check
          # errors on an empty hosts pattern. Pass harmless dummy values so the
          # syntax check can parse them; these never connect to anything.
          DUMMY="-e new_nodes=ctl-0 -e remove_nodes=ctl-0"
          for pb in playbooks/*.yml; do
            echo "== syntax-check $pb =="
            ansible-playbook --syntax-check -i inventory/ci.ini $DUMMY "$pb" || exit 1
          done

  # ---------------------------------------------------------------------------
  # Job 1: rolling upgrade resilience + force upgrade + container kill
  # ---------------------------------------------------------------------------
  integration-resilience:
    runs-on: ubuntu-latest
    needs: lint
    env:
      NODES: "ctl-0 gpu-1 gpu-2 gpu-3"
    steps:
      - uses: actions/checkout@v4

      - name: Download + verify Spur binaries (deploy = release, upgrade = nightly)
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_TAG: ""
          UPGRADE_TAG: ""
        run: |
          set -euo pipefail

          fetch() {
            local tag="$1" dest="$2" d
            d="dl-$dest"
            mkdir -p "$d"
            ( cd "$d"
              gh release download "$tag" --repo ROCm/spur \
                --pattern '*-linux-amd64.tar.gz' \
                --pattern '*-linux-amd64.tar.gz.sha256'
              tarball=$(ls *-linux-amd64.tar.gz)
              echo "Verifying checksum of $tarball ($tag)"
              hash=$(awk '{print $1}' "${tarball}.sha256")
              echo "${hash}  ${tarball}" | sha256sum -c -
              tar xzf "$tarball"
              bindir=$(dirname "$(find . -type f -name spurctld | head -1)")
              test -n "$bindir" || { echo "spurctld not found in $tarball"; exit 1; }
              mkdir -p "$GITHUB_WORKSPACE/$dest"
              for b in spur spurctld spurd; do cp "$bindir/$b" "$GITHUB_WORKSPACE/$dest/$b"; done
              chmod +x "$GITHUB_WORKSPACE/$dest"/*
            )
          }

          deploy_tag="${DEPLOY_TAG:-}"
          if [ -z "$deploy_tag" ]; then
            deploy_tag=$(gh api repos/ROCm/spur/releases --jq \
              'map(select(.tag_name != "nightly"))[0].tag_name')
          fi
          upgrade_tag="${UPGRADE_TAG:-nightly}"

          echo "Deploy version : $deploy_tag  -> spur-bin"
          echo "Upgrade version: $upgrade_tag -> spur-bin-new"
          fetch "$deploy_tag"  spur-bin
          fetch "$upgrade_tag" spur-bin-new

      - name: Start systemd containers on a docker network
        env:
          IMG: jrei/systemd-ubuntu:22.04
        run: |
          set -euo pipefail
          docker network create spur-ci
          docker pull "$IMG"
          for n in $NODES; do
            docker run -d --name "$n" --hostname "$n" \
              --network spur-ci \
              --privileged \
              --cgroupns=host \
              -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
              --tmpfs /run --tmpfs /run/lock --tmpfs /tmp \
              "$IMG"
          done

      - name: Wait for systemd to be ready in every container
        run: |
          set -uo pipefail
          for n in $NODES; do
            ok=""
            for i in $(seq 1 30); do
              st=$(docker exec "$n" systemctl is-system-running 2>/dev/null || true)
              case "$st" in running|degraded) ok=1; break ;; esac
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "::error::systemd never became ready in $n (last: ${st:-none})"
              docker exec "$n" systemctl status --no-pager || true
              exit 1
            fi
            echo "$n: systemd ready ($st)"
          done

      - name: Install in-container preflight deps (curl/tar/iproute2/python3/sudo)
        run: |
          set -euo pipefail
          for n in $NODES; do
            docker exec "$n" bash -c 'apt-get update -qq && apt-get install -y -qq curl tar iproute2 python3 sudo'
          done

      - name: Install Docker inside gpu-3 (for container kill test)
        run: |
          set -euo pipefail
          # Install Docker CE inside the gpu-3 systemd container so we can
          # submit a spur job that launches a Docker container, then assert
          # the container is killed by the force-upgrade playbook.
          docker exec gpu-3 bash -c '
            apt-get install -y -qq ca-certificates curl gnupg lsb-release
            install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
              | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
            echo "deb [arch=$(dpkg --print-architecture) \
              signed-by=/etc/apt/keyrings/docker.gpg] \
              https://download.docker.com/linux/ubuntu \
              $(lsb_release -cs) stable" \
              > /etc/apt/sources.list.d/docker.list
            apt-get update -qq
            apt-get install -y -qq docker-ce docker-ce-cli containerd.io
            systemctl enable --now docker
          '
          # Wait for Docker daemon to be ready inside gpu-3
          for i in $(seq 1 30); do
            docker exec gpu-3 docker info &>/dev/null && break
            sleep 2
          done
          docker exec gpu-3 docker info --format '{{.ServerVersion}}'

      - name: Install ansible + docker connection plugin
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible-core
          ansible-galaxy collection install community.docker

      - name: deploy.yml (1 ctl + 3 agents)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci.ini playbooks/deploy.yml \
            -e spur_binary_src="$GITHUB_WORKSPACE/spur-bin" \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur

      - name: Assert all three agents registered
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            missing=""
            for a in gpu-1 gpu-2 gpu-3; do
              docker exec ctl-0 /usr/local/bin/spur show node "$a" 2>/dev/null \
                | grep -qx "NodeName=$a" || missing="$missing $a"
            done
            [ -z "$missing" ] && { echo "all three agents registered"; break; }
            sleep 2
          done
          echo "== spur nodes =="
          docker exec ctl-0 /usr/local/bin/spur nodes
          [ -z "$missing" ] || { echo "agents still missing:$missing"; exit 1; }

      - name: Assert a job runs to completion
        run: |
          set -euo pipefail
          docker exec ctl-0 bash -lc '
            set -e
            cat > /tmp/ci-job.sh <<EOF
          #!/bin/bash
          #SBATCH --job-name=ci-smoke
          echo "ran on \$(hostname)"
          EOF
            jid=$(/usr/local/bin/spur submit /tmp/ci-job.sh | grep -oE "[0-9]+" | head -1)
            echo "submitted job $jid"
            for i in $(seq 1 30); do
              st=$(/usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE "JobState=[A-Z]+" | head -1 | cut -d= -f2)
              case "$st" in
                COMPLETED) echo "job $jid COMPLETED"; exit 0 ;;
                FAILED|CANCELLED|TIMEOUT|NODE_FAIL) echo "job $jid ended $st"; exit 1 ;;
              esac
              sleep 2
            done
            echo "job $jid did not complete in time (last: ${st:-none})"; exit 1
          '

      # --- Pass 1: resilience (3 agent states in one run) ------------------
      - name: Simulate gpu-2 unreachable and gpu-3 busy
        run: |
          set -euo pipefail
          docker stop gpu-2
          docker exec ctl-0 bash -lc '
            set -e
            printf "#!/bin/bash\n#SBATCH --job-name=busy\nsleep 600\n" > /tmp/ci-busy.sh
            jid=$(/usr/local/bin/spur submit -w gpu-3 /tmp/ci-busy.sh | grep -oE "[0-9]+" | head -1)
            echo "$jid" > /tmp/ci-busy.jid
            for i in $(seq 1 30); do
              st=$(/usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE "JobState=[A-Z]+" | head -1 | cut -d= -f2)
              [ "$st" = RUNNING ] && { echo "busy job $jid RUNNING on gpu-3"; exit 0; }
              sleep 1
            done
            echo "busy job $jid never reached RUNNING (last: ${st:-none})"; exit 1
          '

      - name: rolling_upgrade.yml (gpu-1 normal, gpu-2 unreachable, gpu-3 busy)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci.ini playbooks/rolling_upgrade.yml \
            -e spur_binary_src="$GITHUB_WORKSPACE/spur-bin-new" \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur \
            -e spur_ignore_unreachable_agents=true \
            -e spur_skip_busy_agents=true \
            -e spur_drain_wait_secs=10 \
            -e spur_rolling_batch_size=2

      - name: Assert gpu-1 upgraded and still schedules work
        run: |
          set -euo pipefail
          found=""
          for i in $(seq 1 30); do
            docker exec ctl-0 /usr/local/bin/spur show node gpu-1 2>/dev/null \
              | grep -qx "NodeName=gpu-1" && { found=1; break; }
            sleep 2
          done
          [ -n "$found" ] || { echo "gpu-1 missing after upgrade"; exit 1; }
          echo "gpu-1 registered"
          docker exec ctl-0 bash -lc '
            set -e
            printf "#!/bin/bash\n#SBATCH --job-name=post-upgrade\necho ok on \$(hostname)\n" > /tmp/ci-post.sh
            jid=$(/usr/local/bin/spur submit /tmp/ci-post.sh | grep -oE "[0-9]+" | head -1)
            for i in $(seq 1 30); do
              st=$(/usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE "JobState=[A-Z]+" | head -1 | cut -d= -f2)
              [ "$st" = COMPLETED ] && { echo "post-upgrade job $jid COMPLETED"; exit 0; }
              case "$st" in FAILED|CANCELLED|TIMEOUT|NODE_FAIL) echo "job ended $st"; exit 1 ;; esac
              sleep 2
            done
            echo "post-upgrade job did not complete"; exit 1
          '

      - name: Assert gpu-3 busy job was left undisturbed
        run: |
          set -euo pipefail
          jid=$(docker exec ctl-0 cat /tmp/ci-busy.jid)
          st=$(docker exec ctl-0 /usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE 'JobState=[A-Z]+' | head -1 | cut -d= -f2)
          echo "busy job $jid state after rolling upgrade: $st"
          [ "$st" = RUNNING ] || { echo "busy job $jid was disturbed by the upgrade (state: $st)"; exit 1; }
          docker exec ctl-0 /usr/local/bin/spur show node gpu-3

      # --- Pass 2: force upgrade — bare process + Docker container killed ---
      - name: Submit force-upgrade test jobs on gpu-3 (bare sleep + Docker container)
        run: |
          set -euo pipefail
          # Cancel the original busy job and wait for gpu-3 to go IDLE.
          jid=$(docker exec ctl-0 cat /tmp/ci-busy.jid)
          docker exec ctl-0 /usr/local/bin/spur scancel "$jid" || true
          for i in $(seq 1 30); do
            st=$(docker exec ctl-0 /usr/local/bin/spur show node gpu-3 2>/dev/null | grep -oE 'State=[A-Z]+' | head -1 | cut -d= -f2)
            [ "$st" = IDLE ] && break
            sleep 2
          done

          # Job A: bare sleep (existing test path).
          docker exec ctl-0 bash -lc '
            set -e
            printf "#!/bin/bash\n#SBATCH --job-name=force-bare\nsleep 600\n" > /tmp/ci-force-bare.sh
            jid=$(/usr/local/bin/spur submit -w gpu-3 /tmp/ci-force-bare.sh | grep -oE "[0-9]+" | head -1)
            echo "$jid" > /tmp/ci-force-bare.jid
            for i in $(seq 1 30); do
              st=$(/usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE "JobState=[A-Z]+" | head -1 | cut -d= -f2)
              [ "$st" = RUNNING ] && { echo "bare job $jid RUNNING on gpu-3"; exit 0; }
              sleep 1
            done
            echo "bare job $jid never reached RUNNING"; exit 1
          '

          # Job B: Docker container (tests the container-kill code path).
          # The job script launches a detached Docker container inside gpu-3
          # then sleeps in the foreground so the spur job stays RUNNING.
          docker exec ctl-0 bash -lc '
            set -e
            cat > /tmp/ci-force-docker.sh <<EOF
          #!/bin/bash
          #SBATCH --job-name=force-docker
          docker run -d --name ci-force-container ubuntu:22.04 sleep 600
          sleep 600
          EOF
            jid=$(/usr/local/bin/spur submit -w gpu-3 /tmp/ci-force-docker.sh | grep -oE "[0-9]+" | head -1)
            echo "$jid" > /tmp/ci-force-docker.jid
            for i in $(seq 1 30); do
              st=$(/usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE "JobState=[A-Z]+" | head -1 | cut -d= -f2)
              [ "$st" = RUNNING ] && { echo "docker job $jid RUNNING on gpu-3"; exit 0; }
              sleep 1
            done
            echo "docker job $jid never reached RUNNING"; exit 1
          '

          # Confirm the Docker container is actually running inside gpu-3.
          for i in $(seq 1 20); do
            docker exec gpu-3 docker ps --filter name=ci-force-container --format '{{.Names}}' \
              | grep -q ci-force-container && { echo "ci-force-container running"; break; }
            sleep 2
          done
          docker exec gpu-3 docker ps --filter name=ci-force-container

      - name: rolling_upgrade.yml --force (gpu-3 force-upgraded, jobs+container killed)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci.ini playbooks/rolling_upgrade.yml \
            -e spur_binary_src="$GITHUB_WORKSPACE/spur-bin-new" \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur \
            -e spur_ignore_unreachable_agents=true \
            -e spur_force_upgrade_busy_agents=true \
            -e spur_drain_wait_secs=10

      - name: Assert bare job processes were killed (scheduler + OS cgroup check)
        run: |
          set -euo pipefail
          jid=$(docker exec ctl-0 cat /tmp/ci-force-bare.jid)
          st=$(docker exec ctl-0 /usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE 'JobState=[A-Z_]+' | head -1 | cut -d= -f2)
          echo "bare job $jid scheduler state: $st"
          [ "$st" = RUNNING ] && { echo "FAIL: bare job still RUNNING"; exit 1; }
          echo "scheduler: bare job ended with $st"

          orphan_pids=$(docker exec gpu-3 bash -c \
            "find /sys/fs/cgroup/spur -name cgroup.procs 2>/dev/null | xargs cat 2>/dev/null | sort -u" || true)
          if [ -n "$orphan_pids" ]; then
            echo "FAIL: orphan PIDs still in spur cgroups on gpu-3: $orphan_pids"
            docker exec gpu-3 ps -p "$orphan_pids" || true
            exit 1
          fi
          echo "OS check: spur cgroups empty on gpu-3"

      - name: Assert Docker container was killed by force upgrade
        run: |
          set -euo pipefail
          jid=$(docker exec ctl-0 cat /tmp/ci-force-docker.jid)
          st=$(docker exec ctl-0 /usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE 'JobState=[A-Z_]+' | head -1 | cut -d= -f2)
          echo "docker job $jid scheduler state: $st"
          [ "$st" = RUNNING ] && { echo "FAIL: docker job still RUNNING in scheduler"; exit 1; }
          echo "scheduler: docker job ended with $st"

          # The Docker container must be gone — not running, not even stopped/exited.
          running=$(docker exec gpu-3 docker ps --filter name=ci-force-container --format '{{.Names}}' || true)
          if [ -n "$running" ]; then
            echo "FAIL: Docker container ci-force-container is still RUNNING on gpu-3"
            docker exec gpu-3 docker ps
            exit 1
          fi
          echo "Docker container ci-force-container is gone from gpu-3"

      - name: Assert gpu-3 re-registered after force upgrade
        run: |
          set -euo pipefail
          found=""
          for i in $(seq 1 30); do
            docker exec ctl-0 /usr/local/bin/spur show node gpu-3 2>/dev/null \
              | grep -qx "NodeName=gpu-3" && { found=1; break; }
            sleep 2
          done
          [ -n "$found" ] || { echo "gpu-3 did not re-register after force upgrade"; exit 1; }
          echo "gpu-3 re-registered after force upgrade"
          docker exec ctl-0 /usr/local/bin/spur show node gpu-3

      - name: Dump logs on failure
        if: failure()
        run: |
          for n in $NODES; do
            echo "===== $n journal (spur*) ====="
            docker exec "$n" bash -c 'journalctl -u "spur*" --no-pager | tail -50' || true
            echo "===== $n docker ps ====="
            docker exec "$n" docker ps -a 2>/dev/null || true
          done

      - name: Teardown containers
        if: always()
        run: |
          for n in $NODES; do docker rm -f "$n" || true; done
          docker network rm spur-ci || true

  # ---------------------------------------------------------------------------
  # Job 2: spur.conf preservation
  # ---------------------------------------------------------------------------
  integration-conf:
    runs-on: ubuntu-latest
    needs: lint
    env:
      NODES: "ctl-0 gpu-1 gpu-2 gpu-3"
    steps:
      - uses: actions/checkout@v4

      - name: Download + verify Spur binaries (deploy = release, upgrade = nightly)
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_TAG: ""
          UPGRADE_TAG: ""
        run: |
          set -euo pipefail

          fetch() {
            local tag="$1" dest="$2" d
            d="dl-$dest"
            mkdir -p "$d"
            ( cd "$d"
              gh release download "$tag" --repo ROCm/spur \
                --pattern '*-linux-amd64.tar.gz' \
                --pattern '*-linux-amd64.tar.gz.sha256'
              tarball=$(ls *-linux-amd64.tar.gz)
              echo "Verifying checksum of $tarball ($tag)"
              hash=$(awk '{print $1}' "${tarball}.sha256")
              echo "${hash}  ${tarball}" | sha256sum -c -
              tar xzf "$tarball"
              bindir=$(dirname "$(find . -type f -name spurctld | head -1)")
              test -n "$bindir" || { echo "spurctld not found in $tarball"; exit 1; }
              mkdir -p "$GITHUB_WORKSPACE/$dest"
              for b in spur spurctld spurd; do cp "$bindir/$b" "$GITHUB_WORKSPACE/$dest/$b"; done
              chmod +x "$GITHUB_WORKSPACE/$dest"/*
            )
          }

          deploy_tag="${DEPLOY_TAG:-}"
          if [ -z "$deploy_tag" ]; then
            deploy_tag=$(gh api repos/ROCm/spur/releases --jq \
              'map(select(.tag_name != "nightly"))[0].tag_name')
          fi
          upgrade_tag="${UPGRADE_TAG:-nightly}"

          fetch "$deploy_tag"  spur-bin
          fetch "$upgrade_tag" spur-bin-new

      - name: Start systemd containers on a docker network
        env:
          IMG: jrei/systemd-ubuntu:22.04
        run: |
          set -euo pipefail
          docker network create spur-ci
          docker pull "$IMG"
          for n in $NODES; do
            docker run -d --name "$n" --hostname "$n" \
              --network spur-ci \
              --privileged \
              --cgroupns=host \
              -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
              --tmpfs /run --tmpfs /run/lock --tmpfs /tmp \
              "$IMG"
          done

      - name: Wait for systemd to be ready in every container
        run: |
          set -uo pipefail
          for n in $NODES; do
            ok=""
            for i in $(seq 1 30); do
              st=$(docker exec "$n" systemctl is-system-running 2>/dev/null || true)
              case "$st" in running|degraded) ok=1; break ;; esac
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "::error::systemd never became ready in $n (last: ${st:-none})"
              exit 1
            fi
            echo "$n: systemd ready ($st)"
          done

      - name: Install in-container preflight deps (curl/tar/iproute2/python3/sudo)
        run: |
          set -euo pipefail
          for n in $NODES; do
            docker exec "$n" bash -c 'apt-get update -qq && apt-get install -y -qq curl tar iproute2 python3 sudo'
          done

      - name: Install ansible + docker connection plugin
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible-core
          ansible-galaxy collection install community.docker

      - name: deploy.yml (1 ctl + 3 agents)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci.ini playbooks/deploy.yml \
            -e spur_binary_src="$GITHUB_WORKSPACE/spur-bin" \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur

      - name: Assert all three agents registered
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            missing=""
            for a in gpu-1 gpu-2 gpu-3; do
              docker exec ctl-0 /usr/local/bin/spur show node "$a" 2>/dev/null \
                | grep -qx "NodeName=$a" || missing="$missing $a"
            done
            [ -z "$missing" ] && { echo "all three agents registered"; break; }
            sleep 2
          done
          [ -z "$missing" ] || { echo "agents still missing:$missing"; exit 1; }

      # --- spur.conf preservation test ------------------------------------
      - name: Stamp a sentinel line into spur.conf to detect overwrites
        run: |
          docker exec ctl-0 bash -c 'echo "# CI-SENTINEL" >> /opt/spur/etc/spur.conf'
          docker exec ctl-0 grep -q "CI-SENTINEL" /opt/spur/etc/spur.conf \
            || { echo "sentinel not written"; exit 1; }
          echo "sentinel written to spur.conf"

      - name: rolling_upgrade.yml (default — spur.conf must be preserved)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci.ini playbooks/rolling_upgrade.yml \
            -e spur_binary_src="$GITHUB_WORKSPACE/spur-bin-new" \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur \
            -e spur_ignore_unreachable_agents=true \
            -e spur_skip_busy_agents=true \
            -e spur_drain_wait_secs=10

      - name: Assert spur.conf was NOT overwritten (sentinel must still be present)
        run: |
          docker exec ctl-0 grep -q "CI-SENTINEL" /opt/spur/etc/spur.conf \
            && echo "PASS: spur.conf preserved (sentinel intact)" \
            || { echo "FAIL: spur.conf was overwritten — sentinel gone"; exit 1; }

      - name: rolling_upgrade.yml --overwrite-conf (spur.conf must be re-rendered)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci.ini playbooks/rolling_upgrade.yml \
            -e spur_binary_src="$GITHUB_WORKSPACE/spur-bin-new" \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur \
            -e spur_ignore_unreachable_agents=true \
            -e spur_skip_busy_agents=true \
            -e spur_drain_wait_secs=10 \
            -e spur_overwrite_conf=true

      - name: Assert spur.conf WAS overwritten (sentinel must be gone)
        run: |
          docker exec ctl-0 grep -q "CI-SENTINEL" /opt/spur/etc/spur.conf \
            && { echo "FAIL: spur.conf was not overwritten — sentinel still present"; exit 1; } \
            || echo "PASS: spur.conf re-rendered (sentinel gone)"

      # TODO(next): add_nodes.yml / remove_nodes.yml / manage_accounts.yml
      # TODO(next): healthcheck.yml (assert green) and teardown.yml

      - name: Dump logs on failure
        if: failure()
        run: |
          for n in $NODES; do
            echo "===== $n journal (spur*) ====="
            docker exec "$n" bash -c 'journalctl -u "spur*" --no-pager | tail -50' || true
          done

      - name: Teardown containers
        if: always()
        run: |
          for n in $NODES; do docker rm -f "$n" || true; done
          docker network rm spur-ci || true

  # ---------------------------------------------------------------------------
  # Job 3: techsupport/spur-techsupport.sh end-to-end over real SSH
  # ---------------------------------------------------------------------------
  techsupport:
    runs-on: ubuntu-latest
    needs: lint
    env:
      NODES: "ctl-0 gpu-1"
    steps:
      - uses: actions/checkout@v4

      - name: Download + verify Spur binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dl-spur-bin
          ( cd dl-spur-bin
            tag=$(gh api repos/ROCm/spur/releases --jq 'map(select(.tag_name != "nightly"))[0].tag_name')
            gh release download "$tag" --repo ROCm/spur \
              --pattern '*-linux-amd64.tar.gz' \
              --pattern '*-linux-amd64.tar.gz.sha256'
            tarball=$(ls *-linux-amd64.tar.gz)
            hash=$(awk '{print $1}' "${tarball}.sha256")
            echo "${hash}  ${tarball}" | sha256sum -c -
            tar xzf "$tarball"
            bindir=$(dirname "$(find . -type f -name spurctld | head -1)")
            mkdir -p "$GITHUB_WORKSPACE/spur-bin"
            for b in spur spurctld spurd; do cp "$bindir/$b" "$GITHUB_WORKSPACE/spur-bin/$b"; done
            chmod +x "$GITHUB_WORKSPACE/spur-bin"/*
          )

      - name: Start systemd containers on a docker network
        env:
          IMG: jrei/systemd-ubuntu:22.04
        run: |
          set -euo pipefail
          docker network create spur-ci-ts
          docker pull "$IMG"
          for n in $NODES; do
            docker run -d --name "$n" --hostname "$n" \
              --network spur-ci-ts \
              --privileged \
              --cgroupns=host \
              -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
              --tmpfs /run --tmpfs /run/lock --tmpfs /tmp \
              "$IMG"
          done

      - name: Wait for systemd to be ready in every container
        run: |
          set -uo pipefail
          for n in $NODES; do
            ok=""
            for i in $(seq 1 30); do
              st=$(docker exec "$n" systemctl is-system-running 2>/dev/null || true)
              case "$st" in running|degraded) ok=1; break ;; esac
              sleep 2
            done
            [ -n "$ok" ] || { echo "::error::systemd never became ready in $n"; exit 1; }
          done

      - name: Install preflight deps + sshd in every container
        run: |
          set -euo pipefail
          for n in $NODES; do
            docker exec "$n" bash -c '
              apt-get update -qq
              apt-get install -y -qq curl tar iproute2 python3 sudo openssh-server postgresql-client
              mkdir -p /root/.ssh && chmod 700 /root/.ssh
              systemctl enable --now ssh
            '
          done

      - name: Install ansible + docker connection plugin
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible-core
          ansible-galaxy collection install community.docker

      - name: deploy.yml (1 ctl + 1 agent, accounting on)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          # group_vars/ only auto-loads next to the inventory file or the playbook
          # dir; ci-techsupport.ini lives in .github/workflows/ (kept out of
          # inventory/ on purpose), so load the same defaults explicitly.
          # Password contains "@" and "#" on purpose — exercises the redaction
          # regex against more than the plain default (see the password-leak
          # assertion below).
          ansible-playbook -i ../.github/workflows/ci-techsupport.ini playbooks/deploy.yml \
            -e @inventory/group_vars/all.yml \
            -e spur_binary_src="$GITHUB_WORKSPACE/spur-bin" \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur \
            -e spur_accounting_db_password='p@ss#word'

      - name: Assert the agent registered
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            docker exec ctl-0 /usr/local/bin/spur show node gpu-1 2>/dev/null \
              | grep -qx "NodeName=gpu-1" && { echo "gpu-1 registered"; break; }
            sleep 2
          done

      - name: Wire up passwordless SSH between the containers
        run: |
          set -euo pipefail
          ssh-keygen -t ed25519 -N '' -f ts_key -q
          for n in $NODES; do
            docker exec -i "$n" bash -c 'cat >> /root/.ssh/authorized_keys && chmod 600 /root/.ssh/authorized_keys' < ts_key.pub
          done
          docker cp ts_key ctl-0:/root/.ssh/id_ed25519
          docker exec ctl-0 chmod 600 /root/.ssh/id_ed25519
          # Both containers share the spur-ci-ts network, so ctl-0 can reach
          # gpu-1 by container name; localhost covers ctl-0 collecting itself.
          docker exec ctl-0 ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 root@gpu-1 true
          docker exec ctl-0 ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 root@localhost true

      - name: Copy spur-techsupport.sh into ctl-0
        run: |
          docker cp techsupport/spur-techsupport.sh ctl-0:/usr/local/bin/spur-techsupport.sh
          docker exec ctl-0 chmod +x /usr/local/bin/spur-techsupport.sh

      - name: Default run — collects everything, must succeed with a clean manifest
        run: |
          set -euo pipefail
          docker exec -e SPUR_HOME=/opt/spur -e SPUR_INSTALL_DIR=/usr/local/bin ctl-0 spur-techsupport.sh \
            --controllers root@localhost --agents root@gpu-1 --acct-host root@localhost \
            --output /root/ts-default
          bundle=$(docker exec ctl-0 bash -c 'ls /root/ts-default/spur-techsupport-*.tar.gz')
          docker cp "ctl-0:$bundle" ts-default.tar.gz
          echo "== manifest =="
          tar xzOf ts-default.tar.gz --wildcards '*/manifest.txt'
          failures=$(tar xzOf ts-default.tar.gz --wildcards '*/manifest.txt' | grep -c '^\[FAILED\]' || true)
          [ "$failures" -eq 0 ] || { echo "::error::default run had $failures FAILED item(s)"; exit 1; }
          for expect in manifest.txt controller-localhost/spurctld.journal.log \
                        controller-localhost/raft-state.tar.gz controller-localhost/spur.conf.sanitized \
                        controller-localhost/build-fingerprint.txt cluster-state/sinfo.txt \
                        accounting/postgres-version.txt accounting/accounting-db.sql \
                        agent-gpu-1/spurd.journal.log \
                        agent-gpu-1/spurd.service agent-gpu-1/build-fingerprint.txt; do
            tar tzf ts-default.tar.gz | grep -q "$expect" || { echo "::error::missing $expect from archive"; exit 1; }
          done

      - name: Assert spur.conf's DB password (containing @ and #) was redacted, not the whole line
        run: |
          set -euo pipefail
          conf=$(tar xzOf ts-default.tar.gz --wildcards '*/controller-localhost/spur.conf.sanitized')
          echo "$conf" | grep -q 'database_url' || { echo "::error::sanitized spur.conf missing database_url entirely"; exit 1; }
          echo "$conf" | grep -qF 'p@ss#word' && { echo "::error::DB password leaked unredacted into the archive"; exit 1; }
          echo "$conf" | grep -q 'REDACTED@' || { echo "::error::database_url password was not redacted"; exit 1; }

      - name: Auto-detect the DB host when --acct-host is omitted
        run: |
          set -euo pipefail
          docker exec -e SPUR_HOME=/opt/spur -e SPUR_INSTALL_DIR=/usr/local/bin ctl-0 spur-techsupport.sh \
            --controllers root@localhost --agents root@gpu-1 \
            --output /root/ts-autodetect
          bundle=$(docker exec ctl-0 bash -c 'ls /root/ts-autodetect/spur-techsupport-*.tar.gz')
          docker cp "ctl-0:$bundle" ts-autodetect.tar.gz
          manifest=$(tar xzOf ts-autodetect.tar.gz --wildcards '*/manifest.txt')
          echo "$manifest" | grep -q '^\[OK\] accounting db: postgres version' || \
            { echo "::error::DB host auto-detection failed to find postgresql on the controller"; echo "$manifest"; exit 1; }

      - name: prefix[N-M] range syntax resolves to the real host
        run: |
          set -euo pipefail
          docker exec -e SPUR_HOME=/opt/spur -e SPUR_INSTALL_DIR=/usr/local/bin ctl-0 spur-techsupport.sh \
            --controllers root@localhost --agents 'root@gpu-[1-1]' --acct-host root@localhost \
            --output /root/ts-range
          bundle=$(docker exec ctl-0 bash -c 'ls /root/ts-range/spur-techsupport-*.tar.gz')
          docker cp "ctl-0:$bundle" ts-range.tar.gz
          tar tzf ts-range.tar.gz | grep -q 'agent-gpu-1/spurd.journal.log' || \
            { echo "::error::root@gpu-[1-1] did not expand to root@gpu-1"; exit 1; }

      - name: --skip-db --skip-raft run — those items must be absent and marked SKIPPED
        run: |
          set -euo pipefail
          docker exec -e SPUR_HOME=/opt/spur -e SPUR_INSTALL_DIR=/usr/local/bin ctl-0 spur-techsupport.sh \
            --controllers root@localhost --agents root@gpu-1 --acct-host root@localhost \
            --skip-db --skip-raft --output /root/ts-skip
          bundle=$(docker exec ctl-0 bash -c 'ls /root/ts-skip/spur-techsupport-*.tar.gz')
          docker cp "ctl-0:$bundle" ts-skip.tar.gz
          tar tzf ts-skip.tar.gz | grep -q 'raft-state.tar.gz' && { echo "::error::raft archive present despite --skip-raft"; exit 1; }
          tar tzf ts-skip.tar.gz | grep -qE 'accounting/(postgres-version.txt|accounting-db.sql)' && { echo "::error::db info present despite --skip-db"; exit 1; }
          manifest=$(tar xzOf ts-skip.tar.gz --wildcards '*/manifest.txt')
          echo "$manifest" | grep -q '\[SKIPPED\].*raft state.*--skip-raft' || { echo "::error::manifest missing raft SKIPPED entry"; exit 1; }
          echo "$manifest" | grep -q '\[SKIPPED\] accounting db (--skip-db)' || { echo "::error::manifest missing db SKIPPED entry"; exit 1; }

      - name: Unreachable agent — fails closed by default, --partial still packages
        run: |
          set -euo pipefail
          if docker exec -e SPUR_HOME=/opt/spur -e SPUR_INSTALL_DIR=/usr/local/bin ctl-0 spur-techsupport.sh \
              --controllers root@localhost --agents root@unreachable-host-ts \
              --acct-host root@localhost --output /root/ts-fail; then
            echo "::error::expected non-zero exit on an unreachable agent without --partial"; exit 1
          fi
          docker exec ctl-0 bash -c 'ls /root/ts-fail/spur-techsupport-*.tar.gz 2>/dev/null' && \
            { echo "::error::archive must not be written on a failed collection without --partial"; exit 1; }

          docker exec -e SPUR_HOME=/opt/spur -e SPUR_INSTALL_DIR=/usr/local/bin ctl-0 spur-techsupport.sh \
            --controllers root@localhost --agents root@unreachable-host-ts \
            --acct-host root@localhost --partial --output /root/ts-partial
          bundle=$(docker exec ctl-0 bash -c 'ls /root/ts-partial/spur-techsupport-*.tar.gz')
          docker cp "ctl-0:$bundle" ts-partial.tar.gz
          tar xzOf ts-partial.tar.gz --wildcards '*/manifest.txt' | grep -q '\[FAILED\].*unreachable-host-ts' || \
            { echo "::error::--partial archive missing the expected FAILED entry"; exit 1; }

      - name: Dump logs on failure
        if: failure()
        run: |
          for n in $NODES; do
            echo "===== $n journal (spur*) ====="
            docker exec "$n" bash -c 'journalctl -u "spur*" --no-pager | tail -50' || true
          done

      - name: Teardown containers
        if: always()
        run: |
          for n in $NODES; do docker rm -f "$n" || true; done
          docker network rm spur-ci-ts || true
