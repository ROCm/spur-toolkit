# ============================================================================
# FIRST DRAFT — playbook integration test for PRs.
#
# Brings up a 6-node cluster of systemd-enabled Docker containers on a single
# GitHub-hosted runner, downloads pre-built Spur binaries from a ROCm/spur
# release, and runs deploy.yml against 3 controllers + 2 agents + 1 accounting
# node. Rolling upgrade and the day-2 playbooks are stubbed as TODOs to add once
# deploy is green.
#
# Status: EXPERIMENTAL. Temporarily runs on pull_request for fast iteration on
# the systemd-in-Docker specifics (cgroup v2 on ubuntu-latest) and the ROCm/spur
# build invocation. Once it is green a few times in a row, decide whether to keep
# it gating PRs or narrow to workflow_dispatch / a schedule.
# ============================================================================
name: playbook-ci

on:
  workflow_dispatch: {}
  # push trigger scoped to the CI branch so the workflow runs on the fork during
  # iteration (pull_request runs in the BASE repo, which doesn't have this file
  # on its default branch yet). Remove this push block before merging.
  push:
    branches:
      - ci/playbook-integration-tests
  pull_request:
    paths:
      - 'ansible/**'
      - '.github/workflows/playbook-ci.yml'

concurrency:
  group: playbook-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ansible + lint
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible-core ansible-lint
          ansible-galaxy collection install community.docker
      - name: Syntax check all playbooks
        working-directory: ansible
        run: |
          # Some playbooks template their `hosts:` from a runtime -e var (e.g.
          # add_nodes.yml/remove_nodes.yml need new_nodes/... ) and --syntax-check
          # errors on an empty hosts pattern. Pass harmless dummy values so the
          # syntax check can parse them; these never connect to anything.
          DUMMY="-e new_nodes=ctl-0 -e remove_nodes=ctl-0"
          for pb in playbooks/*.yml; do
            echo "== syntax-check $pb =="
            ansible-playbook --syntax-check -i inventory/ci.ini $DUMMY "$pb" || exit 1
          done

  deploy-6node:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      # --- Fetch pre-built Spur binaries from ROCm/spur --------------------
      # Two sets, to exercise a real rolling upgrade between distinct builds:
      #   spur-bin      = INITIAL deploy version  (latest published release)
      #   spur-bin-new  = UPGRADE target version  (latest nightly build)
      # Both are post spurdbd-merge, so both deploy cleanly with the current
      # roles. (v0.3.0 and earlier are pre-merge and would fail on deploy, so
      # "latest-1 release" is NOT a valid initial version today — we use the
      # latest release for deploy and the nightly for the upgrade instead.)
      # Each download verifies the tarball's sha256.
      - name: Download + verify Spur binaries (deploy = release, upgrade = nightly)
        env:
          GH_TOKEN: ${{ github.token }}
          # Pin either explicitly, or leave empty for the documented defaults:
          #   DEPLOY_TAG  empty -> newest non-nightly release
          #   UPGRADE_TAG empty -> "nightly"
          DEPLOY_TAG: ""
          UPGRADE_TAG: ""
        run: |
          set -euo pipefail

          fetch() {  # <tag> <dest-dir>
            local tag="$1" dest="$2" d
            d="dl-$dest"
            mkdir -p "$d"
            ( cd "$d"
              gh release download "$tag" --repo ROCm/spur \
                --pattern '*-linux-amd64.tar.gz' \
                --pattern '*-linux-amd64.tar.gz.sha256'
              tarball=$(ls *-linux-amd64.tar.gz)
              echo "Verifying checksum of $tarball ($tag)"
              hash=$(awk '{print $1}' "${tarball}.sha256")
              echo "${hash}  ${tarball}" | sha256sum -c -
              tar xzf "$tarball"
              bindir=$(dirname "$(find . -type f -name spurctld | head -1)")
              test -n "$bindir" || { echo "spurctld not found in $tarball"; exit 1; }
              mkdir -p "$GITHUB_WORKSPACE/$dest"
              for b in spur spurctld spurd; do cp "$bindir/$b" "$GITHUB_WORKSPACE/$dest/$b"; done
              chmod +x "$GITHUB_WORKSPACE/$dest"/*
            )
          }

          deploy_tag="${DEPLOY_TAG:-}"
          if [ -z "$deploy_tag" ]; then
            deploy_tag=$(gh api repos/ROCm/spur/releases --jq \
              'map(select(.tag_name != "nightly"))[0].tag_name')
          fi
          upgrade_tag="${UPGRADE_TAG:-nightly}"

          echo "Deploy version : $deploy_tag  -> spur-bin"
          echo "Upgrade version: $upgrade_tag -> spur-bin-new"
          fetch "$deploy_tag"  spur-bin
          fetch "$upgrade_tag" spur-bin-new

          echo "== deploy binaries =="; ls -l "$GITHUB_WORKSPACE/spur-bin"
          echo "== upgrade binaries =="; ls -l "$GITHUB_WORKSPACE/spur-bin-new"

      # --- Bring up the 6-node systemd-container cluster -------------------
      - name: Start 6 systemd containers on a docker network
        env:
          NODES: "ctl-0 ctl-1 ctl-2 gpu-1 gpu-2 acct-0"
          IMG: jrei/systemd-ubuntu:22.04
        run: |
          set -euo pipefail
          docker network create spur-ci
          docker pull "$IMG"
          # Flags per systemd-in-Docker on a cgroup v2 host (ubuntu-latest):
          #   --privileged --cgroupns=host, /sys/fs/cgroup mounted :rw (NOT :ro,
          #   which is a cgroup v1 convention), and tmpfs for /run and /tmp.
          # The image sets CMD=/sbin/init itself, so no --entrypoint is needed.
          # We use explicit `docker run` rather than the Actions `container:`
          # option, which has a known bug initializing systemd entrypoints
          # (github community discussion #153131).
          for n in $NODES; do
            docker run -d --name "$n" --hostname "$n" \
              --network spur-ci \
              --privileged \
              --cgroupns=host \
              -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
              --tmpfs /run --tmpfs /run/lock --tmpfs /tmp \
              "$IMG"
          done

      - name: Wait for systemd to be ready in every container
        env:
          NODES: "ctl-0 ctl-1 ctl-2 gpu-1 gpu-2 acct-0"
        run: |
          set -uo pipefail
          for n in $NODES; do
            ok=""
            for i in $(seq 1 30); do
              # "running" or "degraded" both mean systemd finished booting; only
              # keep waiting while it is still "starting" / "initializing".
              st=$(docker exec "$n" systemctl is-system-running 2>/dev/null || true)
              case "$st" in
                running|degraded) ok=1; break ;;
              esac
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "::error::systemd never became ready in $n (last: ${st:-none})"
              docker exec "$n" systemctl status --no-pager || true
              exit 1
            fi
            echo "$n: systemd ready ($st)"
          done

      - name: Install in-container preflight deps (curl/tar/iproute2/python3/sudo)
        env:
          NODES: "ctl-0 ctl-1 ctl-2 gpu-1 gpu-2 acct-0"
        run: |
          set -euo pipefail
          # sudo: Ansible become defaults to sudo; the accounting role uses
          # become_user: postgres, which needs it. The minimal systemd image
          # doesn't ship sudo/curl/tar.
          for n in $NODES; do
            docker exec "$n" bash -c 'apt-get update -qq && apt-get install -y -qq curl tar iproute2 python3 sudo'
          done

      - name: Install ansible + docker connection plugin
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible-core
          ansible-galaxy collection install community.docker

      # --- Run deploy.yml against the 6 nodes ------------------------------
      - name: deploy.yml (3 ctl + 2 agent + 1 acct)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci.ini playbooks/deploy.yml \
            -e spur_binary_src="$GITHUB_WORKSPACE/spur-bin" \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur

      # --- Assert the cluster actually works -------------------------------
      - name: Assert both agents registered
        run: |
          set -euo pipefail
          # Poll: agents may register a beat apart after their spurd starts.
          for i in $(seq 1 30); do
            missing=""
            for a in gpu-1 gpu-2; do
              docker exec ctl-0 /usr/local/bin/spur show node "$a" 2>/dev/null \
                | grep -qx "NodeName=$a" || missing="$missing $a"
            done
            [ -z "$missing" ] && { echo "both agents registered"; break; }
            sleep 2
          done
          echo "== spur nodes =="
          docker exec ctl-0 /usr/local/bin/spur nodes
          [ -z "$missing" ] || { echo "agents still missing:$missing"; exit 1; }

      - name: Assert a job runs to completion
        run: |
          set -euo pipefail
          docker exec ctl-0 bash -lc '
            set -e
            cat > /tmp/ci-job.sh <<EOF
          #!/bin/bash
          #SBATCH --job-name=ci-smoke
          echo "ran on \$(hostname)"
          EOF
            jid=$(/usr/local/bin/spur submit /tmp/ci-job.sh | grep -oE "[0-9]+" | head -1)
            echo "submitted job $jid"
            for i in $(seq 1 30); do
              st=$(/usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE "JobState=[A-Z]+" | head -1 | cut -d= -f2)
              case "$st" in
                COMPLETED) echo "job $jid COMPLETED"; exit 0 ;;
                FAILED|CANCELLED|TIMEOUT|NODE_FAIL) echo "job $jid ended $st"; exit 1 ;;
              esac
              sleep 2
            done
            echo "job $jid did not complete in time (last: ${st:-none})"; exit 1
          '

      # --- Rolling upgrade to the newer build ------------------------------
      - name: Record pre-upgrade state (version + accounting target)
        run: |
          set -euo pipefail
          echo "PRE_VERSION=$(docker exec ctl-0 /usr/local/bin/spur --version 2>/dev/null || true)"
          # The accounting host in the live spur.conf must survive the upgrade.
          pre_db=$(docker exec ctl-0 bash -lc "grep -oE 'postgresql://[^\"]+' /opt/spur/etc/spur.conf | head -1")
          echo "pre-upgrade database_url: $pre_db"
          echo "$pre_db" | grep -q '@acct-0:' || { echo "expected database_url to point at acct-0"; exit 1; }

      - name: rolling_upgrade.yml (to nightly build)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci.ini playbooks/rolling_upgrade.yml \
            -e spur_binary_src="$GITHUB_WORKSPACE/spur-bin-new" \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur

      - name: Assert cluster healthy + accounting preserved after upgrade
        run: |
          set -euo pipefail
          echo "== spur nodes after upgrade =="
          docker exec ctl-0 /usr/local/bin/spur nodes
          # Both agents must still be registered and resumed (not left DRAINED).
          for i in $(seq 1 30); do
            missing=""
            for a in gpu-1 gpu-2; do
              docker exec ctl-0 /usr/local/bin/spur show node "$a" 2>/dev/null \
                | grep -qx "NodeName=$a" || missing="$missing $a"
            done
            [ -z "$missing" ] && break
            sleep 2
          done
          [ -z "$missing" ] || { echo "agents missing after upgrade:$missing"; exit 1; }
          # database_url must still point at acct-0 (preservation fix) — a
          # rolling upgrade must never silently repoint accounting.
          post_db=$(docker exec ctl-0 bash -lc "grep -oE 'postgresql://[^\"]+' /opt/spur/etc/spur.conf | head -1")
          echo "post-upgrade database_url: $post_db"
          echo "$post_db" | grep -q '@acct-0:' || { echo "database_url no longer points at acct-0!"; exit 1; }
          # A job still runs after the upgrade.
          docker exec ctl-0 bash -lc '
            set -e
            printf "#!/bin/bash\n#SBATCH --job-name=post-upgrade\necho ok on \$(hostname)\n" > /tmp/ci-post.sh
            jid=$(/usr/local/bin/spur submit /tmp/ci-post.sh | grep -oE "[0-9]+" | head -1)
            for i in $(seq 1 30); do
              st=$(/usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE "JobState=[A-Z]+" | head -1 | cut -d= -f2)
              [ "$st" = COMPLETED ] && { echo "post-upgrade job $jid COMPLETED"; exit 0; }
              case "$st" in FAILED|CANCELLED|TIMEOUT|NODE_FAIL) echo "job ended $st"; exit 1 ;; esac
              sleep 2
            done
            echo "post-upgrade job did not complete"; exit 1
          '

      # TODO(next): add_nodes.yml / remove_nodes.yml / manage_accounts.yml
      # TODO(next): healthcheck.yml (assert green) and teardown.yml

      - name: Dump logs on failure
        if: failure()
        run: |
          for n in ctl-0 ctl-1 ctl-2 gpu-1 gpu-2 acct-0; do
            echo "===== $n journal (spur*) ====="
            docker exec "$n" bash -c 'journalctl -u "spur*" --no-pager | tail -50' || true
          done

      - name: Teardown containers
        if: always()
        run: |
          for n in ctl-0 ctl-1 ctl-2 gpu-1 gpu-2 acct-0; do docker rm -f "$n" || true; done
          docker network rm spur-ci || true
