# ============================================================================
# Playbook integration tests — five parallel jobs, each with its own cluster.
#
# integration-resilience:
#   initial deploy with one agent unreachable (spur_ignore_unreachable_agents)
#   + deploy.yml's default busy-agent behavior (drain-then-force-kill, and the
#   spur_skip_busy_agents=true opt-out) + spur_controller_upgrade_order
#   validation + rolling upgrade's default refusal on a busy node, covering
#   all three agent states, + force upgrade with OS-level kill verification
#   (bare process AND Docker container)
#
# integration-conf:
#   deploy + spur.conf preservation on BOTH controller and agent (default:
#   preserve, opt-in: overwrite), and the two paths render an identical file
#
# integration-day2:
#   remove_nodes.yml's busy-node job-safety model (refuse by default,
#   spur_skip_busy_agents=true, spur_force_remove_busy_nodes=true), plus
#   teardown.yml's disruptive-by-default/opt-in-drain behavior (no flags:
#   stops a busy agent immediately and sweeps its job cgroup clean, no wait;
#   spur_skip_busy_agents=true or spur_force_teardown_busy_agents=true opts
#   back into draining first)
#
# integration-ha-mesh:
#   3-controller HA cluster over a real WireGuard mesh (SPUR-195, PR #23) — the
#   only job exercising spur_transport=wireguard AND >1 controller. Asserts the
#   positional mesh addressing (.1 bootstrap / .2/.3 joiners), full controller
#   <->controller connectivity (not hub-and-spoke), Raft quorum over the mesh,
#   spur.conf's HA peers/node_id, the remove_nodes.yml / add_nodes.yml
#   all-controllers WG peer sync (no ghost peer; regenerated key refreshed on
#   every controller), and identity/reboot persistence (idempotent redeploy does
#   not rotate keys; wg-quick down/up preserves the key + full peer set). Needs
#   `spur net mesh`/`remove-peer` from ROCm/spur#719, so it pulls the nightly
#   binaries (the last tagged release predates that merge). Requires the
#   wireguard kernel module: modprobe'd on the runner and bind-mounted into the
#   containers so modinfo/wg-quick see it.
#
# techsupport:
#   deploy, then exercise techsupport/spur-techsupport.sh end-to-end over real
#   SSH (the only job that installs sshd in the containers) — default run,
#   skip-flags, and the fail/--partial paths.
#
# Single-controller HA/accounting/login-node coverage lives in deploy.yml's own
# path. manage_accounts.yml / healthcheck.yml are still TODO.
# ============================================================================
name: playbook-ci

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'ansible/**'
      - 'techsupport/**'
      - '.github/workflows/playbook-ci.yml'
  pull_request:
    paths:
      - 'ansible/**'
      - 'techsupport/**'
      - '.github/workflows/playbook-ci.yml'

concurrency:
  group: playbook-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ansible + lint
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible-core ansible-lint
          ansible-galaxy collection install community.docker
      - name: Syntax check all playbooks
        working-directory: ansible
        run: |
          # Some playbooks template their `hosts:` from a runtime -e var (e.g.
          # add_nodes.yml/remove_nodes.yml need new_nodes/... ) and --syntax-check
          # errors on an empty hosts pattern. Pass harmless dummy values so the
          # syntax check can parse them; these never connect to anything.
          DUMMY="-e new_nodes=ctl-0 -e remove_nodes=ctl-0"
          for pb in playbooks/*.yml; do
            echo "== syntax-check $pb =="
            ansible-playbook --syntax-check -i inventory/ci.ini $DUMMY "$pb" || exit 1
          done

  # ---------------------------------------------------------------------------
  # Job 1: rolling upgrade resilience + force upgrade + container kill
  # ---------------------------------------------------------------------------
  integration-resilience:
    runs-on: ubuntu-latest
    needs: lint
    env:
      NODES: "ctl-0 gpu-1 gpu-2 gpu-3"
    steps:
      - uses: actions/checkout@v4

      - name: Download + verify Spur binaries (deploy = release, upgrade = nightly)
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_TAG: ""
          UPGRADE_TAG: ""
        run: |
          set -euo pipefail

          fetch() {
            local tag="$1" dest="$2" d
            d="dl-$dest"
            mkdir -p "$d"
            ( cd "$d"
              gh release download "$tag" --repo ROCm/spur \
                --pattern '*-linux-amd64.tar.gz' \
                --pattern '*-linux-amd64.tar.gz.sha256'
              tarball=$(ls *-linux-amd64.tar.gz)
              echo "Verifying checksum of $tarball ($tag)"
              hash=$(awk '{print $1}' "${tarball}.sha256")
              echo "${hash}  ${tarball}" | sha256sum -c -
              tar xzf "$tarball"
              bindir=$(dirname "$(find . -type f -name spurctld | head -1)")
              test -n "$bindir" || { echo "spurctld not found in $tarball"; exit 1; }
              mkdir -p "$GITHUB_WORKSPACE/$dest"
              for b in spur spurctld spurd; do cp "$bindir/$b" "$GITHUB_WORKSPACE/$dest/$b"; done
              plugin=$(find . -path '*/lib/spur/spur_mpi_pmix.so' -o -name spur_mpi_pmix.so 2>/dev/null | head -1)
              if [ -n "$plugin" ] && [ -f "$plugin" ]; then
                cp "$plugin" "$GITHUB_WORKSPACE/$dest/spur_mpi_pmix.so"
              fi
              chmod +x "$GITHUB_WORKSPACE/$dest"/*
            )
          }

          deploy_tag="${DEPLOY_TAG:-}"
          if [ -z "$deploy_tag" ]; then
            deploy_tag=$(gh api repos/ROCm/spur/releases --jq \
              'map(select(.tag_name != "nightly"))[0].tag_name')
          fi
          upgrade_tag="${UPGRADE_TAG:-nightly}"

          echo "Deploy version : $deploy_tag  -> spur-bin"
          echo "Upgrade version: $upgrade_tag -> spur-bin-new"
          fetch "$deploy_tag"  spur-bin
          fetch "$upgrade_tag" spur-bin-new

      - name: Start systemd containers on a docker network
        env:
          IMG: jrei/systemd-ubuntu:22.04
        run: |
          set -euo pipefail
          docker network create spur-ci
          docker pull "$IMG"
          for n in $NODES; do
            docker run -d --name "$n" --hostname "$n" \
              --network spur-ci \
              --privileged \
              --cgroupns=host \
              -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
              --tmpfs /run --tmpfs /run/lock --tmpfs /tmp \
              "$IMG"
          done

      - name: Wait for systemd to be ready in every container
        run: |
          set -uo pipefail
          for n in $NODES; do
            ok=""
            for i in $(seq 1 30); do
              st=$(docker exec "$n" systemctl is-system-running 2>/dev/null || true)
              case "$st" in running|degraded) ok=1; break ;; esac
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "::error::systemd never became ready in $n (last: ${st:-none})"
              docker exec "$n" systemctl status --no-pager || true
              exit 1
            fi
            echo "$n: systemd ready ($st)"
          done

      - name: Install in-container preflight deps (curl/tar/iproute2/python3/sudo)
        run: |
          set -euo pipefail
          for n in $NODES; do
            docker exec "$n" bash -c 'apt-get update -qq && apt-get install -y -qq curl tar iproute2 python3 sudo'
          done

      - name: Create a non-root job-submission user in every container
        # Newer spurd builds refuse a job submitted by uid 0 unless
        # [auth] allow_root_jobs=true (which we don't set) — submit as this
        # user instead everywhere a job is submitted in this workflow.
        run: |
          set -euo pipefail
          for n in $NODES; do
            docker exec "$n" useradd -m -s /bin/bash ciuser
          done

      - name: Install Docker inside gpu-3 (for container kill test)
        run: |
          set -euo pipefail
          # Install Docker CE inside the gpu-3 systemd container so we can
          # submit a spur job that launches a Docker container, then assert
          # the container is killed by the force-upgrade playbook.
          docker exec gpu-3 bash -c '
            apt-get install -y -qq ca-certificates curl gnupg lsb-release
            install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
              | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
            echo "deb [arch=$(dpkg --print-architecture) \
              signed-by=/etc/apt/keyrings/docker.gpg] \
              https://download.docker.com/linux/ubuntu \
              $(lsb_release -cs) stable" \
              > /etc/apt/sources.list.d/docker.list
            apt-get update -qq
            apt-get install -y -qq docker-ce docker-ce-cli containerd.io
            systemctl enable --now docker
          '
          # Wait for Docker daemon to be ready inside gpu-3
          for i in $(seq 1 30); do
            docker exec gpu-3 docker info &>/dev/null && break
            sleep 2
          done
          docker exec gpu-3 docker info --format '{{.ServerVersion}}'
          # spurd setuid/setgid/setgroups's to the submitting user before
          # running the job (see privdrop.rs) — the force-docker test job's
          # own `docker run` now executes as ciuser, not root, so it needs
          # docker group membership on the host that actually runs it.
          docker exec gpu-3 usermod -aG docker ciuser

      - name: Install ansible + docker connection plugin
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible-core
          ansible-galaxy collection install community.docker

      - name: Simulate gpu-3 unreachable before the initial deploy
        run: docker stop gpu-3

      - name: deploy.yml with spur_ignore_unreachable_agents=true (gpu-3 down)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci.ini playbooks/deploy.yml \
            -e spur_binary_src="$GITHUB_WORKSPACE/spur-bin" \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur \
            -e spur_ignore_unreachable_agents=true \
            -e spur_verify_enabled=true \
            -e spur_verify_submit_user=ciuser

      - name: Assert gpu-1/gpu-2 registered and gpu-3 was skipped, not registered
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            missing=""
            for a in gpu-1 gpu-2; do
              docker exec ctl-0 /usr/local/bin/spur show node "$a" 2>/dev/null \
                | grep -qx "NodeName=$a" || missing="$missing $a"
            done
            [ -z "$missing" ] && break
            sleep 2
          done
          echo "== spur nodes (gpu-3 must be absent) =="
          docker exec ctl-0 /usr/local/bin/spur nodes
          [ -z "$missing" ] || { echo "agents still missing:$missing"; exit 1; }
          docker exec ctl-0 /usr/local/bin/spur show node gpu-3 2>/dev/null \
            | grep -qx "NodeName=gpu-3" \
            && { echo "FAIL: gpu-3 should not have registered while unreachable"; exit 1; }
          echo "PASS: gpu-3 correctly skipped"

      - name: Bring gpu-3 back and re-deploy (all four nodes healthy)
        run: |
          set -euo pipefail
          docker start gpu-3
          for i in $(seq 1 30); do
            st=$(docker exec gpu-3 systemctl is-system-running 2>/dev/null || true)
            case "$st" in running|degraded) break ;; esac
            sleep 2
          done
          docker exec gpu-3 systemctl enable --now docker

      - name: deploy.yml (1 ctl + 3 agents)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci.ini playbooks/deploy.yml \
            -e spur_binary_src="$GITHUB_WORKSPACE/spur-bin" \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur \
            -e spur_verify_enabled=true \
            -e spur_verify_submit_user=ciuser

      - name: Assert all three agents registered
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            missing=""
            for a in gpu-1 gpu-2 gpu-3; do
              docker exec ctl-0 /usr/local/bin/spur show node "$a" 2>/dev/null \
                | grep -qx "NodeName=$a" || missing="$missing $a"
            done
            [ -z "$missing" ] && { echo "all three agents registered"; break; }
            sleep 2
          done
          echo "== spur nodes =="
          docker exec ctl-0 /usr/local/bin/spur nodes
          [ -z "$missing" ] || { echo "agents still missing:$missing"; exit 1; }

      - name: Assert MPI plugin installed on agents
        run: |
          set -euo pipefail
          for a in gpu-1 gpu-2 gpu-3; do
            docker exec "$a" test -f /usr/lib/spur/spur_mpi_pmix.so
          done
          echo "MPI plugin present on all agents"

      - name: Assert spur CLI works locally on agents under direct transport
        run: |
          set -euo pipefail
          for a in gpu-1 gpu-2 gpu-3; do
            docker exec "$a" test -x /usr/local/bin/spur
            docker exec "$a" bash -c '[ "$(readlink /usr/local/bin/squeue)" = /usr/local/bin/spur ]'
            # docker exec skips PAM's /etc/environment sourcing a real SSH login
            # shell does — set -a so `source` exports to the spur child process too.
            # Diagnostic only (never gates): the real assertion is the spur
            # invocation below, checked by its actual output, not this exit code.
            docker exec "$a" bash -c 'set -a; source /etc/environment; set +a; env | grep ^SPUR_CONTROLLER_ADDR' \
              || echo "(SPUR_CONTROLLER_ADDR not set on $a)"
            # `spur nodes` (plural) prints a sinfo-style table with no NodeName=
            # field — show node <name> matches the grep pattern used elsewhere here.
            out=$(docker exec "$a" bash -c "set -a; source /etc/environment; set +a; /usr/local/bin/spur show node $a" 2>&1)
            echo "$out" | grep -qx "NodeName=$a" \
              || { echo "FAIL: spur CLI on $a could not find its own node entry"; echo "--- output ---"; echo "$out"; exit 1; }
          done
          echo "spur CLI present and working on all agents (direct transport)"

      - name: Assert a job runs to completion
        run: |
          set -euo pipefail
          docker exec -u ciuser -w /home/ciuser ctl-0 bash -c '
            set -e
            cat > /tmp/ci-job.sh <<EOF
          #!/bin/bash
          #SBATCH --job-name=ci-smoke
          echo "ran on \$(hostname)"
          EOF
            jid=$(/usr/local/bin/spur submit /tmp/ci-job.sh | grep -oE "[0-9]+" | head -1)
            echo "submitted job $jid"
            for i in $(seq 1 30); do
              st=$(/usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE "JobState=[A-Z]+" | head -1 | cut -d= -f2)
              case "$st" in
                COMPLETED) echo "job $jid COMPLETED"; exit 0 ;;
                FAILED|CANCELLED|TIMEOUT|NODE_FAIL) echo "job $jid ended $st"; exit 1 ;;
              esac
              sleep 2
            done
            echo "job $jid did not complete in time (last: ${st:-none})"; exit 1
          '

      # --- deploy.yml busy-agent job safety (drain, then force by default) --
      - name: Submit a busy job on gpu-1 for the deploy.yml default-force test
        run: |
          set -euo pipefail
          docker exec -u ciuser -w /home/ciuser ctl-0 bash -c '
            set -e
            printf "#!/bin/bash\n#SBATCH --job-name=deploy-default-busy\nsleep 600\n" > /tmp/ci-deploy-busy.sh
            jid=$(/usr/local/bin/spur submit -w gpu-1 /tmp/ci-deploy-busy.sh | grep -oE "[0-9]+" | head -1)
            echo "$jid" > /tmp/ci-deploy-busy.jid
            for i in $(seq 1 30); do
              st=$(/usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE "JobState=[A-Z]+" | head -1 | cut -d= -f2)
              [ "$st" = RUNNING ] && { echo "busy job $jid RUNNING on gpu-1"; exit 0; }
              sleep 1
            done
            echo "busy job $jid never reached RUNNING"; exit 1
          '

      - name: deploy.yml default (must drain, kill the busy job, and restart gpu-1)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci.ini playbooks/deploy.yml \
            -e spur_binary_src="$GITHUB_WORKSPACE/spur-bin" \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur \
            -e spur_drain_wait_secs=10 \
            -e spur_verify_enabled=false

      - name: Assert deploy.yml's default force-killed the busy job and gpu-1 re-registered
        run: |
          set -euo pipefail
          jid=$(docker exec ctl-0 cat /tmp/ci-deploy-busy.jid)
          st=$(docker exec ctl-0 /usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE 'JobState=[A-Z_]+' | head -1 | cut -d= -f2)
          echo "job $jid state after deploy.yml: $st"
          [ "$st" = RUNNING ] && { echo "FAIL: job still RUNNING — deploy.yml should force-kill a busy agent by default"; exit 1; }
          found=""
          for i in $(seq 1 30); do
            docker exec ctl-0 /usr/local/bin/spur show node gpu-1 2>/dev/null \
              | grep -qx "NodeName=gpu-1" && { found=1; break; }
            sleep 2
          done
          [ -n "$found" ] || { echo "FAIL: gpu-1 did not re-register after deploy.yml"; exit 1; }
          echo "PASS: default deploy.yml force-killed the busy job and gpu-1 re-registered"

      - name: Submit another busy job on gpu-1 for the spur_skip_busy_agents=true test
        run: |
          set -euo pipefail
          docker exec -u ciuser -w /home/ciuser ctl-0 bash -c '
            set -e
            printf "#!/bin/bash\n#SBATCH --job-name=deploy-skip-busy\nsleep 600\n" > /tmp/ci-deploy-skip.sh
            jid=$(/usr/local/bin/spur submit -w gpu-1 /tmp/ci-deploy-skip.sh | grep -oE "[0-9]+" | head -1)
            echo "$jid" > /tmp/ci-deploy-skip.jid
            for i in $(seq 1 30); do
              st=$(/usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE "JobState=[A-Z]+" | head -1 | cut -d= -f2)
              [ "$st" = RUNNING ] && { echo "busy job $jid RUNNING on gpu-1"; exit 0; }
              sleep 1
            done
            echo "busy job $jid never reached RUNNING"; exit 1
          '

      - name: deploy.yml spur_skip_busy_agents=true (must leave gpu-1 and its job untouched)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci.ini playbooks/deploy.yml \
            -e spur_binary_src="$GITHUB_WORKSPACE/spur-bin" \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur \
            -e spur_drain_wait_secs=10 \
            -e spur_skip_busy_agents=true \
            -e spur_verify_enabled=false

      - name: Assert spur_skip_busy_agents=true left the job on gpu-1 running
        run: |
          set -euo pipefail
          jid=$(docker exec ctl-0 cat /tmp/ci-deploy-skip.jid)
          st=$(docker exec ctl-0 /usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE 'JobState=[A-Z_]+' | head -1 | cut -d= -f2)
          echo "job $jid state after deploy.yml --skip-busy: $st"
          [ "$st" = RUNNING ] || { echo "FAIL: job should still be RUNNING (spur_skip_busy_agents=true)"; exit 1; }
          echo "PASS: spur_skip_busy_agents=true left the busy job on gpu-1 untouched"

      - name: Clean up gpu-1's job so later steps see an idle node
        run: |
          set -euo pipefail
          jid=$(docker exec ctl-0 cat /tmp/ci-deploy-skip.jid)
          docker exec ctl-0 /usr/local/bin/spur scancel "$jid" || true
          docker exec ctl-0 /usr/local/bin/scontrol update NodeName=gpu-1 State=RESUME || true
          for i in $(seq 1 30); do
            st=$(docker exec ctl-0 /usr/local/bin/spur show node gpu-1 2>/dev/null | grep -oE 'State=[A-Z]+' | head -1 | cut -d= -f2)
            [ "$st" = IDLE ] && break
            sleep 2
          done

      - name: rolling_upgrade.yml spur_controller_upgrade_order validation (must fail fast on an unknown controller name)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          if ansible-playbook -i inventory/ci.ini playbooks/rolling_upgrade.yml \
              -e spur_binary_src="$GITHUB_WORKSPACE/spur-bin-new" \
              -e spur_install_dir=/usr/local/bin \
              -e spur_home=/opt/spur \
              -e spur_controller_upgrade_order=ctl-does-not-exist; then
            echo "FAIL: rolling_upgrade.yml should have refused an unknown controller name in spur_controller_upgrade_order"; exit 1
          else
            echo "PASS: rolling_upgrade.yml validated spur_controller_upgrade_order before touching any host"
          fi

      # --- Pass 1: resilience (3 agent states in one run) ------------------
      - name: Simulate gpu-2 unreachable and gpu-3 busy
        run: |
          set -euo pipefail
          docker stop gpu-2
          docker exec -u ciuser -w /home/ciuser ctl-0 bash -c '
            set -e
            printf "#!/bin/bash\n#SBATCH --job-name=busy\nsleep 600\n" > /tmp/ci-busy.sh
            jid=$(/usr/local/bin/spur submit -w gpu-3 /tmp/ci-busy.sh | grep -oE "[0-9]+" | head -1)
            echo "$jid" > /tmp/ci-busy.jid
            for i in $(seq 1 30); do
              st=$(/usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE "JobState=[A-Z]+" | head -1 | cut -d= -f2)
              [ "$st" = RUNNING ] && { echo "busy job $jid RUNNING on gpu-3"; exit 0; }
              sleep 1
            done
            echo "busy job $jid never reached RUNNING (last: ${st:-none})"; exit 1
          '

      - name: rolling_upgrade.yml default (must refuse on gpu-3's busy job, no skip/force set)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          if ansible-playbook -i inventory/ci.ini playbooks/rolling_upgrade.yml \
              -e spur_binary_src="$GITHUB_WORKSPACE/spur-bin-new" \
              -e spur_install_dir=/usr/local/bin \
              -e spur_home=/opt/spur \
              -e spur_drain_wait_secs=10 \
              --limit gpu-3; then
            echo "FAIL: rolling_upgrade.yml should have refused on a busy node with no skip/force set"; exit 1
          else
            echo "PASS: rolling_upgrade.yml refused by default on a busy node"
          fi

      - name: Assert gpu-3's busy job is still running after the refused rolling upgrade
        run: |
          set -euo pipefail
          jid=$(docker exec ctl-0 cat /tmp/ci-busy.jid)
          st=$(docker exec ctl-0 /usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE 'JobState=[A-Z]+' | head -1 | cut -d= -f2)
          [ "$st" = RUNNING ] || { echo "FAIL: job should still be RUNNING after a refused rolling upgrade (state: $st)"; exit 1; }
          echo "PASS: gpu-3 untouched after the refused rolling upgrade"

      - name: rolling_upgrade.yml (gpu-1 normal, gpu-2 unreachable, gpu-3 busy)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci.ini playbooks/rolling_upgrade.yml \
            -e spur_binary_src="$GITHUB_WORKSPACE/spur-bin-new" \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur \
            -e spur_ignore_unreachable_agents=true \
            -e spur_skip_busy_agents=true \
            -e spur_drain_wait_secs=10 \
            -e spur_rolling_batch_size=2 \
            -e spur_verify_enabled=true \
            -e spur_verify_submit_user=ciuser

      - name: Assert gpu-1 upgraded and still schedules work
        run: |
          set -euo pipefail
          found=""
          for i in $(seq 1 30); do
            docker exec ctl-0 /usr/local/bin/spur show node gpu-1 2>/dev/null \
              | grep -qx "NodeName=gpu-1" && { found=1; break; }
            sleep 2
          done
          [ -n "$found" ] || { echo "gpu-1 missing after upgrade"; exit 1; }
          echo "gpu-1 registered"
          docker exec -u ciuser -w /home/ciuser ctl-0 bash -c '
            set -e
            printf "#!/bin/bash\n#SBATCH --job-name=post-upgrade\necho ok on \$(hostname)\n" > /tmp/ci-post.sh
            jid=$(/usr/local/bin/spur submit /tmp/ci-post.sh | grep -oE "[0-9]+" | head -1)
            for i in $(seq 1 30); do
              st=$(/usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE "JobState=[A-Z]+" | head -1 | cut -d= -f2)
              [ "$st" = COMPLETED ] && { echo "post-upgrade job $jid COMPLETED"; exit 0; }
              case "$st" in FAILED|CANCELLED|TIMEOUT|NODE_FAIL) echo "job ended $st"; exit 1 ;; esac
              sleep 2
            done
            echo "post-upgrade job did not complete"; exit 1
          '

      - name: Assert gpu-3 busy job was left undisturbed
        run: |
          set -euo pipefail
          jid=$(docker exec ctl-0 cat /tmp/ci-busy.jid)
          st=$(docker exec ctl-0 /usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE 'JobState=[A-Z]+' | head -1 | cut -d= -f2)
          echo "busy job $jid state after rolling upgrade: $st"
          [ "$st" = RUNNING ] || { echo "busy job $jid was disturbed by the upgrade (state: $st)"; exit 1; }
          docker exec ctl-0 /usr/local/bin/spur show node gpu-3

      # --- Pass 2: force upgrade — bare process + Docker container killed ---
      - name: Submit force-upgrade test jobs on gpu-3 (bare sleep + Docker container)
        run: |
          set -euo pipefail
          # Cancel the original busy job and wait for gpu-3 to go IDLE.
          jid=$(docker exec ctl-0 cat /tmp/ci-busy.jid)
          docker exec ctl-0 /usr/local/bin/spur scancel "$jid" || true
          for i in $(seq 1 30); do
            st=$(docker exec ctl-0 /usr/local/bin/spur show node gpu-3 2>/dev/null | grep -oE 'State=[A-Z]+' | head -1 | cut -d= -f2)
            [ "$st" = IDLE ] && break
            sleep 2
          done

          # Job A: bare sleep (existing test path).
          docker exec -u ciuser -w /home/ciuser ctl-0 bash -c '
            set -e
            printf "#!/bin/bash\n#SBATCH --job-name=force-bare\nsleep 600\n" > /tmp/ci-force-bare.sh
            jid=$(/usr/local/bin/spur submit -w gpu-3 /tmp/ci-force-bare.sh | grep -oE "[0-9]+" | head -1)
            echo "$jid" > /tmp/ci-force-bare.jid
            for i in $(seq 1 30); do
              st=$(/usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE "JobState=[A-Z]+" | head -1 | cut -d= -f2)
              [ "$st" = RUNNING ] && { echo "bare job $jid RUNNING on gpu-3"; exit 0; }
              sleep 1
            done
            echo "bare job $jid never reached RUNNING"; exit 1
          '

          # Job B: Docker container (tests the container-kill code path).
          # The job script launches a detached Docker container inside gpu-3
          # then sleeps in the foreground so the spur job stays RUNNING.
          docker exec -u ciuser -w /home/ciuser ctl-0 bash -c '
            set -e
            cat > /tmp/ci-force-docker.sh <<EOF
          #!/bin/bash
          #SBATCH --job-name=force-docker
          docker run -d --name ci-force-container ubuntu:22.04 sleep 600
          sleep 600
          EOF
            jid=$(/usr/local/bin/spur submit -w gpu-3 /tmp/ci-force-docker.sh | grep -oE "[0-9]+" | head -1)
            echo "$jid" > /tmp/ci-force-docker.jid
            for i in $(seq 1 30); do
              st=$(/usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE "JobState=[A-Z]+" | head -1 | cut -d= -f2)
              [ "$st" = RUNNING ] && { echo "docker job $jid RUNNING on gpu-3"; exit 0; }
              sleep 1
            done
            echo "docker job $jid never reached RUNNING"; exit 1
          '

          # Confirm the Docker container is actually running inside gpu-3.
          for i in $(seq 1 20); do
            docker exec gpu-3 docker ps --filter name=ci-force-container --format '{{.Names}}' \
              | grep -q ci-force-container && { echo "ci-force-container running"; break; }
            sleep 2
          done
          docker exec gpu-3 docker ps --filter name=ci-force-container

      - name: rolling_upgrade.yml --force (gpu-3 force-upgraded, jobs+container killed)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci.ini playbooks/rolling_upgrade.yml \
            -e spur_binary_src="$GITHUB_WORKSPACE/spur-bin-new" \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur \
            -e spur_ignore_unreachable_agents=true \
            -e spur_force_upgrade_busy_agents=true \
            -e spur_drain_wait_secs=10 \
            -e spur_verify_enabled=true \
            -e spur_verify_submit_user=ciuser

      - name: Assert bare job processes were killed (scheduler + OS cgroup check)
        run: |
          set -euo pipefail
          jid=$(docker exec ctl-0 cat /tmp/ci-force-bare.jid)
          st=$(docker exec ctl-0 /usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE 'JobState=[A-Z_]+' | head -1 | cut -d= -f2)
          echo "bare job $jid scheduler state: $st"
          [ "$st" = RUNNING ] && { echo "FAIL: bare job still RUNNING"; exit 1; }
          echo "scheduler: bare job ended with $st"

          orphan_pids=$(docker exec gpu-3 bash -c \
            "find /sys/fs/cgroup/spur -name cgroup.procs 2>/dev/null | xargs cat 2>/dev/null | sort -u" || true)
          if [ -n "$orphan_pids" ]; then
            echo "FAIL: orphan PIDs still in spur cgroups on gpu-3: $orphan_pids"
            docker exec gpu-3 ps -p "$orphan_pids" || true
            exit 1
          fi
          echo "OS check: spur cgroups empty on gpu-3"

      - name: Assert Docker container was killed by force upgrade
        run: |
          set -euo pipefail
          jid=$(docker exec ctl-0 cat /tmp/ci-force-docker.jid)
          st=$(docker exec ctl-0 /usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE 'JobState=[A-Z_]+' | head -1 | cut -d= -f2)
          echo "docker job $jid scheduler state: $st"
          [ "$st" = RUNNING ] && { echo "FAIL: docker job still RUNNING in scheduler"; exit 1; }
          echo "scheduler: docker job ended with $st"

          # The Docker container must be gone — not running, not even stopped/exited.
          running=$(docker exec gpu-3 docker ps --filter name=ci-force-container --format '{{.Names}}' || true)
          if [ -n "$running" ]; then
            echo "FAIL: Docker container ci-force-container is still RUNNING on gpu-3"
            docker exec gpu-3 docker ps
            exit 1
          fi
          echo "Docker container ci-force-container is gone from gpu-3"

      - name: Assert gpu-3 re-registered after force upgrade
        run: |
          set -euo pipefail
          found=""
          for i in $(seq 1 30); do
            docker exec ctl-0 /usr/local/bin/spur show node gpu-3 2>/dev/null \
              | grep -qx "NodeName=gpu-3" && { found=1; break; }
            sleep 2
          done
          [ -n "$found" ] || { echo "gpu-3 did not re-register after force upgrade"; exit 1; }
          echo "gpu-3 re-registered after force upgrade"
          docker exec ctl-0 /usr/local/bin/spur show node gpu-3

      - name: Dump logs on failure
        if: failure()
        run: |
          for n in $NODES; do
            echo "===== $n journal (spur*) ====="
            docker exec "$n" bash -c 'journalctl -u "spur*" --no-pager | tail -50' || true
            echo "===== $n docker ps ====="
            docker exec "$n" docker ps -a 2>/dev/null || true
          done

      - name: Teardown containers
        if: always()
        run: |
          for n in $NODES; do docker rm -f "$n" || true; done
          docker network rm spur-ci || true

  # ---------------------------------------------------------------------------
  # Job 2: spur.conf preservation
  # ---------------------------------------------------------------------------
  integration-conf:
    runs-on: ubuntu-latest
    needs: lint
    env:
      NODES: "ctl-0 gpu-1 gpu-2 gpu-3"
    steps:
      - uses: actions/checkout@v4

      - name: Download + verify Spur binaries (deploy = release, upgrade = nightly)
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_TAG: ""
          UPGRADE_TAG: ""
        run: |
          set -euo pipefail

          fetch() {
            local tag="$1" dest="$2" d
            d="dl-$dest"
            mkdir -p "$d"
            ( cd "$d"
              gh release download "$tag" --repo ROCm/spur \
                --pattern '*-linux-amd64.tar.gz' \
                --pattern '*-linux-amd64.tar.gz.sha256'
              tarball=$(ls *-linux-amd64.tar.gz)
              echo "Verifying checksum of $tarball ($tag)"
              hash=$(awk '{print $1}' "${tarball}.sha256")
              echo "${hash}  ${tarball}" | sha256sum -c -
              tar xzf "$tarball"
              bindir=$(dirname "$(find . -type f -name spurctld | head -1)")
              test -n "$bindir" || { echo "spurctld not found in $tarball"; exit 1; }
              mkdir -p "$GITHUB_WORKSPACE/$dest"
              for b in spur spurctld spurd; do cp "$bindir/$b" "$GITHUB_WORKSPACE/$dest/$b"; done
              plugin=$(find . -path '*/lib/spur/spur_mpi_pmix.so' -o -name spur_mpi_pmix.so 2>/dev/null | head -1)
              if [ -n "$plugin" ] && [ -f "$plugin" ]; then
                cp "$plugin" "$GITHUB_WORKSPACE/$dest/spur_mpi_pmix.so"
              fi
              chmod +x "$GITHUB_WORKSPACE/$dest"/*
            )
          }

          deploy_tag="${DEPLOY_TAG:-}"
          if [ -z "$deploy_tag" ]; then
            deploy_tag=$(gh api repos/ROCm/spur/releases --jq \
              'map(select(.tag_name != "nightly"))[0].tag_name')
          fi
          upgrade_tag="${UPGRADE_TAG:-nightly}"

          fetch "$deploy_tag"  spur-bin
          fetch "$upgrade_tag" spur-bin-new

      - name: Start systemd containers on a docker network
        env:
          IMG: jrei/systemd-ubuntu:22.04
        run: |
          set -euo pipefail
          docker network create spur-ci
          docker pull "$IMG"
          for n in $NODES; do
            docker run -d --name "$n" --hostname "$n" \
              --network spur-ci \
              --privileged \
              --cgroupns=host \
              -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
              --tmpfs /run --tmpfs /run/lock --tmpfs /tmp \
              "$IMG"
          done

      - name: Wait for systemd to be ready in every container
        run: |
          set -uo pipefail
          for n in $NODES; do
            ok=""
            for i in $(seq 1 30); do
              st=$(docker exec "$n" systemctl is-system-running 2>/dev/null || true)
              case "$st" in running|degraded) ok=1; break ;; esac
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "::error::systemd never became ready in $n (last: ${st:-none})"
              exit 1
            fi
            echo "$n: systemd ready ($st)"
          done

      - name: Install in-container preflight deps (curl/tar/iproute2/python3/sudo)
        run: |
          set -euo pipefail
          for n in $NODES; do
            docker exec "$n" bash -c 'apt-get update -qq && apt-get install -y -qq curl tar iproute2 python3 sudo'
          done

      - name: Create a non-root job-submission user in every container
        # Newer spurd builds refuse a job submitted by uid 0 unless
        # [auth] allow_root_jobs=true (which we don't set) — submit as this
        # user instead everywhere a job is submitted in this workflow.
        run: |
          set -euo pipefail
          for n in $NODES; do
            docker exec "$n" useradd -m -s /bin/bash ciuser
          done

      - name: Install ansible + docker connection plugin
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible-core
          ansible-galaxy collection install community.docker

      - name: deploy.yml (1 ctl + 3 agents)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci.ini playbooks/deploy.yml \
            -e spur_binary_src="$GITHUB_WORKSPACE/spur-bin" \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur \
            -e spur_verify_enabled=true \
            -e spur_verify_submit_user=ciuser

      - name: Assert all three agents registered
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            missing=""
            for a in gpu-1 gpu-2 gpu-3; do
              docker exec ctl-0 /usr/local/bin/spur show node "$a" 2>/dev/null \
                | grep -qx "NodeName=$a" || missing="$missing $a"
            done
            [ -z "$missing" ] && { echo "all three agents registered"; break; }
            sleep 2
          done
          [ -z "$missing" ] || { echo "agents still missing:$missing"; exit 1; }

      - name: Assert MPI plugin installed on agents
        run: |
          set -euo pipefail
          for a in gpu-1 gpu-2 gpu-3; do
            docker exec "$a" test -f /usr/lib/spur/spur_mpi_pmix.so
          done
          echo "MPI plugin present on all agents"

      - name: Assert spur CLI works locally on agents under direct transport
        run: |
          set -euo pipefail
          for a in gpu-1 gpu-2 gpu-3; do
            docker exec "$a" test -x /usr/local/bin/spur
            docker exec "$a" bash -c '[ "$(readlink /usr/local/bin/squeue)" = /usr/local/bin/spur ]'
            docker exec "$a" bash -c 'set -a; source /etc/environment; set +a; env | grep ^SPUR_CONTROLLER_ADDR' \
              || echo "(SPUR_CONTROLLER_ADDR not set on $a)"
            out=$(docker exec "$a" bash -c "set -a; source /etc/environment; set +a; /usr/local/bin/spur show node $a" 2>&1)
            echo "$out" | grep -qx "NodeName=$a" \
              || { echo "FAIL: spur CLI on $a could not find its own node entry"; echo "--- output ---"; echo "$out"; exit 1; }
          done
          echo "spur CLI present and working on all agents (direct transport)"

      # --- Agents get their own minimal spur.conf, at the same path as controllers ---
      - name: Assert agents get a minimal spur.conf (not the controller's full file), and spurd loaded it
        run: |
          set -euo pipefail
          docker exec ctl-0 test -f /opt/spur/etc/spur.conf
          for a in gpu-1 gpu-2 gpu-3; do
            docker exec "$a" test -f /opt/spur/etc/spur.conf \
              || { echo "FAIL: $a has no spur.conf at /opt/spur/etc/spur.conf"; exit 1; }
          done
          echo "PASS: spur.conf present at the same path (/opt/spur/etc/spur.conf) on ctl-0 and every agent"

          # The agent's copy must be the minimal per-agent template, not the
          # controller's fleet-wide one — it should carry no accounting/node/
          # partition content, which only the controller needs.
          for a in gpu-1 gpu-2 gpu-3; do
            docker exec "$a" grep -q '^database_url' /opt/spur/etc/spur.conf \
              && { echo "FAIL: $a's spur.conf has database_url — should only be on the controller"; exit 1; }
            docker exec "$a" grep -q '^\[\[nodes\]\]' /opt/spur/etc/spur.conf \
              && { echo "FAIL: $a's spur.conf has a [[nodes]] block — should only be on the controller"; exit 1; }
          done
          echo "PASS: agents' spur.conf is minimal (no controller/accounting/nodes/partitions content)"

          docker exec gpu-1 journalctl -u spurd --no-pager | grep -q "loaded spur.conf" \
            && echo "PASS: spurd log confirms it loaded spur.conf" \
            || { echo "FAIL: spurd never logged loading spur.conf"; docker exec gpu-1 journalctl -u spurd --no-pager | tail -20; exit 1; }

      # --- Agent template's k8s-enabled branch: render-only, no real k0s install ---
      - name: Assert the agent template's [cluster]/k8s block renders correctly when enabled
        working-directory: ansible
        run: |
          set -euo pipefail
          cat > ./.ci-render-agent-k8s-conf.yml <<'EOF'
          - hosts: localhost
            gather_facts: no
            vars:
              spur_cluster_name: ci-cluster
              spur_k8s_enabled: true
              spur_k8s_control_plane_nodes: "k8s-cp-0,k8s-cp-1,k8s-cp-2"
              spur_k8s_pod_cidr: "10.244.0.0/16"
              spur_k8s_service_cidr: "10.96.0.0/12"
              spur_k8s_cni: kuberouter
              spur_k8s_cni_mtu: 1450
              spur_k8s_version: v1.36.2+k0s.0
            tasks:
              - ansible.builtin.template:
                  src: roles/spur_agent/templates/spur.conf.j2
                  dest: /tmp/rendered-agent-k8s.conf
          EOF
          ansible-playbook ./.ci-render-agent-k8s-conf.yml
          rm -f ./.ci-render-agent-k8s-conf.yml
          conf=$(cat /tmp/rendered-agent-k8s.conf)
          echo "$conf" | grep -q '^\[cluster\]' || { echo "FAIL: no [cluster] section rendered"; echo "$conf"; exit 1; }
          echo "$conf" | grep -q 'pod_cidr = "10.244.0.0/16"' || { echo "FAIL: pod_cidr missing/wrong"; echo "$conf"; exit 1; }
          echo "$conf" | grep -q 'service_cidr = "10.96.0.0/12"' || { echo "FAIL: service_cidr missing/wrong"; echo "$conf"; exit 1; }
          echo "$conf" | grep -q 'control_plane_node = "k8s-cp-0"' || { echo "FAIL: control_plane_node missing/wrong"; echo "$conf"; exit 1; }
          echo "$conf" | grep -q 'control_plane_replicas = 3' || { echo "FAIL: control_plane_replicas missing/wrong"; echo "$conf"; exit 1; }
          echo "$conf" | grep -q 'k0s_version = "v1.36.2+k0s.0"' || { echo "FAIL: k0s_version missing/wrong"; echo "$conf"; exit 1; }
          echo "PASS: agent template renders [cluster]/k8s block correctly when spur_k8s_enabled=true"

      # --- spur.conf preservation test (controller AND agent) ---------------
      - name: Stamp a sentinel line into spur.conf on ctl-0 and gpu-1 to detect overwrites
        run: |
          for h in ctl-0 gpu-1; do
            docker exec "$h" bash -c 'echo "# CI-SENTINEL" >> /opt/spur/etc/spur.conf'
            docker exec "$h" grep -q "CI-SENTINEL" /opt/spur/etc/spur.conf \
              || { echo "sentinel not written on $h"; exit 1; }
          done
          echo "sentinel written to spur.conf on ctl-0 and gpu-1"

      - name: rolling_upgrade.yml (default — spur.conf must be preserved)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci.ini playbooks/rolling_upgrade.yml \
            -e spur_binary_src="$GITHUB_WORKSPACE/spur-bin-new" \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur \
            -e spur_ignore_unreachable_agents=true \
            -e spur_skip_busy_agents=true \
            -e spur_drain_wait_secs=10 \
            -e spur_verify_enabled=true \
            -e spur_verify_submit_user=ciuser

      - name: Assert spur.conf was NOT overwritten on ctl-0 or gpu-1 (sentinel must still be present)
        run: |
          for h in ctl-0 gpu-1; do
            docker exec "$h" grep -q "CI-SENTINEL" /opt/spur/etc/spur.conf \
              && echo "PASS: spur.conf preserved on $h (sentinel intact)" \
              || { echo "FAIL: spur.conf was overwritten on $h — sentinel gone"; exit 1; }
          done

      - name: rolling_upgrade.yml --overwrite-conf (spur.conf must be re-rendered)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci.ini playbooks/rolling_upgrade.yml \
            -e spur_binary_src="$GITHUB_WORKSPACE/spur-bin-new" \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur \
            -e spur_ignore_unreachable_agents=true \
            -e spur_skip_busy_agents=true \
            -e spur_drain_wait_secs=10 \
            -e spur_overwrite_conf=true \
            -e spur_verify_enabled=true \
            -e spur_verify_submit_user=ciuser

      - name: Assert spur.conf WAS overwritten on ctl-0 and gpu-1 (sentinel must be gone)
        run: |
          for h in ctl-0 gpu-1; do
            docker exec "$h" grep -q "CI-SENTINEL" /opt/spur/etc/spur.conf \
              && { echo "FAIL: spur.conf was not overwritten on $h — sentinel still present"; exit 1; } \
              || echo "PASS: spur.conf re-rendered on $h (sentinel gone)"
          done

      # --- deploy.yml must preserve spur.conf too, same as rolling_upgrade.yml ---
      - name: Re-stamp a sentinel line into spur.conf on ctl-0 and gpu-1 for the deploy.yml test
        run: |
          for h in ctl-0 gpu-1; do
            docker exec "$h" bash -c 'echo "# CI-SENTINEL-DEPLOY" >> /opt/spur/etc/spur.conf'
            docker exec "$h" grep -q "CI-SENTINEL-DEPLOY" /opt/spur/etc/spur.conf \
              || { echo "sentinel not written on $h"; exit 1; }
          done
          echo "sentinel written to spur.conf on ctl-0 and gpu-1"

      - name: deploy.yml (default — spur.conf must be preserved on controller and agent)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci.ini playbooks/deploy.yml \
            -e spur_binary_src="$GITHUB_WORKSPACE/spur-bin-new" \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur \
            -e spur_drain_wait_secs=10 \
            -e spur_verify_enabled=false

      - name: Assert deploy.yml did NOT overwrite spur.conf on ctl-0 or gpu-1 (sentinel must still be present)
        run: |
          for h in ctl-0 gpu-1; do
            docker exec "$h" grep -q "CI-SENTINEL-DEPLOY" /opt/spur/etc/spur.conf \
              && echo "PASS: spur.conf preserved on $h (sentinel intact)" \
              || { echo "FAIL: deploy.yml overwrote spur.conf on $h — sentinel gone"; exit 1; }
          done

      - name: deploy.yml --overwrite-conf (spur.conf must be re-rendered on controller and agent)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci.ini playbooks/deploy.yml \
            -e spur_binary_src="$GITHUB_WORKSPACE/spur-bin-new" \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur \
            -e spur_drain_wait_secs=10 \
            -e spur_overwrite_conf=true \
            -e spur_verify_enabled=false

      - name: Assert deploy.yml --overwrite-conf re-rendered spur.conf on ctl-0 and gpu-1 (sentinel must be gone)
        run: |
          for h in ctl-0 gpu-1; do
            docker exec "$h" grep -q "CI-SENTINEL-DEPLOY" /opt/spur/etc/spur.conf \
              && { echo "FAIL: deploy.yml -e spur_overwrite_conf=true did not overwrite spur.conf on $h"; exit 1; } \
              || echo "PASS: spur.conf re-rendered on $h (sentinel gone)"
          done

      # --- add_nodes.yml must preserve spur.conf too, same default as above ---
      - name: Stamp a sentinel line into spur.conf on ctl-0 for the add_nodes.yml test
        run: |
          docker exec ctl-0 bash -c 'echo "# CI-SENTINEL-ADDNODES" >> /opt/spur/etc/spur.conf'
          docker exec ctl-0 grep -q "CI-SENTINEL-ADDNODES" /opt/spur/etc/spur.conf \
            || { echo "sentinel not written on ctl-0"; exit 1; }
          echo "sentinel written to spur.conf on ctl-0"

      - name: add_nodes.yml (default — spur.conf must be preserved)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci.ini playbooks/add_nodes.yml \
            -e new_nodes=gpu-1 \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur

      - name: Assert add_nodes.yml did NOT overwrite spur.conf on ctl-0 (sentinel must still be present)
        run: |
          docker exec ctl-0 grep -q "CI-SENTINEL-ADDNODES" /opt/spur/etc/spur.conf \
            && echo "PASS: spur.conf preserved on ctl-0 (sentinel intact)" \
            || { echo "FAIL: add_nodes.yml overwrote spur.conf on ctl-0 — sentinel gone"; exit 1; }

      - name: add_nodes.yml --overwrite-conf (spur.conf must be re-rendered)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci.ini playbooks/add_nodes.yml \
            -e new_nodes=gpu-1 \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur \
            -e spur_overwrite_conf=true

      - name: Assert add_nodes.yml --overwrite-conf re-rendered spur.conf on ctl-0 (sentinel must be gone)
        run: |
          docker exec ctl-0 grep -q "CI-SENTINEL-ADDNODES" /opt/spur/etc/spur.conf \
            && { echo "FAIL: add_nodes.yml -e spur_overwrite_conf=true did not overwrite spur.conf on ctl-0"; exit 1; } \
            || echo "PASS: spur.conf re-rendered on ctl-0 (sentinel gone)"

      # --- add_nodes.yml must verify registration by the real hostname, not
      # the inventory alias — those two are only the same by convention, and
      # every OTHER container in this suite is started with --hostname equal
      # to its inventory name, so none of them would ever catch a regression
      # here. gpu-4 is deliberately given a --hostname that differs from its
      # inventory alias to close that gap.
      - name: Start gpu-4 with a hostname that deliberately differs from its inventory alias
        env:
          IMG: jrei/systemd-ubuntu:22.04
        run: |
          set -euo pipefail
          docker run -d --name gpu-4 --hostname gpu-4-real-hostname \
            --network spur-ci \
            --privileged \
            --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            --tmpfs /run --tmpfs /run/lock --tmpfs /tmp \
            "$IMG"
          for i in $(seq 1 30); do
            st=$(docker exec gpu-4 systemctl is-system-running 2>/dev/null || true)
            case "$st" in running|degraded) break ;; esac
            sleep 2
          done
          # gpu-4 is created after "Install in-container preflight deps" already
          # ran for $NODES — spur_install's own preflight check requires curl/tar,
          # neither present in the base image, so it needs the same treatment here.
          docker exec gpu-4 bash -c 'apt-get update -qq && apt-get install -y -qq curl tar iproute2 python3 sudo'
          sed -i '/^\[spur_agents\]/a gpu-4' ansible/inventory/ci.ini
          cat ansible/inventory/ci.ini

      - name: add_nodes.yml gpu-4 (inventory alias "gpu-4" != real hostname "gpu-4-real-hostname")
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci.ini playbooks/add_nodes.yml \
            -e new_nodes=gpu-4 \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur

      - name: Assert gpu-4 registered under its real hostname, not the inventory alias
        run: |
          set -euo pipefail
          docker exec ctl-0 /usr/local/bin/spur show node gpu-4-real-hostname 2>/dev/null \
            | grep -qx "NodeName=gpu-4-real-hostname" \
            || { echo "FAIL: gpu-4 should have registered as gpu-4-real-hostname"; docker exec ctl-0 /usr/local/bin/spur nodes; exit 1; }
          docker exec ctl-0 /usr/local/bin/spur show node gpu-4 2>/dev/null \
            | grep -qx "NodeName=gpu-4" \
            && { echo "FAIL: gpu-4 should NOT be registered under its inventory alias"; exit 1; }
          echo "PASS: add_nodes.yml verified gpu-4 by its real hostname, not the inventory alias"

      # TODO(next): manage_accounts.yml / healthcheck.yml

      - name: Dump logs on failure
        if: failure()
        run: |
          for n in $NODES gpu-4; do
            echo "===== $n journal (spur*) ====="
            docker exec "$n" bash -c 'journalctl -u "spur*" --no-pager | tail -50' || true
          done

      - name: Teardown containers
        if: always()
        run: |
          for n in $NODES gpu-4; do docker rm -f "$n" || true; done
          docker network rm spur-ci || true

  # ---------------------------------------------------------------------------
  # Job 3: remove_nodes.yml + teardown.yml busy-node job safety
  # ---------------------------------------------------------------------------
  integration-day2:
    runs-on: ubuntu-latest
    needs: lint
    env:
      # ci.ini hardcodes [spur_agents] = gpu-1/gpu-2/gpu-3, so all three must
      # exist as containers: gpu-1 (remove_nodes.yml), gpu-2 (teardown.yml
      # default disruptive path), gpu-3 (teardown.yml opt-in drain path).
      NODES: "ctl-0 gpu-1 gpu-2 gpu-3"
    steps:
      - uses: actions/checkout@v4

      - name: Download + verify Spur binaries
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_TAG: ""
        run: |
          set -euo pipefail
          deploy_tag="${DEPLOY_TAG:-}"
          if [ -z "$deploy_tag" ]; then
            deploy_tag=$(gh api repos/ROCm/spur/releases --jq \
              'map(select(.tag_name != "nightly"))[0].tag_name')
          fi
          mkdir -p dl-spur-bin
          ( cd dl-spur-bin
            gh release download "$deploy_tag" --repo ROCm/spur \
              --pattern '*-linux-amd64.tar.gz' \
              --pattern '*-linux-amd64.tar.gz.sha256'
            tarball=$(ls *-linux-amd64.tar.gz)
            hash=$(awk '{print $1}' "${tarball}.sha256")
            echo "${hash}  ${tarball}" | sha256sum -c -
            tar xzf "$tarball"
            bindir=$(dirname "$(find . -type f -name spurctld | head -1)")
            mkdir -p "$GITHUB_WORKSPACE/spur-bin"
            for b in spur spurctld spurd; do cp "$bindir/$b" "$GITHUB_WORKSPACE/spur-bin/$b"; done
            chmod +x "$GITHUB_WORKSPACE/spur-bin"/*
          )

      - name: Start systemd containers on a docker network
        env:
          IMG: jrei/systemd-ubuntu:22.04
        run: |
          set -euo pipefail
          docker network create spur-ci
          docker pull "$IMG"
          for n in $NODES; do
            docker run -d --name "$n" --hostname "$n" \
              --network spur-ci \
              --privileged \
              --cgroupns=host \
              -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
              --tmpfs /run --tmpfs /run/lock --tmpfs /tmp \
              "$IMG"
          done

      - name: Wait for systemd to be ready in every container
        run: |
          set -uo pipefail
          for n in $NODES; do
            ok=""
            for i in $(seq 1 30); do
              st=$(docker exec "$n" systemctl is-system-running 2>/dev/null || true)
              case "$st" in running|degraded) ok=1; break ;; esac
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "::error::systemd never became ready in $n (last: ${st:-none})"
              exit 1
            fi
            echo "$n: systemd ready ($st)"
          done

      - name: Install in-container preflight deps (curl/tar/iproute2/python3/sudo)
        run: |
          set -euo pipefail
          for n in $NODES; do
            docker exec "$n" bash -c 'apt-get update -qq && apt-get install -y -qq curl tar iproute2 python3 sudo'
          done

      - name: Create a non-root job-submission user in every container
        # Newer spurd builds refuse a job submitted by uid 0 unless
        # [auth] allow_root_jobs=true (which we don't set) — submit as this
        # user instead everywhere a job is submitted in this workflow.
        run: |
          set -euo pipefail
          for n in $NODES; do
            docker exec "$n" useradd -m -s /bin/bash ciuser
          done

      - name: Install ansible + docker connection plugin
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible-core
          ansible-galaxy collection install community.docker

      - name: deploy.yml (1 ctl + 3 agents)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci.ini playbooks/deploy.yml \
            -e spur_binary_src="$GITHUB_WORKSPACE/spur-bin" \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur \
            -e spur_verify_enabled=true \
            -e spur_verify_submit_user=ciuser

      - name: Assert all three agents registered
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            missing=""
            for a in gpu-1 gpu-2 gpu-3; do
              docker exec ctl-0 /usr/local/bin/spur show node "$a" 2>/dev/null \
                | grep -qx "NodeName=$a" || missing="$missing $a"
            done
            [ -z "$missing" ] && { echo "all three agents registered"; break; }
            sleep 2
          done
          [ -z "$missing" ] || { echo "agents still missing:$missing"; exit 1; }

      # --- remove_nodes.yml: refuse / skip / force on a busy node -----------
      - name: Submit a busy job on gpu-1 for the remove_nodes.yml tests
        run: |
          set -euo pipefail
          docker exec -u ciuser -w /home/ciuser ctl-0 bash -c '
            set -e
            printf "#!/bin/bash\n#SBATCH --job-name=remove-busy\nsleep 600\n" > /tmp/ci-remove-busy.sh
            jid=$(/usr/local/bin/spur submit -w gpu-1 /tmp/ci-remove-busy.sh | grep -oE "[0-9]+" | head -1)
            echo "$jid" > /tmp/ci-remove-busy.jid
            for i in $(seq 1 30); do
              st=$(/usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE "JobState=[A-Z]+" | head -1 | cut -d= -f2)
              [ "$st" = RUNNING ] && { echo "busy job $jid RUNNING on gpu-1"; exit 0; }
              sleep 1
            done
            echo "busy job $jid never reached RUNNING"; exit 1
          '

      - name: remove_nodes.yml default (must refuse — gpu-1 is busy)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          if ansible-playbook -i inventory/ci.ini playbooks/remove_nodes.yml \
              -e spur_install_dir=/usr/local/bin \
              -e nodes_to_remove=gpu-1 \
              -e spur_drain_wait_secs=10; then
            echo "FAIL: remove_nodes.yml should have refused on a busy node"; exit 1
          else
            echo "PASS: remove_nodes.yml refused by default on a busy node"
          fi

      - name: Assert gpu-1 is still registered and its job is still running (default refusal)
        run: |
          set -euo pipefail
          found=""
          for i in $(seq 1 10); do
            docker exec ctl-0 /usr/local/bin/spur show node gpu-1 2>/dev/null | grep -qx "NodeName=gpu-1" && { found=1; break; }
            sleep 1
          done
          [ -n "$found" ] || { echo "FAIL: gpu-1 should still be registered after a refused removal"; exit 1; }
          jid=$(docker exec ctl-0 cat /tmp/ci-remove-busy.jid)
          st=$(docker exec ctl-0 /usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE 'JobState=[A-Z_]+' | head -1 | cut -d= -f2)
          [ "$st" = RUNNING ] || { echo "FAIL: job should still be RUNNING after a refused removal (state: $st)"; exit 1; }
          echo "PASS: gpu-1 untouched after the refused removal"

      - name: remove_nodes.yml spur_skip_busy_agents=true (must leave gpu-1 in the cluster, running)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci.ini playbooks/remove_nodes.yml \
            -e spur_install_dir=/usr/local/bin \
            -e nodes_to_remove=gpu-1 \
            -e spur_drain_wait_secs=10 \
            -e spur_skip_busy_agents=true

      - name: Assert gpu-1 is still registered, spurd untouched, and its job is still running
        run: |
          set -euo pipefail
          found=""
          for i in $(seq 1 10); do
            docker exec ctl-0 /usr/local/bin/spur show node gpu-1 2>/dev/null | grep -qx "NodeName=gpu-1" && { found=1; break; }
            sleep 1
          done
          [ -n "$found" ] || { echo "FAIL: gpu-1 should still be in the cluster (spur_skip_busy_agents=true)"; exit 1; }
          jid=$(docker exec ctl-0 cat /tmp/ci-remove-busy.jid)
          st=$(docker exec ctl-0 /usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE 'JobState=[A-Z_]+' | head -1 | cut -d= -f2)
          [ "$st" = RUNNING ] || { echo "FAIL: job should still be RUNNING (state: $st)"; exit 1; }
          docker exec gpu-1 systemctl is-active spurd | grep -qx active \
            || { echo "FAIL: spurd should not have been touched by spur_skip_busy_agents=true"; exit 1; }
          echo "PASS: gpu-1 left fully untouched — still registered, spurd active, job running"

      - name: remove_nodes.yml spur_force_remove_busy_nodes=true (must kill the job and remove gpu-1)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci.ini playbooks/remove_nodes.yml \
            -e spur_install_dir=/usr/local/bin \
            -e nodes_to_remove=gpu-1 \
            -e spur_drain_wait_secs=10 \
            -e spur_force_remove_busy_nodes=true

      - name: Assert gpu-1's job was killed and it was removed from the cluster
        run: |
          set -euo pipefail
          jid=$(docker exec ctl-0 cat /tmp/ci-remove-busy.jid)
          st=$(docker exec ctl-0 /usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE 'JobState=[A-Z_]+' | head -1 | cut -d= -f2)
          [ "$st" = RUNNING ] && { echo "FAIL: job should have been killed by spur_force_remove_busy_nodes=true"; exit 1; }
          gone=""
          for i in $(seq 1 10); do
            docker exec ctl-0 /usr/local/bin/spur show node gpu-1 2>/dev/null | grep -qx "NodeName=gpu-1" || { gone=1; break; }
            sleep 1
          done
          [ -n "$gone" ] || { echo "FAIL: gpu-1 should have been removed from the cluster"; exit 1; }
          docker exec gpu-1 systemctl is-active spurd 2>&1 | grep -qx active \
            && { echo "FAIL: spurd should have been stopped on gpu-1"; exit 1; }
          orphan_pids=$(docker exec gpu-1 bash -c \
            "find /sys/fs/cgroup/spur -name cgroup.procs 2>/dev/null | xargs cat 2>/dev/null | sort -u" || true)
          [ -z "$orphan_pids" ] || { echo "FAIL: orphan PIDs still in spur cgroups on gpu-1: $orphan_pids"; exit 1; }
          echo "PASS: gpu-1's job was killed, spurd stopped, and it was removed from the cluster"

      # --- teardown.yml: disruptive by design, no drain ---------------------
      - name: Submit a busy job on gpu-2 for the teardown.yml test
        run: |
          set -euo pipefail
          docker exec -u ciuser -w /home/ciuser ctl-0 bash -c '
            set -e
            printf "#!/bin/bash\n#SBATCH --job-name=teardown-busy\nsleep 600\n" > /tmp/ci-teardown-busy.sh
            jid=$(/usr/local/bin/spur submit -w gpu-2 /tmp/ci-teardown-busy.sh | grep -oE "[0-9]+" | head -1)
            echo "$jid" > /tmp/ci-teardown-busy.jid
            for i in $(seq 1 30); do
              st=$(/usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE "JobState=[A-Z]+" | head -1 | cut -d= -f2)
              [ "$st" = RUNNING ] && { echo "busy job $jid RUNNING on gpu-2"; exit 0; }
              sleep 1
            done
            echo "busy job $jid never reached RUNNING"; exit 1
          '

      - name: teardown.yml default (must NOT refuse or wait — stops gpu-2 immediately despite the busy job)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci.ini playbooks/teardown.yml \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur \
            --limit gpu-2

      - name: Assert gpu-2's spurd was stopped immediately, with no drain, and its job cgroup is clean
        run: |
          set -euo pipefail
          docker exec gpu-2 systemctl is-active spurd 2>&1 | grep -qx active \
            && { echo "FAIL: spurd should have been stopped on gpu-2 despite the busy job"; exit 1; }
          orphan_pids=$(docker exec gpu-2 bash -c \
            "find /sys/fs/cgroup/spur -name cgroup.procs 2>/dev/null | xargs cat 2>/dev/null | sort -u" || true)
          [ -z "$orphan_pids" ] || { echo "FAIL: orphan job PIDs still in spur cgroups on gpu-2: $orphan_pids"; exit 1; }
          echo "PASS: teardown.yml stopped gpu-2's spurd immediately, no drain/refuse, no orphaned job processes"

      # --- teardown.yml: spur_skip_busy_agents/spur_force_teardown_busy_agents opt back into draining first ---
      - name: Submit a busy job on gpu-3 for the teardown.yml opt-in-drain test
        run: |
          set -euo pipefail
          docker exec -u ciuser -w /home/ciuser ctl-0 bash -c '
            set -e
            printf "#!/bin/bash\n#SBATCH --job-name=teardown-drain-busy\nsleep 600\n" > /tmp/ci-teardown-drain-busy.sh
            jid=$(/usr/local/bin/spur submit -w gpu-3 /tmp/ci-teardown-drain-busy.sh | grep -oE "[0-9]+" | head -1)
            echo "$jid" > /tmp/ci-teardown-drain-busy.jid
            for i in $(seq 1 30); do
              st=$(/usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE "JobState=[A-Z]+" | head -1 | cut -d= -f2)
              [ "$st" = RUNNING ] && { echo "busy job $jid RUNNING on gpu-3"; exit 0; }
              sleep 1
            done
            echo "busy job $jid never reached RUNNING"; exit 1
          '

      - name: teardown.yml spur_skip_busy_agents=true (must drain first, then leave gpu-3 and its job untouched)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci.ini playbooks/teardown.yml \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur \
            -e spur_drain_wait_secs=10 \
            -e spur_skip_busy_agents=true \
            --limit gpu-3

      - name: Assert spur_skip_busy_agents=true left gpu-3's job and spurd untouched
        run: |
          set -euo pipefail
          jid=$(docker exec ctl-0 cat /tmp/ci-teardown-drain-busy.jid)
          st=$(docker exec ctl-0 /usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE 'JobState=[A-Z_]+' | head -1 | cut -d= -f2)
          [ "$st" = RUNNING ] || { echo "FAIL: job should still be RUNNING (spur_skip_busy_agents=true)"; exit 1; }
          docker exec gpu-3 systemctl is-active spurd | grep -qx active \
            || { echo "FAIL: spurd should not have been touched by spur_skip_busy_agents=true"; exit 1; }
          echo "PASS: spur_skip_busy_agents=true drained first, then left gpu-3's job and spurd untouched"

      - name: teardown.yml spur_force_teardown_busy_agents=true (must drain first, then kill the job and tear down gpu-3)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci.ini playbooks/teardown.yml \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur \
            -e spur_drain_wait_secs=10 \
            -e spur_force_teardown_busy_agents=true \
            --limit gpu-3

      - name: Assert gpu-3's job was killed and spurd was stopped
        run: |
          set -euo pipefail
          jid=$(docker exec ctl-0 cat /tmp/ci-teardown-drain-busy.jid)
          st=$(docker exec ctl-0 /usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE 'JobState=[A-Z_]+' | head -1 | cut -d= -f2)
          [ "$st" = RUNNING ] && { echo "FAIL: job should have been killed by spur_force_teardown_busy_agents=true"; exit 1; }
          docker exec gpu-3 systemctl is-active spurd 2>&1 | grep -qx active \
            && { echo "FAIL: spurd should have been stopped on gpu-3"; exit 1; }
          echo "PASS: gpu-3's job was killed and spurd stopped by teardown.yml --force"

      # --- teardown.yml basic smoke: full teardown stops every daemon ------
      - name: teardown.yml (full cluster — basic smoke)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci.ini playbooks/teardown.yml \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur

      - name: Assert every daemon is stopped after full teardown
        run: |
          set -euo pipefail
          docker exec ctl-0 systemctl is-active spurctld 2>&1 | grep -qx active \
            && { echo "FAIL: spurctld should be stopped on ctl-0"; exit 1; }
          echo "PASS: full teardown stopped spurctld"

      - name: Dump logs on failure
        if: failure()
        run: |
          for n in $NODES; do
            echo "===== $n journal (spur*) ====="
            docker exec "$n" bash -c 'journalctl -u "spur*" --no-pager | tail -50' || true
          done

      - name: Teardown containers
        if: always()
        run: |
          for n in $NODES; do docker rm -f "$n" || true; done
          docker network rm spur-ci || true

  # ---------------------------------------------------------------------------
  # Job 4: HA (3-controller) cluster over a real WireGuard mesh — SPUR-195 / #23
  #
  # Only job exercising spur_transport=wireguard AND >1 controller. Pulls the
  # nightly binaries because `spur net mesh`/`net remove-peer` (ROCm/spur#719)
  # postdate the last tagged release. WireGuard runs for real inside the
  # privileged containers: the module is modprobe'd on the runner and
  # /lib/modules is bind-mounted in so modinfo/wg-quick can see it.
  # ---------------------------------------------------------------------------
  integration-ha-mesh:
    runs-on: ubuntu-latest
    needs: lint
    env:
      # 3 controllers (each also an agent) + 2 dedicated workers + 1 login node.
      # Positional mesh addressing must yield: ctl-0=.1 (bootstrap), ctl-1=.2,
      # ctl-2=.3, worker-0=.4, worker-1=.5, login-0=.6 (joiners = secondary
      # controllers, then agents-minus-controllers, then login-only, by order).
      # 6 nodes → each meshes with the other 5. The 2nd worker + login node exist
      # so the remove/add tests can prove peer cleanup/join reach agents+login,
      # not just controllers (the deferred #23 review fast-follows).
      NODES: "ctl-0 ctl-1 ctl-2 worker-0 worker-1 login-0"
    steps:
      - uses: actions/checkout@v4

      - name: Load the WireGuard module on the runner
        # modinfo inside a container reads the container's (empty) /lib/modules,
        # so the module must be present on the host kernel and the tree mounted
        # into each container (below). Load it here first.
        run: |
          set -euo pipefail
          sudo modprobe wireguard
          lsmod | grep -q '^wireguard' || { echo "::error::wireguard module failed to load on the runner"; exit 1; }

      - name: Download + verify Spur nightly binaries (needs #719's net mesh/remove-peer)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dl-spur-bin
          ( cd dl-spur-bin
            # nightly, NOT a tagged release: `spur net mesh` / `net remove-peer`
            # landed in ROCm/spur#719 after the last release was cut.
            gh release download nightly --repo ROCm/spur \
              --pattern '*-linux-amd64.tar.gz' \
              --pattern '*-linux-amd64.tar.gz.sha256'
            tarball=$(ls *-linux-amd64.tar.gz)
            hash=$(awk '{print $1}' "${tarball}.sha256")
            echo "${hash}  ${tarball}" | sha256sum -c -
            tar xzf "$tarball"
            bindir=$(dirname "$(find . -type f -name spurctld | head -1)")
            test -n "$bindir" || { echo "spurctld not found in $tarball"; exit 1; }
            mkdir -p "$GITHUB_WORKSPACE/spur-bin"
            for b in spur spurctld spurd; do cp "$bindir/$b" "$GITHUB_WORKSPACE/spur-bin/$b"; done
            chmod +x "$GITHUB_WORKSPACE/spur-bin"/*
          )
          # Fail fast + clearly if this nightly predates #719 (missing the new
          # net verbs), rather than deep inside the wireguard/remove_nodes play.
          # Grep the `net --help` subcommand list rather than probing
          # `net <verb> --help`: this CLI prints per-subcommand help to STDERR
          # and exits non-zero, so a `<verb> --help` rc check false-negatives even
          # when the verb exists. `net --help` itself exits 0 and lists commands.
          net_help="$("$GITHUB_WORKSPACE/spur-bin/spur" net --help 2>&1 || true)"
          echo "$net_help" | grep -qE '^\s*mesh\b' \
            || { echo "::error::this nightly has no 'spur net mesh' — it predates ROCm/spur#719; re-run once a newer nightly is published"; exit 1; }
          echo "$net_help" | grep -qE '^\s*remove-peer\b' \
            || { echo "::error::this nightly has no 'spur net remove-peer' (ROCm/spur#719) — it predates that merge; re-run once a newer nightly is published"; exit 1; }

      - name: Start systemd containers on a docker network (with /lib/modules for wireguard)
        env:
          IMG: jrei/systemd-ubuntu:22.04
        run: |
          set -euo pipefail
          docker network create spur-ci
          docker pull "$IMG"
          for n in $NODES; do
            docker run -d --name "$n" --hostname "$n" \
              --network spur-ci \
              --privileged \
              --cgroupns=host \
              -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
              -v /lib/modules:/lib/modules:ro \
              --tmpfs /run --tmpfs /run/lock --tmpfs /tmp \
              "$IMG"
          done

      - name: Wait for systemd to be ready in every container
        run: |
          set -uo pipefail
          for n in $NODES; do
            ok=""
            for i in $(seq 1 30); do
              st=$(docker exec "$n" systemctl is-system-running 2>/dev/null || true)
              case "$st" in running|degraded) ok=1; break ;; esac
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "::error::systemd never became ready in $n (last: ${st:-none})"
              exit 1
            fi
            echo "$n: systemd ready ($st)"
          done

      - name: Install in-container preflight deps (curl/tar/iproute2/iputils-ping/python3/sudo + kmod + wireguard-tools)
        run: |
          set -euo pipefail
          # kmod provides modinfo, which the spur_wireguard role's first task
          # (`modinfo wireguard`) requires — the base jrei/systemd-ubuntu image
          # ships neither modinfo nor it via wireguard-tools, so without kmod that
          # task fails rc=127. modinfo then reads the bind-mounted host modules.
          #
          # iputils-ping provides `ping`, used by the mesh reachability asserts
          # (and the role's own verify-mesh ping). iproute2 gives `ip` but NOT
          # `ping`, so without this the ctl<->ctl ping check fails instantly rc=127
          # even though the tunnel is up.
          #
          # --no-install-recommends is REQUIRED: wireguard-tools recommends the
          # `wireguard` metapackage, which pulls linux-modules/linux-image .debs.
          # Unpacking those tries to write /lib/modules/<ver>, which we bind-mount
          # read-only (the host's modules), so dpkg aborts with "Read-only file
          # system" and the whole install fails. We only need the wg/wg-quick
          # userspace tools here; the kernel module comes from the mounted host
          # tree, not the package.
          for n in $NODES; do
            docker exec "$n" bash -c 'apt-get update -qq && apt-get install -y -qq --no-install-recommends curl tar iproute2 iputils-ping python3 sudo kmod wireguard-tools'
          done

      - name: Create a non-root job-submission user in every container
        run: |
          set -euo pipefail
          for n in $NODES; do
            docker exec "$n" useradd -m -s /bin/bash ciuser
          done

      - name: Install ansible + docker connection plugin + wireguard deps (ansible.utils/netaddr)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible-core netaddr
          ansible-galaxy collection install community.docker ansible.utils

      - name: deploy.yml — 3-controller HA over WireGuard (no accounting/k0s)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci-ha-mesh.ini playbooks/deploy.yml \
            -e @inventory/ci-ha-mesh.vars.yml \
            -e spur_binary_src="$GITHUB_WORKSPACE/spur-bin" \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur \
            -e spur_verify_enabled=true \
            -e spur_verify_submit_user=ciuser

      # ===================================================================
      # Assertion group 1: Mesh + HA core
      # ===================================================================
      - name: Assert pinned mesh addressing (.1 bootstrap, .2..6 by inventory pin)
        run: |
          set -euo pipefail
          declare -A want=( [ctl-0]=10.44.0.1 [ctl-1]=10.44.0.2 [ctl-2]=10.44.0.3 [worker-0]=10.44.0.4 [worker-1]=10.44.0.5 [login-0]=10.44.0.6 )
          for n in "${!want[@]}"; do
            got=$(docker exec "$n" bash -c "ip -o -4 addr show spur0 | grep -oE '10\.44\.[0-9]+\.[0-9]+' | head -1")
            [ "$got" = "${want[$n]}" ] \
              && echo "PASS: $n mesh IP = $got" \
              || { echo "::error::$n mesh IP is $got, expected ${want[$n]}"; docker exec "$n" wg show spur0 || true; exit 1; }
          done

      - name: Assert full mesh (each node peers the other 5, not hub-and-spoke)
        run: |
          set -euo pipefail
          # Every node must peer every OTHER node (5 peers each in a 6-node mesh).
          # Hub-and-spoke would leave the non-bootstrap nodes with just 1 peer
          # (the bootstrap) — the exact gap `spur net mesh` closes. This now
          # includes the login node, which must also be fully meshed.
          for n in $NODES; do
            peers=$(docker exec "$n" bash -c "wg show spur0 peers | grep -c . || true")
            [ "$peers" -eq 5 ] \
              && echo "PASS: $n has $peers mesh peers (full mesh)" \
              || { echo "::error::$n has $peers WG peers, expected 5 (full mesh) — mesh is hub-and-spoke or incomplete"; docker exec "$n" wg show spur0; exit 1; }
          done

      - name: Assert controllers reach each other over the mesh (ctl-0 <-> ctl-2 directly)
        run: |
          set -euo pipefail
          # ctl-0 (.1) pings ctl-2 (.3) and vice-versa — direct controller<->
          # controller reachability, what Raft elections need when the bootstrap
          # is down.
          docker exec ctl-0 ping -c2 -W3 10.44.0.3 >/dev/null \
            && echo "PASS: ctl-0 -> ctl-2 over the mesh" \
            || { echo "::error::ctl-0 could not reach ctl-2 (10.44.0.3) over the mesh"; exit 1; }
          docker exec ctl-2 ping -c2 -W3 10.44.0.1 >/dev/null \
            && echo "PASS: ctl-2 -> ctl-0 over the mesh" \
            || { echo "::error::ctl-2 could not reach ctl-0 (10.44.0.1) over the mesh"; exit 1; }

      - name: Assert spur.conf carries HA peers[] over mesh IPs and a per-controller node_id
        run: |
          set -euo pipefail
          # peers must list all three controllers' mesh IPs on the raft port.
          for p in 10.44.0.1:6821 10.44.0.2:6821 10.44.0.3:6821; do
            docker exec ctl-0 grep -E '^peers *=' /opt/spur/etc/spur.conf | grep -q "$p" \
              || { echo "::error::spur.conf peers[] on ctl-0 is missing $p"; docker exec ctl-0 grep -E '^peers' /opt/spur/etc/spur.conf; exit 1; }
          done
          echo "PASS: spur.conf peers[] lists all three controllers over mesh IPs"
          # each controller gets a distinct 1-based node_id (its position).
          declare -A wantid=( [ctl-0]=1 [ctl-1]=2 [ctl-2]=3 )
          for n in "${!wantid[@]}"; do
            got=$(docker exec "$n" bash -c "grep -oE '^node_id *= *[0-9]+' /opt/spur/etc/spur.conf | grep -oE '[0-9]+' | head -1")
            [ "$got" = "${wantid[$n]}" ] \
              && echo "PASS: $n node_id = $got" \
              || { echo "::error::$n node_id is '$got', expected ${wantid[$n]}"; exit 1; }
          done

      - name: Assert Raft quorum formed over the mesh (a leader exists and all agents registered)
        run: |
          set -euo pipefail
          # login-0 runs no spurd (login-only), so it is NOT expected to register
          # as a node — only the controllers and the two workers.
          for i in $(seq 1 30); do
            missing=""
            for a in ctl-0 ctl-1 ctl-2 worker-0 worker-1; do
              docker exec ctl-0 /usr/local/bin/spur show node "$a" 2>/dev/null \
                | grep -qx "NodeName=$a" || missing="$missing $a"
            done
            [ -z "$missing" ] && break
            sleep 2
          done
          echo "== spur nodes =="
          docker exec ctl-0 /usr/local/bin/spur nodes
          [ -z "$missing" ] || { echo "::error::nodes never registered over the mesh:$missing"; exit 1; }
          # A scheduled job completing proves the leader is serving writes over
          # the mesh (registration alone can be stale).
          docker exec -u ciuser -w /home/ciuser ctl-0 bash -c '
            set -e
            printf "#!/bin/bash\n#SBATCH --job-name=ha-mesh-smoke\necho ok on \$(hostname)\n" > /tmp/ha.sh
            jid=$(/usr/local/bin/spur submit /tmp/ha.sh | grep -oE "[0-9]+" | head -1)
            for i in $(seq 1 30); do
              st=$(/usr/local/bin/spur show job "$jid" 2>/dev/null | grep -oE "JobState=[A-Z]+" | head -1 | cut -d= -f2)
              [ "$st" = COMPLETED ] && { echo "PASS: job $jid COMPLETED — quorum serving over the mesh"; exit 0; }
              case "$st" in FAILED|CANCELLED|TIMEOUT|NODE_FAIL) echo "job ended $st"; exit 1 ;; esac
              sleep 2
            done
            echo "::error::job never completed — quorum not serving"; exit 1
          '

      # ===================================================================
      # Assertion group 2: node lifecycle (remove_nodes.yml / add_nodes.yml)
      #   Removing worker-1 must drop its WG peer from EVERY surviving mesh
      #   member — controllers AND the other agent (worker-0) AND the login node,
      #   not just controllers (the deferred #23 fast-follow: ghost peer on
      #   agents). Re-adding must refresh its regenerated key on all of them.
      #   We exercise worker-1 (not worker-0) so worker-0 stays as a surviving
      #   agent the removed peer must be cleaned from.
      # ===================================================================
      - name: Capture worker-1's pre-removal WG key; confirm every other member peers it
        run: |
          set -euo pipefail
          wk=$(docker exec worker-1 wg show spur0 public-key | tr -d '[:space:]')
          echo "$wk" > /tmp/worker1-key-before.txt
          echo "worker-1 key before removal: $wk"
          # Every OTHER mesh member (controllers + worker-0 + login-0) should peer it.
          for m in ctl-0 ctl-1 ctl-2 worker-0 login-0; do
            docker exec "$m" bash -c "wg show spur0 peers | grep -qF '$wk'" \
              && echo "PASS: $m knows worker-1 as a peer (pre-removal)" \
              || { echo "::error::$m does not have worker-1 as a peer before removal"; docker exec "$m" wg show spur0; exit 1; }
          done

      - name: remove_nodes.yml worker-1 (must drop its WG peer from ALL surviving members)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci-ha-mesh.ini playbooks/remove_nodes.yml \
            -e @inventory/ci-ha-mesh.vars.yml \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur \
            -e nodes_to_remove=worker-1 \
            -e spur_drain_wait_secs=10

      - name: Assert worker-1's WG peer is gone from EVERY surviving member incl. worker-0 + login-0 (no ghost peer on agents)
        run: |
          set -euo pipefail
          wk=$(cat /tmp/worker1-key-before.txt)
          # THE regression check for the deferred fast-follow: pre-fix, remove_nodes
          # only cleaned controllers, so worker-0 and login-0 kept worker-1 as a
          # ghost peer (persisted via wg-quick save, surviving reboot).
          for m in ctl-0 ctl-1 ctl-2 worker-0 login-0; do
            if docker exec "$m" bash -c "wg show spur0 peers | grep -qF '$wk'"; then
              echo "::error::$m still has worker-1 ($wk) as a WG peer after removal — ghost peer"
              docker exec "$m" wg show spur0
              exit 1
            fi
            echo "PASS: $m no longer peers worker-1"
          done
          docker exec ctl-0 /usr/local/bin/spur show node worker-1 2>/dev/null | grep -qx "NodeName=worker-1" \
            && { echo "::error::worker-1 still registered in the cluster after removal"; exit 1; } \
            || echo "PASS: worker-1 removed from the cluster"

      - name: add_nodes.yml worker-1 (re-add; regenerated key refreshed on all surviving members)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          ansible-playbook -i inventory/ci-ha-mesh.ini playbooks/add_nodes.yml \
            -e @inventory/ci-ha-mesh.vars.yml \
            -e spur_binary_src="$GITHUB_WORKSPACE/spur-bin" \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur \
            -e new_nodes=worker-1

      - name: Assert worker-1 re-registered and its NEW key is consistent on ALL members incl. worker-0 + login-0
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            docker exec ctl-0 /usr/local/bin/spur show node worker-1 2>/dev/null \
              | grep -qx "NodeName=worker-1" && break
            sleep 2
          done
          docker exec ctl-0 /usr/local/bin/spur show node worker-1 2>/dev/null | grep -qx "NodeName=worker-1" \
            || { echo "::error::worker-1 did not re-register after add_nodes.yml"; exit 1; }
          # The re-added worker mints a fresh key (net join on a wiped conf). It
          # must be refreshed on EVERY surviving member — controllers AND the
          # pre-existing worker-0 AND login-0 (the add_nodes mesh play now targets
          # all members + facts for login) — and match worker-1's current key.
          wk_now=$(docker exec worker-1 wg show spur0 public-key | tr -d '[:space:]')
          wk_before=$(cat /tmp/worker1-key-before.txt)
          [ "$wk_now" != "$wk_before" ] \
            && echo "PASS: worker-1 regenerated its WG key on re-add ($wk_before -> $wk_now)" \
            || echo "NOTE: worker-1 key unchanged on re-add (still valid — assert consistency below)"
          for m in ctl-0 ctl-1 ctl-2 worker-0 login-0; do
            docker exec "$m" bash -c "wg show spur0 peers | grep -qF '$wk_now'" \
              && echo "PASS: $m has worker-1's current key" \
              || { echo "::error::$m is missing worker-1's current key $wk_now — stale/ghost after re-add"; docker exec "$m" wg show spur0; exit 1; }
          done

      # ===================================================================
      # Assertion group 3: identity + reboot persistence
      # ===================================================================
      - name: Snapshot every node's WG key, then run an idempotent redeploy
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          set -euo pipefail
          for n in $NODES; do
            docker exec "$n" wg show spur0 public-key | tr -d '[:space:]' > "/tmp/key-$n-pre.txt"
          done
          ansible-playbook -i inventory/ci-ha-mesh.ini playbooks/deploy.yml \
            -e @inventory/ci-ha-mesh.vars.yml \
            -e spur_binary_src="$GITHUB_WORKSPACE/spur-bin" \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur \
            -e spur_verify_enabled=false

      - name: Assert the redeploy did NOT rotate any node's WG key (gate on on-disk conf)
        run: |
          set -euo pipefail
          for n in $NODES; do
            pre=$(cat "/tmp/key-$n-pre.txt")
            post=$(docker exec "$n" wg show spur0 public-key | tr -d '[:space:]')
            [ "$pre" = "$post" ] \
              && echo "PASS: $n WG key unchanged across redeploy" \
              || { echo "::error::$n WG key ROTATED on redeploy ($pre -> $post) — net init/join re-ran on an existing conf"; exit 1; }
          done

      - name: Assert wg-quick down/up preserves both the key and the full peer set (wg-quick save)
        run: |
          set -euo pipefail
          # Simulates a reboot: interface re-created purely from the on-disk conf.
          # Without `wg-quick save` this would restore a near-empty mesh.
          key_before=$(docker exec ctl-1 wg show spur0 public-key | tr -d '[:space:]')
          docker exec ctl-1 wg-quick down spur0
          docker exec ctl-1 wg-quick up spur0
          key_after=$(docker exec ctl-1 wg show spur0 public-key | tr -d '[:space:]')
          [ "$key_before" = "$key_after" ] \
            && echo "PASS: ctl-1 key survived wg-quick down/up" \
            || { echo "::error::ctl-1 key changed across down/up ($key_before -> $key_after)"; exit 1; }
          peers=$(docker exec ctl-1 bash -c "wg show spur0 peers | grep -c . || true")
          [ "$peers" -eq 5 ] \
            && echo "PASS: ctl-1 restored all 5 peers from the saved conf" \
            || { echo "::error::ctl-1 restored $peers peers after down/up, expected 5 — wg-quick save did not persist the full mesh"; docker exec ctl-1 wg show spur0; exit 1; }

      # ===================================================================
      # Assertion group 4: add-node resilience + teardown mesh cleanup
      # ===================================================================
      - name: add_nodes.yml tolerates an unrelated unreachable member (spur_ignore_unreachable_agents)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          set -uo pipefail
          # Stop an unrelated existing agent, remove the node we re-add, then re-add
          # it with worker-0 down. Both plays must complete (tolerate the down
          # member) and the new node must register + mesh. ansible-playbook returns
          # exit 4 when any host was unreachable EVEN WITH ignore_unreachable (the
          # play continues, but the run is flagged) — so accept 4, fail on anything
          # else. The authoritative check is that worker-1 actually re-registers.
          run_tolerating_unreachable() {
            "$@"; local rc=$?
            [ "$rc" -eq 0 ] || [ "$rc" -eq 4 ] || { echo "::error::playbook failed rc=$rc (not the tolerated unreachable-only rc=4)"; return "$rc"; }
            return 0
          }
          docker stop worker-0
          run_tolerating_unreachable ansible-playbook -i inventory/ci-ha-mesh.ini playbooks/remove_nodes.yml \
            -e @inventory/ci-ha-mesh.vars.yml \
            -e spur_install_dir=/usr/local/bin -e spur_home=/opt/spur \
            -e nodes_to_remove=worker-1 -e spur_drain_wait_secs=10 \
            -e spur_ignore_unreachable_agents=true || exit 1
          run_tolerating_unreachable ansible-playbook -i inventory/ci-ha-mesh.ini playbooks/add_nodes.yml \
            -e @inventory/ci-ha-mesh.vars.yml \
            -e spur_binary_src="$GITHUB_WORKSPACE/spur-bin" \
            -e spur_install_dir=/usr/local/bin -e spur_home=/opt/spur \
            -e new_nodes=worker-1 -e spur_ignore_unreachable_agents=true || exit 1
          for i in $(seq 1 30); do
            docker exec ctl-0 /usr/local/bin/spur show node worker-1 2>/dev/null | grep -qx "NodeName=worker-1" && break
            sleep 2
          done
          docker exec ctl-0 /usr/local/bin/spur show node worker-1 2>/dev/null | grep -qx "NodeName=worker-1" \
            && echo "PASS: add_nodes succeeded with an unrelated member (worker-0) down" \
            || { echo "::error::worker-1 did not register — add_nodes aborted on the unreachable member"; exit 1; }

      - name: teardown.yml over the mesh disables wg-quick@ and stops daemons
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          set -euo pipefail
          docker start worker-0
          for i in $(seq 1 15); do
            docker exec worker-0 systemctl is-system-running >/dev/null 2>&1 && break
            sleep 2
          done
          ansible-playbook -i inventory/ci-ha-mesh.ini playbooks/teardown.yml \
            -e @inventory/ci-ha-mesh.vars.yml \
            -e spur_install_dir=/usr/local/bin -e spur_home=/opt/spur
          # wg-quick@ must be disabled on every member, else the mesh silently
          # returns on the next reboot.
          for n in $NODES; do
            en=$(docker exec "$n" systemctl is-enabled wg-quick@spur0 2>/dev/null || true)
            [ "$en" != "enabled" ] \
              && echo "PASS: $n wg-quick@spur0 not enabled ($en)" \
              || { echo "::error::$n still has wg-quick@spur0 ENABLED after teardown — mesh would return on reboot"; exit 1; }
          done
          docker exec ctl-0 systemctl is-active spurctld 2>&1 | grep -qx active \
            && { echo "::error::spurctld still active on ctl-0 after teardown"; exit 1; } \
            || echo "PASS: daemons stopped after teardown"

      - name: Dump logs on failure
        if: failure()
        run: |
          for n in $NODES; do
            echo "===== $n wg show ====="
            docker exec "$n" wg show 2>/dev/null || true
            echo "===== $n journal (spur*) ====="
            docker exec "$n" bash -c 'journalctl -u "spur*" --no-pager | tail -50' || true
          done

      - name: Teardown containers
        if: always()
        run: |
          for n in $NODES; do docker rm -f "$n" || true; done
          docker network rm spur-ci || true

  # ---------------------------------------------------------------------------
  # Job 5: techsupport/spur-techsupport.sh end-to-end over real SSH
  # ---------------------------------------------------------------------------
  techsupport:
    runs-on: ubuntu-latest
    needs: lint
    env:
      NODES: "ctl-0 gpu-1"
    steps:
      - uses: actions/checkout@v4

      - name: Download + verify Spur binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dl-spur-bin
          ( cd dl-spur-bin
            tag=$(gh api repos/ROCm/spur/releases --jq 'map(select(.tag_name != "nightly"))[0].tag_name')
            gh release download "$tag" --repo ROCm/spur \
              --pattern '*-linux-amd64.tar.gz' \
              --pattern '*-linux-amd64.tar.gz.sha256'
            tarball=$(ls *-linux-amd64.tar.gz)
            hash=$(awk '{print $1}' "${tarball}.sha256")
            echo "${hash}  ${tarball}" | sha256sum -c -
            tar xzf "$tarball"
            bindir=$(dirname "$(find . -type f -name spurctld | head -1)")
            mkdir -p "$GITHUB_WORKSPACE/spur-bin"
            for b in spur spurctld spurd; do cp "$bindir/$b" "$GITHUB_WORKSPACE/spur-bin/$b"; done
            chmod +x "$GITHUB_WORKSPACE/spur-bin"/*
          )

      - name: Start systemd containers on a docker network
        env:
          IMG: jrei/systemd-ubuntu:22.04
        run: |
          set -euo pipefail
          docker network create spur-ci-ts
          docker pull "$IMG"
          for n in $NODES; do
            docker run -d --name "$n" --hostname "$n" \
              --network spur-ci-ts \
              --privileged \
              --cgroupns=host \
              -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
              --tmpfs /run --tmpfs /run/lock --tmpfs /tmp \
              "$IMG"
          done

      - name: Wait for systemd to be ready in every container
        run: |
          set -uo pipefail
          for n in $NODES; do
            ok=""
            for i in $(seq 1 30); do
              st=$(docker exec "$n" systemctl is-system-running 2>/dev/null || true)
              case "$st" in running|degraded) ok=1; break ;; esac
              sleep 2
            done
            [ -n "$ok" ] || { echo "::error::systemd never became ready in $n"; exit 1; }
          done

      - name: Install preflight deps + sshd in every container
        run: |
          set -euo pipefail
          for n in $NODES; do
            docker exec "$n" bash -c '
              apt-get update -qq
              apt-get install -y -qq curl tar iproute2 python3 sudo openssh-server postgresql-client
              mkdir -p /root/.ssh && chmod 700 /root/.ssh
              systemctl enable --now ssh
            '
          done

      - name: Install ansible + docker connection plugin
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible-core
          ansible-galaxy collection install community.docker

      - name: deploy.yml (1 ctl + 1 agent, accounting on)
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          # group_vars/ only auto-loads next to the inventory file or the playbook
          # dir; ci-techsupport.ini lives in .github/workflows/ (kept out of
          # inventory/ on purpose), so load the same defaults explicitly.
          # Password contains "@" and "#" on purpose — exercises the redaction
          # regex against more than the plain default (see the password-leak
          # assertion below).
          ansible-playbook -i ../.github/workflows/ci-techsupport.ini playbooks/deploy.yml \
            -e @inventory/group_vars/all.yml \
            -e spur_binary_src="$GITHUB_WORKSPACE/spur-bin" \
            -e spur_install_dir=/usr/local/bin \
            -e spur_home=/opt/spur \
            -e spur_accounting_db_password='p@ss#word'

      - name: Assert the agent registered
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            docker exec ctl-0 /usr/local/bin/spur show node gpu-1 2>/dev/null \
              | grep -qx "NodeName=gpu-1" && { echo "gpu-1 registered"; break; }
            sleep 2
          done

      - name: Wire up passwordless SSH between the containers
        run: |
          set -euo pipefail
          ssh-keygen -t ed25519 -N '' -f ts_key -q
          for n in $NODES; do
            docker exec -i "$n" bash -c 'cat >> /root/.ssh/authorized_keys && chmod 600 /root/.ssh/authorized_keys' < ts_key.pub
          done
          docker cp ts_key ctl-0:/root/.ssh/id_ed25519
          docker exec ctl-0 chmod 600 /root/.ssh/id_ed25519
          # Both containers share the spur-ci-ts network, so ctl-0 can reach
          # gpu-1 by container name; localhost covers ctl-0 collecting itself.
          docker exec ctl-0 ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 root@gpu-1 true
          docker exec ctl-0 ssh -o StrictHostKeyChecking=accept-new -o ConnectTimeout=5 root@localhost true

      - name: Copy spur-techsupport.sh into ctl-0
        run: |
          docker cp techsupport/spur-techsupport.sh ctl-0:/usr/local/bin/spur-techsupport.sh
          docker exec ctl-0 chmod +x /usr/local/bin/spur-techsupport.sh

      - name: Default run — collects everything, must succeed with a clean manifest
        run: |
          set -euo pipefail
          docker exec -e SPUR_HOME=/opt/spur -e SPUR_INSTALL_DIR=/usr/local/bin ctl-0 spur-techsupport.sh \
            --controllers root@localhost --agents root@gpu-1 --acct-host root@localhost \
            --output /root/ts-default
          bundle=$(docker exec ctl-0 bash -c 'ls /root/ts-default/spur-techsupport-*.tar.gz')
          docker cp "ctl-0:$bundle" ts-default.tar.gz
          echo "== manifest =="
          tar xzOf ts-default.tar.gz --wildcards '*/manifest.txt'
          failures=$(tar xzOf ts-default.tar.gz --wildcards '*/manifest.txt' | grep -c '^\[FAILED\]' || true)
          [ "$failures" -eq 0 ] || { echo "::error::default run had $failures FAILED item(s)"; exit 1; }
          for expect in manifest.txt controller-localhost/spurctld.journal.log \
                        controller-localhost/raft-state.tar.gz controller-localhost/spur.conf.sanitized \
                        controller-localhost/build-fingerprint.txt cluster-state/sinfo.txt \
                        accounting/postgres-version.txt accounting/accounting-db.sql \
                        agent-gpu-1/spurd.journal.log \
                        agent-gpu-1/spurd.service agent-gpu-1/build-fingerprint.txt; do
            tar tzf ts-default.tar.gz | grep -q "$expect" || { echo "::error::missing $expect from archive"; exit 1; }
          done

      - name: Assert spur.conf's DB password (containing @ and #) was redacted, not the whole line
        run: |
          set -euo pipefail
          conf=$(tar xzOf ts-default.tar.gz --wildcards '*/controller-localhost/spur.conf.sanitized')
          echo "$conf" | grep -q 'database_url' || { echo "::error::sanitized spur.conf missing database_url entirely"; exit 1; }
          echo "$conf" | grep -qF 'p@ss#word' && { echo "::error::DB password leaked unredacted into the archive"; exit 1; }
          echo "$conf" | grep -q 'REDACTED@' || { echo "::error::database_url password was not redacted"; exit 1; }

      - name: Auto-detect the DB host when --acct-host is omitted
        run: |
          set -euo pipefail
          docker exec -e SPUR_HOME=/opt/spur -e SPUR_INSTALL_DIR=/usr/local/bin ctl-0 spur-techsupport.sh \
            --controllers root@localhost --agents root@gpu-1 \
            --output /root/ts-autodetect
          bundle=$(docker exec ctl-0 bash -c 'ls /root/ts-autodetect/spur-techsupport-*.tar.gz')
          docker cp "ctl-0:$bundle" ts-autodetect.tar.gz
          manifest=$(tar xzOf ts-autodetect.tar.gz --wildcards '*/manifest.txt')
          echo "$manifest" | grep -q '^\[OK\] accounting db: postgres version' || \
            { echo "::error::DB host auto-detection failed to find postgresql on the controller"; echo "$manifest"; exit 1; }

      - name: prefix[N-M] range syntax resolves to the real host
        run: |
          set -euo pipefail
          docker exec -e SPUR_HOME=/opt/spur -e SPUR_INSTALL_DIR=/usr/local/bin ctl-0 spur-techsupport.sh \
            --controllers root@localhost --agents 'root@gpu-[1-1]' --acct-host root@localhost \
            --output /root/ts-range
          bundle=$(docker exec ctl-0 bash -c 'ls /root/ts-range/spur-techsupport-*.tar.gz')
          docker cp "ctl-0:$bundle" ts-range.tar.gz
          tar tzf ts-range.tar.gz | grep -q 'agent-gpu-1/spurd.journal.log' || \
            { echo "::error::root@gpu-[1-1] did not expand to root@gpu-1"; exit 1; }

      - name: --skip-db --skip-raft run — those items must be absent and marked SKIPPED
        run: |
          set -euo pipefail
          docker exec -e SPUR_HOME=/opt/spur -e SPUR_INSTALL_DIR=/usr/local/bin ctl-0 spur-techsupport.sh \
            --controllers root@localhost --agents root@gpu-1 --acct-host root@localhost \
            --skip-db --skip-raft --output /root/ts-skip
          bundle=$(docker exec ctl-0 bash -c 'ls /root/ts-skip/spur-techsupport-*.tar.gz')
          docker cp "ctl-0:$bundle" ts-skip.tar.gz
          tar tzf ts-skip.tar.gz | grep -q 'raft-state.tar.gz' && { echo "::error::raft archive present despite --skip-raft"; exit 1; }
          tar tzf ts-skip.tar.gz | grep -qE 'accounting/(postgres-version.txt|accounting-db.sql)' && { echo "::error::db info present despite --skip-db"; exit 1; }
          manifest=$(tar xzOf ts-skip.tar.gz --wildcards '*/manifest.txt')
          echo "$manifest" | grep -q '\[SKIPPED\].*raft state.*--skip-raft' || { echo "::error::manifest missing raft SKIPPED entry"; exit 1; }
          echo "$manifest" | grep -q '\[SKIPPED\] accounting db (--skip-db)' || { echo "::error::manifest missing db SKIPPED entry"; exit 1; }

      - name: Unreachable agent — fails closed by default, --partial still packages
        run: |
          set -euo pipefail
          if docker exec -e SPUR_HOME=/opt/spur -e SPUR_INSTALL_DIR=/usr/local/bin ctl-0 spur-techsupport.sh \
              --controllers root@localhost --agents root@unreachable-host-ts \
              --acct-host root@localhost --output /root/ts-fail; then
            echo "::error::expected non-zero exit on an unreachable agent without --partial"; exit 1
          fi
          docker exec ctl-0 bash -c 'ls /root/ts-fail/spur-techsupport-*.tar.gz 2>/dev/null' && \
            { echo "::error::archive must not be written on a failed collection without --partial"; exit 1; }

          docker exec -e SPUR_HOME=/opt/spur -e SPUR_INSTALL_DIR=/usr/local/bin ctl-0 spur-techsupport.sh \
            --controllers root@localhost --agents root@unreachable-host-ts \
            --acct-host root@localhost --partial --output /root/ts-partial
          bundle=$(docker exec ctl-0 bash -c 'ls /root/ts-partial/spur-techsupport-*.tar.gz')
          docker cp "ctl-0:$bundle" ts-partial.tar.gz
          tar xzOf ts-partial.tar.gz --wildcards '*/manifest.txt' | grep -q '\[FAILED\].*unreachable-host-ts' || \
            { echo "::error::--partial archive missing the expected FAILED entry"; exit 1; }

      - name: Dump logs on failure
        if: failure()
        run: |
          for n in $NODES; do
            echo "===== $n journal (spur*) ====="
            docker exec "$n" bash -c 'journalctl -u "spur*" --no-pager | tail -50' || true
          done

      - name: Teardown containers
        if: always()
        run: |
          for n in $NODES; do docker rm -f "$n" || true; done
          docker network rm spur-ci-ts || true
