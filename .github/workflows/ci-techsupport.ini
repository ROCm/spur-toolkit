; ============================================================================
; CI inventory for the techsupport job — a lean 2-node cluster (1 controller +
; 1 agent). A dedicated file rather than reusing ansible/inventory/ci.ini's
; 4-host groups: roles template spur.conf from full inventory-group membership
; regardless of any --limit passed to ansible-playbook, so limiting ci.ini's
; 3-agent group down to 1 host would still declare gpu-2/gpu-3 in spur.conf.
; See ci.ini for the docker-connection / ansible_host notes — same setup here.
;
; Lives here rather than ansible/inventory/ (workflow-only, not a real
; deployment inventory) to keep that directory to real/example inventories.
; ============================================================================
[spur_controllers]
ctl-0

[spur_agents]
gpu-1

[spur_accounting_node]

[spur_login]

[all:vars]
ansible_connection=docker
ansible_user=root
spur_transport=direct
